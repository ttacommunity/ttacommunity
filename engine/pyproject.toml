[project]
name = "tta-ratings-engine"
version = "1.3.0"
description = "The ttacommunity rating engine: DANeo's Glicko rating math, run against Postgres"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.26",
    "psycopg[binary]>=3.3",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
strict = true
markers = ["slow: convergence sweeps; CI runs them on main only"]

[tool.ruff]
target-version = "py312"
# Upstream's code, kept as copied until it is refactored. Remove a file once it is.
extend-exclude = [
    "src/tta_ratings_engine/models/glicko2/adaptive_t.py",
    "src/tta_ratings_engine/models/glicko2/engine.py",
    "src/tta_ratings_engine/models/whr/engine.py",
    "src/tta_ratings_engine/models/whr/solver.py",
    "tests/models/glicko2/test_adaptive_t.py",
    "tests/models/glicko2/test_engine.py",
    "tests/models/whr/test_engine.py",
    "tests/models/whr/test_solver.py",
]

[tool.ruff.lint]
extend-select = ["PT"]

[tool.mypy]
python_version = "3.12"
# The adapter layer: database access and the run around the math.
files = [
    "src/tta_ratings_engine/data",
    "src/tta_ratings_engine/progress.py",
    "src/tta_ratings_engine/run.py",
]

# models/ is upstream's calculation (engine.md): read for its types, but its
# own errors are not fixed here, so a type checker never edits the math.
[[tool.mypy.overrides]]
module = ["tta_ratings_engine.models", "tta_ratings_engine.models.*"]
follow_imports = "silent"

# python-dateutil ships no types; its stubs would be one more dependency for one import.
[[tool.mypy.overrides]]
module = ["dateutil", "dateutil.*"]
ignore_missing_imports = true
