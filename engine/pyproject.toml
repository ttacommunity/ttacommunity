[project]
name = "tta-ratings-engine"
version = "1.0.0"
description = "The ttacommunity rating engine: DANeo's Glicko rating math, run against Postgres"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.26",
    "psycopg[binary]>=3.3",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
strict = true
markers = ["slow: convergence sweeps; CI runs them on main only"]

[tool.ruff]
target-version = "py312"
# Upstream's code, kept as copied until it is refactored. Remove a file once it is.
extend-exclude = [
    "src/tta_ratings_engine/models/glicko2/adaptive_t.py",
    "src/tta_ratings_engine/models/glicko2/engine.py",
    "src/tta_ratings_engine/models/whr/engine.py",
    "src/tta_ratings_engine/models/whr/solver.py",
    "tests/models/glicko2/test_adaptive_t.py",
    "tests/models/glicko2/test_engine.py",
    "tests/models/whr/test_engine.py",
    "tests/models/whr/test_solver.py",
]

[tool.ruff.lint]
extend-select = ["PT"]
