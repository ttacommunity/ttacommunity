# A thin wrapper: the ci job runs scripts/ci.sh, the same script developers run.
# Everything runs on the self-hosted amd64 runners; scanners are tagged too.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - secret-detection
  - build

variables:
  SECRET_DETECTION_ENABLED: 'true'
  AST_ENABLE_MR_PIPELINES: 'true'
  CI_IMAGE: docker.io/library/debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
  POSTGRES_IMAGE: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  MISE_VERSION: 'v2026.9.14'
  MISE_YES: '1'
  MISE_TRUSTED_CONFIG_PATHS: ${CI_PROJECT_DIR}

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

.on_change: &on_change
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_PIPELINE_SOURCE == "push"'
  - if: '$CI_PIPELINE_SOURCE == "web"'

# main, dev, schedules and manual runs test every area; other branches only
# the areas their changes reach, listed per job.
.every_area: &every_area
  if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || ($CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "dev"))'

# Each area of scripts/ci.sh is its own job, installing only the tools that
# area needs from mise.toml, so each fits the runners' 1 GiB job limit.
.ci_area:
  stage: test
  tags: [amd64]
  image: ${CI_IMAGE}
  rules: *on_change
  variables:
    APT_EXTRA: ''
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bash ca-certificates curl git jq xz-utils $APT_EXTRA >/dev/null
    - scripts/install-mise.sh "$MISE_VERSION" /usr/local/bin
    - mise install $MISE_TOOLS
    - export PATH="$HOME/.local/share/mise/shims:$PATH"
  script:
    - bash scripts/ci.sh --only "$AREA"

ci-go:
  extends: .ci_area
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
  variables:
  rules:
    - *every_area
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      changes:
        - backend/**/*
        - mise.toml
        - scripts/ci.sh
        - scripts/install-mise.sh
        - .gitlab-ci.yml
  variables:
    AREA: go
    MISE_TOOLS: go
    APT_EXTRA: gcc libc6-dev
    POSTGRES_DB: ttac_test
    POSTGRES_USER: ttac
    POSTGRES_PASSWORD: ci-only-not-a-real-secret
    TEST_DATABASE_URL: 'postgres://ttac:ci-only-not-a-real-secret@127.0.0.1:5432/ttac_test?sslmode=disable'

ci-engine:
  extends: .ci_area
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
  variables:
  rules:
    - *every_area
    # The engine's tests apply the migrations and share cases with the Go port.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      changes:
        - engine/**/*
        - backend/migrations/**/*
        - backend/internal/ratingdelta/testdata/**/*
        - mise.toml
        - scripts/ci.sh
        - scripts/install-mise.sh
        - .gitlab-ci.yml
  variables:
    AREA: engine
    MISE_TOOLS: uv
    POSTGRES_DB: ttac_test
    POSTGRES_USER: ttac
    POSTGRES_PASSWORD: ci-only-not-a-real-secret
    TEST_DATABASE_URL: 'postgres://ttac:ci-only-not-a-real-secret@127.0.0.1:5432/ttac_test?sslmode=disable'

ci-web:
  extends: .ci_area
  rules:
    - *every_area
    # The TS types are generated from the spec; the Access worker's tests run here too.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      changes:
        - web/**/*
        - backend/api/openapi.yaml
        - checks/csp-inline.mjs
        - infra/access-oidc/**/*
        - mise.toml
        - scripts/ci.sh
        - scripts/install-mise.sh
        - .gitlab-ci.yml
  variables:
    AREA: web
    MISE_TOOLS: node

# Warns (never blocks) when Google Fonts has newer files than the committed
# ones; pnpm fonts:update writes them for a reviewed commit.
fonts-check:
  extends: .ci_area
  needs: []
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
  variables:
    MISE_TOOLS: node
  script:
    - cd web/site && node scripts/fonts.mjs check

ci-checks:
  extends: .ci_area
  variables:
    AREA: checks
    MISE_TOOLS: shellcheck

engine-image:
  extends: .ci_area
  stage: build
  # Independent of the tests, so an image can be built to pin before the checks pass.
  needs: []
  variables:
    MISE_TOOLS: uv crane
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes: [engine/**/*, scripts/engine-image.sh, mise.toml]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  script:
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN"
    - ref="${CI_REGISTRY_IMAGE}/engine:sha-${CI_COMMIT_SHORT_SHA}"
    - digest=$(scripts/engine-image.sh "$ref")
    - crane config "$ref" | jq -e '.architecture == "amd64" and .config.User == "65532:65532"'
    - echo "engine image ${ref}@${digest}"

# ko builds in userspace, with mise's Go: the ko image bundles an older Go.
api-image:
  extends: .ci_area
  stage: build
  # Independent of the tests, so an image can be built to pin before the checks pass.
  needs: []
  variables:
    MISE_TOOLS: go ko
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes: [backend/**/*, mise.toml]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  script:
    - ko login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN"
    - cd backend
    - ref=$(KO_DOCKER_REPO="${CI_REGISTRY_IMAGE}/api" ko build ./cmd/api --bare --tags "sha-${CI_COMMIT_SHORT_SHA}")
    - echo "api image ${ref}"

semgrep-sast:
  tags: [amd64]
  rules: *on_change

secret_detection:
  tags: [amd64]
  rules: *on_change
