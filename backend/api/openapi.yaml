          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        kind:
          $ref: "#/components/schemas/TournamentKind"
        top_divisions:
          description: A league's divisions whose final standings make its podium on the site; empty for none
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 64
        rated_player_counts:
