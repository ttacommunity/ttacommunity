        skips:
          description: The rounds they skip or skipped, in order; one not yet published is the next round, which can be undone
          type: array
          items:
            type: integer
    AdminBlitzEdition:
      type: object
      required: [tournament, name, edition, format, points, fide_points, pairing, ranks_fixed_by, entrants, rounds, standings, champion]
      properties:
        ranks_fixed_by:
          description: What fixed the starting ranks when round 1 was paired, rating or lot; null before
          allOf:
            - $ref: "#/components/schemas/RanksFixedBy"
          nullable: true
        pairing:
          $ref: "#/components/schemas/BlitzPairingMethods"
        points:
          $ref: "#/components/schemas/BlitzPoints"
        fide_points:
          description: True when the points are FIDE's, so Reset has nothing to do
          type: boolean
        champion:
          description: The winner of the knockout's final, by username; null until the final has a winner
          type: string
          nullable: true
        tournament:
          type: string
        name:
          type: string
        edition:
          type: string
        format:
          $ref: "#/components/schemas/BlitzFormat"
        entrants:
          description: Every entrant, in sign-up order, dropped ones included
          type: array
          items:
            $ref: "#/components/schemas/AdminBlitzEntrant"
        rounds:
          description: Every round, first first, drafts included
          type: array
          items:
            $ref: "#/components/schemas/AdminBlitzRound"
        standings:
          description: By rank, as the site shows them; dropped players last
          type: array
          items:
            $ref: "#/components/schemas/BlitzStanding"
    AdminMember:
      description: A member of the community as admin sees them
      type: object
      required: [id, name, player, cge_user, discord_name, email, country, zone, utc_offset, banned, ban_reason, banned_at, entries, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          description: The TTA username as in the app
          type: string
        player:
          description: The ratings' spelling of the name, empty for a player the ratings do not know
          type: string
        cge_user:
          description: The CGE account's id, null until known
          type: integer
          nullable: true
        discord_name:
          type: string
        email:
          type: string
        country:
          description: A two-letter country code, null for none
          type: string
          nullable: true
        zone:
          description: The IANA time zone (Europe/Berlin), a region (US East) until it is known, or Unknown
          type: string
        utc_offset:
          description: The zone's offset from UTC now, as +02:00 (a region's is its city's); empty for Unknown
          type: string
        banned:
          type: boolean
        ban_reason:
          type: string
        banned_at:
          type: string
          format: date-time
          nullable: true
        entries:
          description: How many editions the member is in
          type: integer
        created_at:
          type: string
          format: date-time
    NewMember:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: The TTA username as in the app
          type: string
          minLength: 1
          maxLength: 100
        discord_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        country:
          description: A two-letter country code
          type: string
          maxLength: 2
        zone:
          description: An IANA time zone (Europe/Berlin), a region (US East) from GET /v1/admin/regions, or Unknown, the default
          type: string
          minLength: 1
          maxLength: 64
    MemberChange:
      description: What to change; a field left out stays as it is
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        discord_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        country:
          description: A two-letter country code, or empty for none
          type: string
          maxLength: 2
        zone:
          type: string
          minLength: 1
          maxLength: 64
        cge_user:
          description: The CGE account's id, which the data must know; 0 unlinks it
          type: integer
          minimum: 0
    MemberAdded:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    MemberBan:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    BlitzPoints:
      description: |
        What each outcome is worth in an edition's standings, 0 to 10 in
        halves, a win at least a draw and a draw at least a loss. FIDE's
        by default: win 1, draw 0.5, loss 0, a forfeit as a win or a loss,
        the bye 1 and a skipped round 0. A ruled draw scores as a draw; a
        "both lose" ruling is a forfeit loss each.
      type: object
      additionalProperties: false
      required: [win, draw, loss, forfeit_win, forfeit_loss, bye, skip]
      properties:
        win:
          type: number
          format: double
          minimum: 0
          maximum: 10
          multipleOf: 0.5
        draw:
          type: number
          format: double
          minimum: 0
          maximum: 10
          multipleOf: 0.5
        loss:
          type: number
          format: double
          minimum: 0
          maximum: 10
          multipleOf: 0.5
        forfeit_win:
          type: number
          format: double
          minimum: 0
          maximum: 10
          multipleOf: 0.5
        forfeit_loss:
          type: number
          format: double
          minimum: 0
          maximum: 10
          multipleOf: 0.5
        bye:
          description: The pairing's bye
          type: number
          format: double
          minimum: 0
          maximum: 10
          multipleOf: 0.5
        skip:
          description: A round the player asked to sit out
          type: number
          format: double
          minimum: 0
          maximum: 10
          multipleOf: 0.5
    BlitzDiscordText:
      description: A round's games as text to paste into Discord
      type: object
      required: [text]
      properties:
        text:
          type: string
    BlitzDeadline:
      description: A deadline, and the time zone it was set in
      type: object
      required: [at, zone]
      properties:
        at:
          type: string
          format: date-time
        zone:
          description: An IANA time zone, a region (US East) or Unknown (UTC)
          type: string
    BlitzDeadlineSet:
      description: A deadline as a day and a time on the clocks of a time zone
      type: object
      additionalProperties: false
      required: [day, time, zone]
      properties:
        day:
          type: string
          format: date
        time:
          description: As 12:00 on the clocks of zone
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        zone:
          description: An IANA time zone, a region (US East) or Unknown (UTC), whose clocks the day and time are on
          type: string
          minLength: 1
          maxLength: 64
    BlitzGameRecord:
      description: A played game, with the share code, each side as the match names them (with their turn), and when it finished
      type: object
      additionalProperties: false
      required: [share_code, a, b, finished_on, finished_time, zone]
      properties:
        share_code:
          description: Empty for a game without one
          type: string
          maxLength: 32
        a:
          $ref: "#/components/schemas/BlitzGameSide"
        b:
          $ref: "#/components/schemas/BlitzGameSide"
        finished_on:
          description: The day it finished, on the clocks of zone
          type: string
          format: date
        finished_time:
          description: The time it finished, as 21:30 on the clocks of zone. A finish after the current minute is refused
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        zone:
          description: An IANA time zone, a region (US East) or Unknown (UTC), whose clocks the day and time are on
          type: string
          minLength: 1
          maxLength: 64
    BlitzGameSide:
      type: object
      additionalProperties: false
      required: [culture, outcome, turn]
      properties:
        culture:
          description: Ignored (0) for a player who resigned or timed out
          type: number
          format: double
          minimum: 0
        outcome:
          $ref: "#/components/schemas/SeatOutcome"
        turn:
          description: |
            The player's place in the turn order, 1 for the player who went
            first. A game's players take 1 to N, each once
          type: integer
          minimum: 1
          maximum: 4
    BlitzFlag:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          description: What is wrong with the reported result
          type: string
          minLength: 1
          maxLength: 500
    BlitzReport:
      description: |
        Where a player's report stands: reported (the reporter may still
        correct it), confirmed by the opponent, flagged by the opponent, or
        resolved by an organiser
      type: string
      enum: [reported, confirmed, flagged, resolved]
    MyBlitz:
      type: object
      required: [match]
      properties:
        match:
          allOf:
            - $ref: "#/components/schemas/MyBlitzMatch"
          nullable: true
    MyBlitzMatch:
      description: A signed-in player's match, sides as the match names them, and what they may do with it now
      type: object
      required: [id, round, a, b, me, result, game, ruled, report, reported_by, flag_reason, actions]
      properties:
        id:
          type: integer
          format: int64
        round:
          type: integer
        a:
          type: string
        b:
          description: Null for the bye
          type: string
          nullable: true
        me:
          description: Which side the player is
          allOf:
            - $ref: "#/components/schemas/MatchSide"
        result:
          allOf:
            - $ref: "#/components/schemas/BlitzResult"
          nullable: true
        game:
          allOf:
            - $ref: "#/components/schemas/BlitzPlayedGame"
          nullable: true
        ruled:
          description: Whether the result is the organisers' ruling
          type: boolean
        report:
          description: Null when no player reported the game
          allOf:
            - $ref: "#/components/schemas/BlitzReport"
          nullable: true
        reported_by:
          description: Which side reported the game; null when no player did
          allOf:
            - $ref: "#/components/schemas/MatchSide"
          nullable: true
        flag_reason:
          description: The opponent's reason when the report was flagged, else empty
          type: string
        actions:
          description: |
            What the player may do now: report (or correct their report),
            confirm or flag the opponent's report. Empty once players can no
            longer change it
          type: array
          items:
            type: string
            enum: [report, confirm, flag]
    BlitzRuling:
      type: object
      additionalProperties: false
      required: [result, reason]
      properties:
        result:
          $ref: "#/components/schemas/BlitzResult"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    NewBlitzEntrant:
      description: |
        A member to enter: by id, any details given (not empty) saved on the member, or by TTA username with the
        details a new member needs when the name is not a member yet
      type: object
      additionalProperties: false
      properties:
        member:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        discord_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        country:
          description: A two-letter country code
          type: string
          maxLength: 2
        zone:
          description: An IANA time zone (Europe/Berlin), a region (US East) from GET /v1/admin/regions, or Unknown, the default
          type: string
          minLength: 1
          maxLength: 64
    Candidate:
      description: Someone admin may add or enter, a member or a player the ratings know, with what is known of them
      type: object
      required: [member, name, player, discord_name, email, country, zone, banned]
      properties:
        member:
          description: The member's id, null for a player the ratings know who is no member yet
          type: integer
          format: int64
          nullable: true
        name:
          description: The TTA username, or the ratings' spelling for a player who is no member
          type: string
        player:
          description: The ratings' spelling of the name, empty for a member the ratings do not know
          type: string
        discord_name:
          type: string
        email:
          type: string
        country:
          description: A two-letter country code, null for none
          type: string
          nullable: true
        zone:
          description: The member's zone, null for a player who is no member
          type: string
          nullable: true
        banned:
          description: A banned member, who cannot be entered
          type: boolean
    Region:
      description: A zone a member may have besides an IANA one
      type: object
      required: [name, zone, utc_offset]
      properties:
        name:
          description: The region's name (US East), or Unknown
          type: string
        zone:
          description: The IANA zone whose time the region keeps; empty for Unknown
          type: string
        utc_offset:
          description: Its offset from UTC now, as -04:00; empty for Unknown
          type: string
    NewBlitzEntrants:
      type: object
      additionalProperties: false
      required: [entrants]
      properties:
        entrants:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/NewBlitzEntrant"
    BlitzSkip:
      type: object
      required: [round]
      properties:
        round:
          description: The number of the round skipped
          type: integer
    BlitzEntrantIds:
      type: object
      required: [ids]
      properties:
        ids:
          description: The new entrants' ids, in the order given
          type: array
          items:
            type: integer
            format: int64
    BlitzEntrantChange:
      description: What to change, the entrant's status or the member's details; a field left out stays as it is
      type: object
      additionalProperties: false
      properties:
        discord_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        country:
          description: A two-letter country code, or empty for none
          type: string
          maxLength: 2
        zone:
          type: string
          minLength: 1
          maxLength: 64
        status:
          $ref: "#/components/schemas/EntrantStatus"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        request_id:
          type: string
          description: |
            On a server error (500), the request's id, as in the
            `X-Request-Id` header every response carries. Quote it when
            reporting the problem: it finds the error in the API's log.
    Run:
      type: object
      required: [run_id, published_at, engine_version, finished_at, games, players, first_game, last_game]
      properties:
        run_id:
          type: integer
          format: int64
        published_at:
          type: string
          format: date-time
        engine_version:
          description: The commit the engine that computed the run was built from
          type: string
        finished_at:
          description: When the run was computed
          type: string
          format: date-time
          nullable: true
        games:
          description: The games the run rated; null for a run computed before runs recorded it
          type: integer
          nullable: true
        players:
          description: The players the run rated; null for a run computed before runs recorded it
          type: integer
          nullable: true
        first_game:
          description: The date of the run's first game; null for a run computed before runs recorded it
          type: string
          format: date
          nullable: true
        last_game:
          description: The date of the run's last game; null for a run computed before runs recorded it
          type: string
          format: date
          nullable: true
    SiteVisits:
      type: object
      required: [visits, days, as_of]
      properties:
        visits:
          description: The visits in the `days` days up to `as_of`, an estimate from Cloudflare's sample
          type: integer
        days:
          description: How many days the count covers
          type: integer
        as_of:
          description: When the visits were counted
          type: string
          format: date-time
    Model:
      description: |
        The rating model: Glicko-D, continuous (`glicko2_daneo`) or reset
        gently each season (`glicko2_daneo_softer`), or standard Glicko-2
        (`glicko2_std`), the benchmark. The other models of upstream's site
        were retired in 2026-10 and are refused.
      type: string
      default: glicko2_daneo
      enum:
        - glicko2_daneo
        - glicko2_daneo_softer
        - glicko2_std
    Format:
      description: Players per game. 0 is every format together
      type: integer
      default: 0
      enum: [0, 2, 3, 4]
    Leaderboard:
      type: object
      required: [run_id, model, format, players]
      properties:
        run_id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        players:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardRow"
    LeaderboardRow:
      type: object
      required: [rank, rank_delta, name, rating, rd, c_rating, games, opponents, wins, losses, draws, win_rate, last_played, country, title]
      properties:
        rank:
          type: integer
          nullable: true
        rank_delta:
          type: integer
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          description: Rating deviation
          type: number
          format: double
        c_rating:
          description: Conservative rating, which the rank is ordered by
          type: number
          format: double
        games:
          type: integer
        opponents:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100
          type: number
          format: double
        last_played:
          type: string
          format: date
          nullable: true
        country:
          description: The player's country, ISO 3166-1 alpha-2, if known
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
        badges:
          description: Badges admin gave the player, by label, shown beside the title
          type: array
          items:
            $ref: "#/components/schemas/ExtraBadge"
    History:
      type: object
      required: [run_id, model, format, at, players]
      properties:
        run_id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        at:
          description: The date asked for, or the previous period's when none was
          type: string
          format: date
        players:
          type: array
          items:
            $ref: "#/components/schemas/HistoryRow"
    HistoryRow:
      type: object
      required: [name, rating, rd, c_rating]
      properties:
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
    TitleCode:
      type: string
      enum: [WC, SGM, WCS, WCB, GM, M, P, G, S, B, W]
    Role:
      description: What a person may do in admin
      type: string
      enum: [admin, organiser]
    EntrantStatus:
      description: Whether a blitz entrant is in the rounds still to come
      type: string
      enum: [active, dropped]
    RoundKind:
      description: A Swiss round, or a knockout round
      type: string
      enum: [swiss, knockout]
    RanksFixedBy:
      description: What fixed a blitz edition's starting ranks
      type: string
      enum: [rating, lot]
    PodiumSource:
      description: How a tournament's podium is chosen
      type: string
      enum: [top_divisions, final_stage, recorded, none]
    GameState:
      description: A game's state
      type: string
      enum: [played, never_played, unconfirmed, running, prepared]
    SeatTier:
      description: A seat analysis' group of players, by rating
      type: string
      enum: [all, grandmaster, master, advanced, intermediate, beginner]
    MatchSide:
      description: A side of a blitz match
      type: string
      enum: [a, b]
    RequestStatus:
      description: Where a request to be linked to a member stands
      type: string
      enum: [pending, approved, refused]
    LinkedHow:
      description: How an account was linked to its member
      type: string
      enum: [match, approved]
    Title:
      description: The tournament title the run derived for the player, if any
      type: object
      nullable: true
      required: [code, count, reason]
      properties:
        code:
          $ref: "#/components/schemas/TitleCode"
        count:
          description: How many titles the player has earned
          type: integer
        reason:
          description: Why the player holds it, e.g. the latest division played
          type: string
    Player:
      type: object
      required: [run_id, name, country, title, peak, last_played, newest_game, games, ratings]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          description: The player's name as stored, whatever case was asked for
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
        badges:
          description: Badges admin gave the player, by label, shown beside the title
          type: array
          items:
            $ref: "#/components/schemas/ExtraBadge"
        peak:
          $ref: "#/components/schemas/Peak"
        last_played:
          type: string
          format: date
          nullable: true
        newest_game:
          description: The date of the newest game in the run, by anyone
          type: string
          format: date
          nullable: true
        games:
          description: How many games the player has in the run, by format (0 is all)
          type: array
          items:
            $ref: "#/components/schemas/FormatGames"
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRating"
    Peak:
      description: The player's best title over their career, if any
      type: object
      nullable: true
      required: [code, year]
      properties:
        code:
          $ref: "#/components/schemas/TitleCode"
        year:
          type: integer
          nullable: true
    FormatGames:
      type: object
      required: [format, games]
      properties:
        format:
          $ref: "#/components/schemas/Format"
        games:
          type: integer
    FormatGamesAndPairs:
      type: object
      required: [format, games, pairs]
      properties:
        format:
          $ref: "#/components/schemas/Format"
        games:
          type: integer
        pairs:
          description: The one-to-one pairs the engine rated from those games
          type: integer
    PlayerRating:
      type: object
      required: [model, format, rank, rating, rd, c_rating, opponents, win_rate]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        rank:
          type: integer
          nullable: true
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        opponents:
          type: integer
        win_rate:
          description: Percent, 0 to 100
          type: number
          format: double
    PlayerHistory:
      type: object
      required: [run_id, name, format, series]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        series:
          type: array
          items:
            $ref: "#/components/schemas/HistorySeries"
    HistorySeries:
      type: object
      required: [model, points]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        points:
          description: Oldest first
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"
    HistoryPoint:
      type: object
      required: [date, rating, c_rating]
      properties:
        date:
          type: string
          format: date
        rating:
          type: number
          format: double
        c_rating:
          type: number
          format: double
    PlayerMatches:
      type: object
      required: [run_id, name, format, model, page, pages, total, matches]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        model:
          $ref: "#/components/schemas/Model"
        page:
          type: integer
        pages:
          type: integer
        total:
          description: The player's games in this format
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/PlayerMatch"
    PlayerMatch:
      type: object
      required: [match_id, tournament, date, player_count, placement, replay_code, rating_delta, seats]
      properties:
        match_id:
          type: integer
          format: int64
        tournament:
          type: string
        date:
          type: string
          format: date
        player_count:
          type: integer
        placement:
          description: The player's place, 1 for the highest score
          type: integer
        replay_code:
          type: string
          nullable: true
        rating_delta:
          description: What the game is worth to the player's rating from its pre-month baseline, to 0.1
          type: number
          format: double
          nullable: true
        seats:
          description: Seat order
          type: array
          items:
            $ref: "#/components/schemas/Seat"
    Seat:
      description: |
        One player of a game. A player whose CGE account is deleted or banned
        is masked as "Deleted player".
      type: object
      required: [name, score]
      properties:
        name:
          type: string
        score:
          type: number
          format: double
    PlayerRivals:
      type: object
      required: [run_id, name, format, rivals]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        rivals:
          description: Most games first
          type: array
          items:
            $ref: "#/components/schemas/Rival"
    Rival:
      type: object
      required: [name, games, wins, losses, draws, win_rate]
      properties:
        name:
          type: string
        games:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
    PlayerCareer:
      type: object
      required: [run_id, name, format, model, years, peak]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        model:
          $ref: "#/components/schemas/Model"
        years:
          description: Oldest first
          type: array
          items:
            $ref: "#/components/schemas/CareerYear"
        peak:
          description: The player's peak in `model` and the format; none without history there
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CareerPeak"
    CareerYear:
      type: object
      required: [year, opponents, wins, losses, draws, win_rate, peak_rating, title, year_end_rating, career_opponents, career_wins, career_losses, career_draws, career_win_rate]
      properties:
        year:
          type: integer
        opponents:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
        peak_rating:
          description: The year's highest rating in `model`, to 0.1
          type: number
          format: double
          nullable: true
        year_end_rating:
          description: The last rating that year in `model`, to 0.1
          type: number
          format: double
          nullable: true
        career_opponents:
          description: Opponents from the first year to the end of this one
          type: integer
        career_wins:
          type: integer
        career_losses:
          type: integer
        career_draws:
          type: integer
        career_win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
        title:
          description: The best title the run derived for the player that year
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TitleCode"
    CareerPeak:
      type: object
      required: [rating, rank, date]
      properties:
        rating:
          description: The highest rating, to 0.1; the first period with it when tied
          type: number
          format: double
        rank:
          description: 1 + how many players rated that period had a higher conservative rating than the player
          type: integer
        date:
          type: string
          format: date
    PlayerVersus:
      type: object
      required: [run_id, name, other, matches]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        other:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/VersusMatch"
    VersusMatch:
      type: object
      required: [match_id, tournament, date, player_count, name_place, other_place, seats, replay_code]
      properties:
        match_id:
          type: integer
          format: int64
        tournament:
          type: string
        date:
          type: string
          format: date
        player_count:
          type: integer
        name_place:
          type: integer
        other_place:
          type: integer
        replay_code:
          type: string
          nullable: true
        seats:
          description: Highest score first
          type: array
          items:
            $ref: "#/components/schemas/Seat"
    PlayerMatrix:
      type: object
      required: [run_id, name, format, year, cells]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        year:
          description: The year asked for, or null for the run's ratings
          type: integer
          nullable: true
        cells:
          type: array
          items:
            $ref: "#/components/schemas/MatrixCell"
    MatrixCell:
      type: object
      required: [model, rating, rd, c_rating, rank]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        rank:
          type: integer
          nullable: true
    Years:
      type: object
      required: [run_id, years]
      properties:
        run_id:
          type: integer
          format: int64
        years:
          description: Newest first
          type: array
          items:
            $ref: "#/components/schemas/YearEntry"
    YearEntry:
      type: object
      required: [year, champion]
      properties:
        year:
          type: integer
        champion:
          description: True if the run derived a World Champion for the year
          type: boolean
    YearLeaderboard:
      type: object
      required: [run_id, year, model, format, snapshot, previous, games, champions, players]
      properties:
        run_id:
          type: integer
          format: int64
        year:
          type: integer
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        snapshot:
          description: The rating period the board is taken from
          type: string
          format: date
        previous:
          description: The previous year's last period, which the changes compare with
          type: string
          format: date
          nullable: true
        games:
          description: Games the run rated that year, in every format
          type: integer
        champions:
          type: array
          items:
            $ref: "#/components/schemas/Champion"
        players:
          type: array
          items:
            $ref: "#/components/schemas/YearRow"
    Champion:
      type: object
      required: [name, reigning]
      properties:
        name:
          type: string
        reigning:
          description: True for the current champion, in the run's latest year
          type: boolean
    YearRow:
      type: object
      required: [name, rating, rd, c_rating, country, title, season, career, last_played, previous]
      properties:
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
        season:
          $ref: "#/components/schemas/YearRecord"
        career:
          $ref: "#/components/schemas/YearRecord"
        last_played:
          description: The player's last game that year
          type: string
          format: date
          nullable: true
        previous:
          $ref: "#/components/schemas/PreviousRating"
    YearRecord:
      type: object
      required: [opponents, wins, losses, draws, win_rate]
      properties:
        opponents:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
    PreviousRating:
      description: The player's rating on the previous year's last period, if they had one
      type: object
      nullable: true
      required: [rating, rd, c_rating]
      properties:
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
    Calibration:
      type: object
      required: [run_id, rows]
      properties:
        run_id:
          type: integer
          format: int64
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CalibrationRow"
    CalibrationRow:
      type: object
      required: [mode, model, format, matches, brier, ece, log_loss, accuracy, bins]
      properties:
        mode:
          type: string
          enum: [standard, walk_forward]
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        matches:
          description: Games evaluated
          type: integer
        brier:
          type: number
          format: double
        ece:
          description: Expected calibration error, 0 to 1
          type: number
          format: double
        log_loss:
          type: number
          format: double
          nullable: true
        accuracy:
          description: Percent
          type: number
          format: double
          nullable: true
        bins:
          $ref: "#/components/schemas/CalibrationBins"
    CalibrationBins:
      description: Predicted against actual win rate, bin by bin
      type: object
      required: [labels, ideal, preds, actuals, counts]
      properties:
        labels:
          type: array
          items:
            type: string
        ideal:
          type: array
          items:
            type: number
            format: double
        preds:
          type: array
          items:
            type: number
            format: double
        actuals:
          type: array
          items:
            type: number
            format: double
        counts:
          type: array
          items:
            type: integer
    Distribution:
      type: object
      required: [run_id, format, labels, engines]
      properties:
        run_id:
          type: integer
          format: int64
        format:
          $ref: "#/components/schemas/Format"
        labels:
          type: array
          items:
            type: string
        engines:
          type: array
          items:
            $ref: "#/components/schemas/EngineDistribution"
    EngineDistribution:
      type: object
      required: [model, counts, mean, active_mean]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        counts:
          type: array
          items:
            type: integer
        mean:
          type: number
          format: double
        active_mean:
          type: number
          format: double
    Agreement:
      type: object
      required: [run_id, format, sample, top, weakest]
      properties:
        run_id:
          type: integer
          format: int64
        format:
          $ref: "#/components/schemas/Format"
        sample:
          description: Players rated in all ten models with 15 or more opponents
          type: integer
        top:
          type: array
          items:
            $ref: "#/components/schemas/ModelPair"
        weakest:
          type: array
          items:
            $ref: "#/components/schemas/ModelPair"
    ComparedPlayers:
      type: object
      required: [run_id, format, players]
      properties:
        run_id:
          type: integer
          format: int64
        format:
          $ref: "#/components/schemas/Format"
        players:
          type: array
          items:
            $ref: "#/components/schemas/ComparedPlayer"
    ComparedPlayer:
      type: object
      required: [name, country, title, ratings]
      properties:
        name:
          type: string
        country:
          description: The player's country, ISO 3166-1 alpha-2, if known
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          allOf:
            - $ref: "#/components/schemas/TitleCode"
          nullable: true
        ratings:
          description: One per model the player is rated in, in upstream's order
          type: array
          items:
            $ref: "#/components/schemas/ComparedRating"
    ComparedRating:
      type: object
      required: [model, rank, rating, rd, c_rating, opponents, win_rate]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        rank:
          type: integer
          nullable: true
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        opponents:
          type: integer
        win_rate:
          description: Percent
          type: number
          format: double
    Activity:
      type: object
      required: [run_id, active, inactive, formats, titles, countries]
      properties:
        run_id:
          type: integer
          format: int64
        active:
          description: Players whose last game is after the site's inactive cutoff
          type: integer
        inactive:
          type: integer
        formats:
          description: Games per format, 2 to 4 players
          type: array
          items:
            $ref: "#/components/schemas/FormatGamesAndPairs"
        titles:
          description: Players per title, most first
          type: array
          items:
            $ref: "#/components/schemas/TitlePlayers"
        countries:
          type: array
          items:
            $ref: "#/components/schemas/CountryRatings"
    TitlePlayers:
      type: object
      required: [code, players]
      properties:
        code:
          $ref: "#/components/schemas/TitleCode"
        players:
          type: integer
    CountryRatings:
      description: A country's rated players and their average Glicko-2 Standard rating, overall and by title
      type: object
      required: [country, players, gm, m_plus, p_plus, all]
      properties:
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        players:
          type: integer
        gm:
          type: number
          format: double
          nullable: true
        m_plus:
          description: Grandmasters and Masters
          type: number
          format: double
          nullable: true
        p_plus:
          description: Grandmasters, Masters and Platinum
          type: number
          format: double
          nullable: true
        all:
          type: number
          format: double
    SeatAnalysis:
      type: object
      required: [run_id, tier, groups]
      properties:
        run_id:
          type: integer
          format: int64
        tier:
          $ref: "#/components/schemas/SeatTier"
        groups:
          description: Seat statistics grouped by player count (2P, 3P, 4P)
          type: array
          items:
            $ref: "#/components/schemas/SeatStatsGroup"
    SeatStatsGroup:
      type: object
      required: [player_count, total_games, seats]
      properties:
        player_count:
          type: integer
          minimum: 2
          maximum: 4
        total_games:
          type: integer
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatWinrateRow"
    SeatWinrateRow:
      type: object
      required: [seat, games, wins, draws, win_rate, places]
      properties:
        seat:
          description: 1-indexed turn position (Seat 1 = starting player)
          type: integer
          minimum: 1
          maximum: 4
        games:
          type: integer
        wins:
          description: Outright wins (sole 1st place finishes)
          type: integer
        draws:
          description: Tied games for 1st place
          type: integer
        win_rate:
          description: Win rate as a percentage rounded to two decimals (ties for 1st count as 1/k of a win)
          type: number
          format: double
        places:
          description: Detailed placement breakdown (1st, 2nd, 3rd, 4th)
          type: array
          items:
            $ref: "#/components/schemas/SeatPlaceRate"
    SeatPlaceRate:
      type: object
      required: [place, count, rate]
      properties:
        place:
          description: 1-indexed placement finish (1 = 1st place)
          type: integer
          minimum: 1
          maximum: 4
        count:
          type: integer
        rate:
          description: Placement rate as a percentage rounded to two decimals
          type: number
          format: double
    PlayerSeatStats:
      type: object
      required: [run_id, name, unrated, groups, overall]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        unrated:
          type: boolean
        groups:
          description: Seat statistics grouped by format (2P, 3P, 4P)
          type: array
          items:
            $ref: "#/components/schemas/PlayerSeatGroup"
        overall:
          $ref: "#/components/schemas/PlayerSeatOverview"
    PlayerSeatOverview:
      type: object
      required: [total_games, total_wins, total_draws, win_rate, avg_culture, strongest_seat, weakest_seat]
      properties:
        total_games:
          type: integer
        total_wins:
          type: integer
        total_draws:
          type: integer
        win_rate:
          type: number
          format: double
        avg_culture:
          type: number
          format: double
        strongest_seat:
          $ref: "#/components/schemas/PlayerSeatDelta"
          nullable: true
        weakest_seat:
          $ref: "#/components/schemas/PlayerSeatDelta"
          nullable: true
    PlayerSeatDelta:
      type: object
      nullable: true
      required: [player_count, seat, win_rate, delta_win_rate]
      properties:
        player_count:
          type: integer
        seat:
          type: integer
        win_rate:
          type: number
          format: double
        delta_win_rate:
          description: Difference in percentage points between this seat winrate and the format overall winrate
          type: number
          format: double
    PlayerSeatGroup:
      type: object
      required: [player_count, total_games, total_wins, total_draws, win_rate, avg_culture, seats]
      properties:
        player_count:
          type: integer
          minimum: 2
          maximum: 4
        total_games:
          type: integer
        total_wins:
          type: integer
        total_draws:
          type: integer
        win_rate:
          type: number
          format: double
        avg_culture:
          type: number
          format: double
        seats:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSeatRow"
    PlayerSeatRow:
      type: object
      required: [seat, games, wins, draws, win_rate, delta_win_rate, avg_culture, places]
      properties:
        seat:
          description: 1-indexed turn position (Seat 1 = starting player)
          type: integer
          minimum: 1
          maximum: 4
        games:
          type: integer
        wins:
          description: Outright wins (sole 1st place finishes)
          type: integer
        draws:
          description: Tied games for 1st place
          type: integer
        win_rate:
          type: number
          format: double
        delta_win_rate:
          description: Win rate minus group overall win rate
          type: number
          format: double
        avg_culture:
          type: number
          format: double
        places:
          type: array
          items:
            $ref: "#/components/schemas/SeatPlaceRate"
    ModelPair:
      type: object
      required: [a, b, pearson, spearman]
      properties:
        a:
          $ref: "#/components/schemas/Model"
        b:
          $ref: "#/components/schemas/Model"
        pearson:
          type: number
          format: double
        spearman:
          type: number
          format: double
    PlayerAchievements:
      type: object
      required: [run_id, name, summary, records]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        summary:
          $ref: "#/components/schemas/AchievementSummary"
        records:
          description: Latest finish first; a career total's finish_date is a label, not a date
          type: array
          items:
            $ref: "#/components/schemas/TournamentRecord"
    AchievementSummary:
      description: Null for a player with no medal in the four major circuits
      type: object
      nullable: true
      required: [world_titles, international_titles, intermezzo_titles, royal_league_titles, gold, silver, bronze, accolades]
      properties:
        world_titles:
          type: integer
        international_titles:
          type: integer
        intermezzo_titles:
          type: integer
        royal_league_titles:
          type: integer
        gold:
          type: integer
        silver:
          type: integer
        bronze:
          type: integer
        accolades:
          description: At most six, in the order the page features them
          type: array
          items:
            type: string
    TournamentRecord:
      type: object
      required: [tournament, season, division, placement, points, medal, details, finish_date, career]
      properties:
        tournament:
          type: string
        season:
          type: string
        division:
          type: string
        placement:
          type: string
        points:
          type: string
        medal:
          type: string
          enum: [gold, silver, bronze]
          nullable: true
        details:
          type: string
        finish_date:
          type: string
        career:
          description: A career total, not one season or tournament
          type: boolean
    CommunityEdition:
      description: An edition of the community leaderboard (slug identifier)
      type: string
    CommunityEditionInfo:
      type: object
      required: [id, name, title, short, badge, year, wc, wc_desc, maintainer, maintainer_note]
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
        short:
          type: string
        badge:
          type: string
        year:
          type: integer
        wc:
          description: |
            The World Champion reigning in the edition's year, "" for none, or
            "Deleted player" when their CGE account is deleted or banned
          type: string
        wc_desc:
          description: What the champion is, such as "Reigning World Champion (2025)"; "" for none
          type: string
        maintainer:
          type: string
        maintainer_note:
          type: string
    CommunityEventColumn:
      type: object
      required: [id, name, short, max_pts]
      properties:
        id:
          type: string
        name:
          type: string
        short:
          type: string
        max_pts:
          description: The most points the event's points table gives in the edition's year; null when no table is held
          type: integer
          nullable: true
        desc:
          type: string
    CommunityCategory:
      type: object
      required: [category, badge_class, columns]
      properties:
        category:
          type: string
        badge_class:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/CommunityEventColumn"
    CommunitySummaryGroup:
      type: object
      required: [id, name, short, cols, max_pts, badge_class, desc]
      properties:
        id:
          type: string
        name:
          type: string
        short:
          type: string
        cols:
          type: array
          items:
            type: string
        max_pts:
          description: The sum of its columns' most points; null when any column's is unknown
          type: integer
          nullable: true
        badge_class:
          type: string
        desc:
          type: string
    CommunityEditionItem:
      type: object
      required: [slug, name, title, short_name, badge, maintainer, maintainer_note, year, counting_events, visible, sort_order]
      properties:
        slug:
          type: string
        name:
          type: string
        title:
          type: string
        short_name:
          type: string
        badge:
          type: string
        maintainer:
          type: string
        maintainer_note:
          type: string
        year:
          type: integer
        counting_events:
          type: integer
        visible:
          type: boolean
        sort_order:
          type: integer
    CommunityEditionPatch:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        short_name:
          type: string
        badge:
          type: string
        maintainer:
          type: string
        maintainer_note:
          type: string
        year:
          type: integer
        counting_events:
          type: integer
        visible:
          type: boolean
        sort_order:
          type: integer
    CommunityLeaderboard:
      type: object
      required: [run_id, edition, info, categories, summary, counting_events, rows]
      properties:
        run_id:
          type: integer
          format: int64
        edition:
          $ref: "#/components/schemas/CommunityEdition"
        info:
          $ref: "#/components/schemas/CommunityEditionInfo"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CommunityCategory"
        summary:
          type: array
          items:
            $ref: "#/components/schemas/CommunitySummaryGroup"
        counting_events:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CommunityRow"
    CommunityRow:
      type: object
      required: [rank, name, country, title, points, events, scores]
      properties:
        rank:
          type: integer
        name:
          description: As the leaderboard writes it
          type: string
        country:
          type: string
          nullable: true
        title:
          description: The run's title for the player, null when none or not a player here
          allOf:
            - $ref: "#/components/schemas/TitleCode"
          nullable: true
        points:
          type: number
          format: double
        events:
          type: integer
        scores:
          description: Points in each event the player has, by the leaderboard's column name
          type: object
          additionalProperties:
            type: number
            format: double
    GameSpan:
      description: How many games and players a tournament, season or stage has, and when its first and last game were played
      type: object
      required: [games, players, first_game, last_game]
      properties:
        games:
          type: integer
        players:
          type: integer
        first_game:
          type: string
          format: date
        last_game:
          type: string
          format: date
    SeasonSpan:
      description: A season's games and players, and its first and last game; a season admin added before it has games has none
      type: object
      required: [games, players, first_game, last_game]
      properties:
        games:
          type: integer
        players:
          type: integer
        first_game:
          type: string
          format: date
          nullable: true
        last_game:
          type: string
          format: date
          nullable: true
    CatalogueEntry:
      description: A tournament as the catalogue names it, with its seasons and games
      allOf:
        - $ref: "#/components/schemas/GameSpan"
        - type: object
          required: [slug, name, seasons, rankings, card]
          properties:
            slug:
              type: string
            name:
              type: string
            card:
              $ref: "#/components/schemas/TournamentCard"
            seasons:
              type: integer
            rankings:
              description: The rankings it is rated in, by slug; none for a tournament not rated
              type: array
              items:
                type: string
    CGETournament:
      description: A tournament on CGE's site, as its page shows it
      type: object
      required: [cge_tournament, name, status, organiser, started, finished, url, tournament, rated]
      properties:
        cge_tournament:
          type: integer
        name:
          type: string
        status:
          type: string
        organiser:
          type: string
        started:
          description: When it started, or was created when it shows no start
          type: string
          format: date
          nullable: true
        finished:
          type: string
          format: date
          nullable: true
        url:
          type: string
        tournament:
          description: Which of the catalogue's tournaments it is, by slug; "" for none
          type: string
        rated:
          description: Whether that tournament is in a ranking
          type: boolean
    Catalogue:
      type: object
      required: [run_id, tournaments, cge_tournaments]
      properties:
        run_id:
          type: integer
          format: int64
        tournaments:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueEntry"
        cge_tournaments:
          description: The tournaments on CGE's site the site shows (rated, or made visible), newest first
          type: array
          items:
            $ref: "#/components/schemas/CGETournament"
    RecentPodiums:
      type: object
      required: [run_id, podiums]
      properties:
        run_id:
          type: integer
          format: int64
        podiums:
          type: array
          items:
            $ref: "#/components/schemas/RecentPodium"
    RecentPodium:
      description: A tournament season's podium
      type: object
      required: [slug, name, season, season_name, finished, podium]
      properties:
        slug:
          type: string
        name:
          description: The tournament's name
          type: string
        season:
          description: The season's label, as the catalogue gives it
          type: string
        season_name:
          description: What the tournament calls a season ("Season" unless set)
          type: string
        finished:
          description: The season's last game, or its podium's finish when it has no games
          type: string
          format: date
        podium:
          type: array
          items:
            $ref: "#/components/schemas/PodiumPlace"
    CatalogueStage:
      description: A stage of a season; label "" is the season's only or main stage
      allOf:
        - $ref: "#/components/schemas/GameSpan"
        - type: object
          required: [label, note]
          properties:
            label:
              type: string
            note:
              description: A note shown beside the stage, or null
              type: string
              nullable: true
    PodiumPlace:
      description: A place on a cup year's recorded podium
      type: object
      required: [place, name, final, finished, source]
      properties:
        place:
          type: integer
        name:
          type: string
        final:
          description: Which final, when a year has several; "" otherwise
          type: string
        finished:
          type: string
          format: date
        source:
          description: Where the podium was recorded from
          type: string
    CatalogueSeason:
      allOf:
        - $ref: "#/components/schemas/SeasonSpan"
        - type: object
          required: [label, in_champions, stages, podium, cge_pages, note]
          properties:
            label:
              type: string
            in_champions:
              description: Its winner is listed among the tournament's champions; false for one admin leaves out, such as a play-off
              type: boolean
            note:
              description: A note shown beside the season, such as what a special season was, or null
              type: string
              nullable: true
            stages:
              type: array
              items:
                $ref: "#/components/schemas/CatalogueStage"
            podium:
              description: |
                The season's top three: a cup's recorded podium, or a league's
                recorded placements or else its top division's standings in
                this run. Empty when neither is known.
              type: array
              items:
                $ref: "#/components/schemas/PodiumPlace"
            cge_pages:
              description: The CGE pages the season's games come from, if any
              type: array
              items:
                type: string
    CatalogueTournament:
      type: object
      required: [run_id, slug, name, card, rated, seasons, ladder, top_tier_wins, players, rules, game_records, stories, season_name, stage_name]
      properties:
        season_name:
          description: What it calls a season, as headings use it ("Season" unless admin set another word, such as "Edition")
          type: string
        stage_name:
          description: What it calls a stage ("Stage" unless admin set another word, such as "Season")
          type: string
        stories:
          description: Its stories, as admin writes them, in order
          type: array
          items:
            $ref: "#/components/schemas/Story"
        game_records:
          description: The ten highest winning scores in its played games
          type: array
          items:
            $ref: "#/components/schemas/GameRecord"
        rated:
          description: In a ranking, so its games move ratings
          type: boolean
        card:
          $ref: "#/components/schemas/TournamentCard"
        ladder:
          description: A ladder's champions are counted as top-tier wins, not season podiums
          type: boolean
        rules:
          description: Each CGE edition's description, usually its organiser's format and rules, newest first; plain text
          type: array
          items:
            $ref: "#/components/schemas/EditionRules"
        regulations:
          description: The format and regulations written in admin, shown instead of the rules; plain text, absent for none
          type: string
        players:
          description: Everyone who played a shown game of the tournament, by name, for a search box
          type: array
          items:
            type: string
        top_tier_wins:
          description: A ladder's players by their wins in its top tier, most first, as its organisers count them (half a win for a tie)
          type: array
          items:
            $ref: "#/components/schemas/LadderWin"
        run_id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        seasons:
          description: In order of their first game
          type: array
          items:
            $ref: "#/components/schemas/CatalogueSeason"
    EditionRules:
      type: object
      required: [cge_tournament, name, url, description]
      properties:
        cge_tournament:
          type: integer
        name:
          type: string
        url:
          type: string
        description:
          type: string
    LadderWin:
      type: object
      required: [name, wins, source]
      properties:
        name:
          type: string
        wins:
          type: number
          format: double
        source:
          type: string
    CatalogueGames:
      type: object
      required: [run_id, slug, page, pages, total, coded, groups, games]
      properties:
        run_id:
          type: integer
          format: int64
        slug:
          type: string
        page:
          type: integer
        pages:
          type: integer
        total:
          description: The games the filters keep
          type: integer
        coded:
          description: How many of the games the season, stage and group keep have a replay code
          type: integer
        groups:
          description: The chosen season's groups (in its chosen stage), in order; empty when no season is chosen
          type: array
          items:
            type: string
        games:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueGame"
    CatalogueGame:
      type: object
      required: [match_id, date, season, stage, group, game, state, replay_code, seats, rated]
      properties:
        rated:
          description: Counts towards ratings - played, and its tournament, season and player count rated
          type: boolean
        match_id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        season:
          type: string
        stage:
          description: "\"\" for a season's only or main stage"
          type: string
        group:
          description: "\"\" when the game's name gives none"
          type: string
        game:
          description: The game's number in its group, or null when its name gives none
          type: integer
          nullable: true
        state:
          description: A never-played game had no player; an unconfirmed one has a result in doubt. Neither is rated
          allOf:
            - $ref: "#/components/schemas/GameState"
        replay_code:
          type: string
          nullable: true
        seats:
          description: Highest score first
          type: array
          items:
            $ref: "#/components/schemas/GameSeat"
    GameSeat:
      description: |
        One player of a game. A player whose CGE account is deleted or banned
        is masked as "Deleted player".
      type: object
      required: [name, score, outcome]
      properties:
        name:
          type: string
        score:
          type: number
          format: double
        outcome:
          description: How the seat ended, as CGE records it; null where CGE's seats are not known
          allOf:
            - $ref: "#/components/schemas/SeatOutcome"
          nullable: true
    Series:
      description: A tournament series
      type: string
      enum: [international, intermezzo, royal_league, worlds, grand_slams, ladders]
    TournamentSeries:
      type: object
      required: [run_id, series, name, card, first_game, stories, members, games, seasons, board, season_records, game_records]
      properties:
        run_id:
          type: integer
          format: int64
        series:
          $ref: "#/components/schemas/Series"
        name:
          description: The series' name, as admin writes it; empty when the database has no such series
          type: string
        card:
          $ref: "#/components/schemas/TournamentCard"
        first_game:
          description: The day of the first game in the series or a tournament in it, of those the catalogue shows
          type: string
          format: date
          nullable: true
        stories:
          description: Its stories, as admin writes them, in order
          type: array
          items:
            $ref: "#/components/schemas/Story"
        members:
          description: The tournaments in it that the catalogue shows, in the order they were added
          type: array
          items:
            $ref: "#/components/schemas/SeriesMember"
        games:
          description: The games the original site counts for the series, by its name patterns
          type: integer
        seasons:
          description: |
            The editions the original site counts: the latest season a
            league game's name gives, the World Championship's distinct
            editions, the cups' distinct names before "Stage", or the
            ladders' fixed 16
          type: integer
        board:
          description: The series' board in the original site's order (for leagues, most golds first, then silvers, bronzes and career points)
          type: array
          items:
            $ref: "#/components/schemas/TrophyRow"
        season_records:
          description: The ten best top-division seasons by points, then wins
          type: array
          items:
            $ref: "#/components/schemas/SeasonRecord"
        game_records:
          description: The ten highest winning scores in the games a series page lists (top-division or World Championship playoff games)
          type: array
          items:
            $ref: "#/components/schemas/GameRecord"
    SeriesMember:
      description: A tournament in a series of several, by its catalogue slug and name
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
        format:
          description: Its format in brief, as admin writes it, which the series' page lists as its format and regulations; plain text, absent for none
          type: string
    Circuit:
      description: How a series of several tournaments presents itself on the Hall of Fame overview
      type: object
      additionalProperties: false
      required: [series, name, card, first_game]
      properties:
        series:
          $ref: "#/components/schemas/Series"
        name:
          description: Its name, as admin writes it; empty when the database has no such series
          type: string
        card:
          $ref: "#/components/schemas/TournamentCard"
        first_game:
          description: The day of the first game in a tournament in it, of those the catalogue shows
          type: string
          format: date
          nullable: true
    TrophyRow:
      description: |
        One player on a series' board: medals and a title for the leagues
        and the World Championship, medals and honours for the cups, or
        ladder games, wins and win rate. What a board does not show is null
      type: object
      required: [name, world_champion, title, gold, silver, bronze, details, games, wins, win_rate]
      properties:
        name:
          type: string
        world_champion:
          type: boolean
        title:
          description: WC for a World Champion, GM for a top-division winner or World Championship medallist, else M
          type: string
          enum: [WC, GM, M]
          nullable: true
        gold:
          type: integer
          nullable: true
        silver:
          type: integer
          nullable: true
        bronze:
          type: integer
          nullable: true
        details:
          description: A cup medallist's first two honours
          type: string
          nullable: true
        games:
          description: Ladder games played
          type: integer
          nullable: true
        wins:
          type: integer
          nullable: true
        win_rate:
          description: Ladder wins as a percentage of games, to one decimal
          type: number
          format: double
          nullable: true
    SeasonRecord:
      type: object
      required: [name, world_champion, points, games, placings, season, division, last_played]
      properties:
        name:
          type: string
        world_champion:
          type: boolean
        points:
          type: number
          format: double
        games:
          type: integer
        placings:
          description: |
            How often the player finished 1st, 2nd, 3rd (and 4th in the
            International Championship); in the Royal League, wins, draws
            and losses
          type: array
          items:
            type: integer
        season:
          type: integer
        division:
          type: string
        last_played:
          type: string
          format: date
    GameRecord:
      type: object
      required: [name, world_champion, score, opponents, tournament, date]
      properties:
        name:
          description: The game's winner
          type: string
        world_champion:
          type: boolean
        score:
          type: number
          format: double
        opponents:
          description: The other players, highest score first
          type: array
          items:
            $ref: "#/components/schemas/Seat"
        tournament:
          type: string
        date:
          type: string
          format: date
    HallOfFame:
      type: object
      required: [run_id, series, legends, grand_slams, ladders, circuits]
      properties:
        run_id:
          type: integer
          format: int64
        series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesCount"
        legends:
          description: Up to 25 players, most titles first
          type: array
          items:
            $ref: "#/components/schemas/Legend"
        grand_slams:
          description: The first ten rows of the Grand Slams board
          type: array
          items:
            $ref: "#/components/schemas/TrophyRow"
        ladders:
          description: The first ten rows of the Ladders board
          type: array
          items:
            $ref: "#/components/schemas/TrophyRow"
        circuits:
          description: The Grand Slams and the Competitive Ladders, in that order
          type: array
          items:
            $ref: "#/components/schemas/Circuit"
    SeriesCount:
      type: object
      required: [series, games, seasons]
      properties:
        series:
          $ref: "#/components/schemas/Series"
        games:
          type: integer
        seasons:
          description: The editions the series page states (see TournamentSeries)
          type: integer
    Legend:
      type: object
      required: [name, world_champion, world_titles, international_titles, intermezzo_titles, royal_league_titles, gold, silver, bronze]
      properties:
        name:
          type: string
        world_champion:
          type: boolean
        world_titles:
          type: integer
        international_titles:
          type: integer
        intermezzo_titles:
          type: integer
        royal_league_titles:
          type: integer
        gold:
          description: Podium medals across the four circuits
          type: integer
        silver:
          type: integer
        bronze:
          type: integer
    DiscordInteraction:
      description: What Discord sends, as far as we read it; the rest is ignored
      type: object
      required: [type]
      properties:
        type:
          description: 1 PING, 2 a command used, 4 suggestions asked for the option being typed
          type: integer
        data:
          $ref: "#/components/schemas/DiscordCommandData"
        member:
          $ref: "#/components/schemas/DiscordGuildMember"
        user:
          $ref: "#/components/schemas/DiscordUser"
    DiscordCommandData:
      type: object
      properties:
        name:
          description: The command's name
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/DiscordOption"
    DiscordGuildMember:
      description: Who used the command in a server
      type: object
      properties:
        user:
          $ref: "#/components/schemas/DiscordUser"
    DiscordOption:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: integer
        value:
          description: A string or a number, by the option's type
        focused:
          description: The option being typed, when suggestions are asked for
          type: boolean
    DiscordUser:
      description: Who used the command in a direct message, or within member in a server
      type: object
      required: [id]
      properties:
        id:
          type: string
    DiscordReply:
      type: object
      required: [type]
      properties:
        type:
          description: 1 PONG, 4 a message, 8 suggestions
          type: integer
        data:
          $ref: "#/components/schemas/DiscordReplyData"
    DiscordReplyData:
      type: object
      properties:
        content:
          type: string
        flags:
          description: 64 shows the message to the asker alone
          type: integer
        allowed_mentions:
          $ref: "#/components/schemas/DiscordAllowedMentions"
        choices:
          type: array
          items:
            $ref: "#/components/schemas/DiscordChoice"
    DiscordAllowedMentions:
      type: object
      required: [parse]
      properties:
        parse:
          description: Always empty, so a reply mentions no one
          type: array
          items:
            type: string
    DiscordChoice:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    Me:
      description: |
        The signed-in player: where this session signed in and their names there, every way into their account, the
        member they are linked to (null until linked), their latest request to be linked (null if none), and their
        role in admin (null if none)
      type: object
      required: [provider, username, display_name, logins, member, request, admin_role, country, zone]
      properties:
        provider:
          $ref: "#/components/schemas/LoginProvider"
        logins:
          description: Every way into the account, by provider
          type: array
          items:
            $ref: "#/components/schemas/MyLogin"
        country:
          description: Their country as a two-letter ISO code, or null; the member's once linked, until then the one they gave
          type: string
          nullable: true
        zone:
          description: Their time zone (IANA, a region such as US East, or Unknown); the member's once linked, until then the one they gave
          type: string
        username:
          type: string
        display_name:
          description: Empty when they have none
          type: string
        member:
          allOf:
            - $ref: "#/components/schemas/MyMember"
          nullable: true
        request:
          allOf:
            - $ref: "#/components/schemas/MyLinkRequest"
          nullable: true
        admin_role:
          allOf:
            - $ref: "#/components/schemas/Role"
          nullable: true
    LoginProvider:
      description: Where a player signs in
      type: string
      enum: [discord, email, microsoft, google]
    MyLogin:
      description: A way into the signed-in player's account
      type: object
      required: [provider, username, display_name, email]
      properties:
        provider:
          $ref: "#/components/schemas/LoginProvider"
        username:
          description: The Discord username, the email address, or the Microsoft or Google account's name ("Microsoft account" or "Google account" when it has none)
          type: string
        display_name:
          description: Empty when they have none
          type: string
        email:
          description: The address we may write to through this way in, the email login's or the one Microsoft or Google vouches for; empty when none
          type: string
    EmailSignInAsk:
      type: object
      additionalProperties: false
      required: [email, turnstile]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        turnstile:
          description: The Turnstile widget's token
          type: string
          minLength: 1
          maxLength: 2048
        return:
          description: The site path, with any query, to come back to; anything else comes back to /account/
          type: string
          maxLength: 300
    EmailLoginAsk:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
    EmailSignInToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          description: The token from the link
          type: string
          minLength: 1
          maxLength: 100
    EmailSignedIn:
      type: object
      required: [outcome, back]
      properties:
        outcome:
          description: A first sign-in, a returning one, or the address added to the account
          type: string
          enum: [first, ok, added]
        back:
          description: The site path to go back to
          type: string
    MyMember:
      description: The member a signed-in player is linked to
      type: object
      required: [name, player, banned, ban_reason]
      properties:
        name:
          description: The TTA username
          type: string
        player:
          description: The name on the ratings pages, empty when they have no rated games
          type: string
        banned:
          description: Banned from taking part in the events we host; they may still sign in
          type: boolean
        ban_reason:
          description: Why, as the admin gave it; empty when not banned
          type: string
    MyLinkRequest:
      description: A request to be linked to a TTA username, and its answer
      type: object
      required: [name, status, reason, requested_at]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"
        reason:
          description: Why it was refused, empty when no reason was given
          type: string
        requested_at:
          type: string
          format: date-time
    MyData:
      description: Everything we keep about the signed-in player
      type: object
      required: [account, logins, member, requests, sessions, email_links]
      properties:
        account:
          $ref: "#/components/schemas/MyDataAccount"
        logins:
          description: Every way into the account, by provider
          type: array
          items:
            $ref: "#/components/schemas/MyDataLogin"
        member:
          allOf:
            - $ref: "#/components/schemas/MyDataMember"
          nullable: true
        requests:
          description: Every request to be linked, latest first
          type: array
          items:
            $ref: "#/components/schemas/MyDataRequest"
        sessions:
          description: Every session, oldest first
          type: array
          items:
            $ref: "#/components/schemas/MyDataSession"
        email_links:
          description: The sign-in links emailed for the account or to its email address, kept 48 hours, oldest first
          type: array
          items:
            $ref: "#/components/schemas/MyDataEmailLink"
    MyDataAccount:
      description: The account itself
      type: object
      required: [created_at, country, zone, linked_how, linked_at, auto_link]
      properties:
        created_at:
          type: string
          format: date-time
        country:
          description: The country given before a link, as a two-letter ISO code; null when none (a link moves it to the member)
          type: string
          nullable: true
        zone:
          description: The time zone given before a link; null when none (a link moves it to the member)
          type: string
          nullable: true
        linked_how:
          description: How the account was linked to its member, by a matching Discord name or email or by an approved request; null when not linked
          allOf:
            - $ref: "#/components/schemas/LinkedHow"
          nullable: true
        linked_at:
          type: string
          format: date-time
          nullable: true
        auto_link:
          description: Whether a sign-in may link the account by a matching Discord name or email; off once an admin unlinked it
          type: boolean
    MyDataLogin:
      description: A way into the account, with everything kept about it
      type: object
      required: [provider, id, username, display_name, email, created_at, signed_in_at]
      properties:
        provider:
          $ref: "#/components/schemas/LoginProvider"
        id:
          description: Its id for the player there; Discord's user id, Microsoft's id for this site, Google's account id, or the email address
          type: string
        username:
          type: string
        display_name:
          description: Empty when they have none
          type: string
        email:
          description: The address Microsoft or Google vouched for; empty when none
          type: string
        created_at:
          type: string
          format: date-time
        signed_in_at:
          description: When it was last used to sign in
          type: string
          format: date-time
    MyDataMember:
      description: The member the account is linked to, with every field it holds
      type: object
      required: [name, cge_user, player, discord_name, email, email_cleared, country, zone, banned, ban_reason, banned_at, created_at]
      properties:
        name:
          description: The TTA username
          type: string
        cge_user:
          description: The CGE user number; null when not known
          type: integer
          nullable: true
        player:
          description: The name on the ratings pages, empty when they have no rated games
          type: string
        discord_name:
          description: The Discord name recorded, by an admin or from a sign-in; empty when none
          type: string
        email:
          description: The email recorded, by an admin or from a sign-in; empty when none
          type: string
        email_cleared:
          description: Whether deleting the account clears the email, as it does one of the account's ways in gave; the Discord name, country and zone are always cleared, the rest always stays
          type: boolean
        country:
          description: A two-letter ISO code, or null
          type: string
          nullable: true
        zone:
          type: string
        banned:
          type: boolean
        ban_reason:
          description: Empty when not banned
          type: string
        banned_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    MyDataRequest:
      description: A request to be linked, and its answer
      type: object
      required: [name, status, reason, requested_at, decided_at]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"
        reason:
          description: Why it was refused, empty when no reason was given
          type: string
        requested_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
    MyDataSession:
      description: A session, which ends and is removed 30 days after its last use
      type: object
      required: [provider, created_at, ends_at, this_browser]
      properties:
        provider:
          $ref: "#/components/schemas/LoginProvider"
        created_at:
          type: string
          format: date-time
        ends_at:
          description: When it ends and is removed, unless used before then
          type: string
          format: date-time
        this_browser:
          description: Whether it is the session asking
          type: boolean
    MyDataEmailLink:
      description: An emailed sign-in link
      type: object
      required: [address, return_path, created_at, expires_at, used_at, kept_until]
      properties:
        address:
          type: string
        return_path:
          description: The site's page it returns to
          type: string
        created_at:
          description: When it was sent
          type: string
          format: date-time
        expires_at:
          description: Until when it works
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          nullable: true
        kept_until:
          description: When it is removed
          type: string
          format: date-time
    LinkRequestAsk:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: The TTA username, as in the app
          type: string
          minLength: 1
          maxLength: 100
    MyDetailsChange:
      type: object
      additionalProperties: false
      properties:
        country:
          description: Two-letter ISO code; empty clears it
          type: string
          maxLength: 2
        zone:
          description: An IANA time zone, a region (US East) or Unknown
          type: string
          minLength: 1
          maxLength: 64
    AdminAccount:
      description: A player's account, as admin sees it
      type: object
      required: [id, logins, member_id, member, linked_how, signed_in_at, auto_link, request, refused]
      properties:
        id:
          type: integer
          format: int64
        logins:
          description: Every way into the account, by provider
          type: array
          items:
            $ref: "#/components/schemas/AdminAccountLogin"
        member_id:
          type: integer
          format: int64
          nullable: true
        member:
          description: The linked member's TTA username, empty when not linked
          type: string
        linked_how:
          description: By a recorded Discord name or email, or by an approved request; null when not linked
          allOf:
            - $ref: "#/components/schemas/LinkedHow"
          nullable: true
        signed_in_at:
          description: The latest sign-in by any way in
          type: string
          format: date-time
        auto_link:
          description: Off once an admin unlinked it, so it is not linked by a recorded Discord name or email again
          type: boolean
        request:
          allOf:
            - $ref: "#/components/schemas/AdminLinkRequest"
          nullable: true
        refused:
          allOf:
            - $ref: "#/components/schemas/AdminLinkRefused"
          nullable: true
    AdminAccountLogin:
      description: A way into an account
      type: object
      required: [provider, username, display_name, email, signed_in_at]
      properties:
        provider:
          $ref: "#/components/schemas/LoginProvider"
        username:
          description: The Discord username, the email address, or the Microsoft or Google account's name
          type: string
        display_name:
          type: string
        email:
          description: The address we may write to through this way in, the email login's or the one Microsoft or Google vouches for; empty when none
          type: string
        signed_in_at:
          type: string
          format: date-time
    AdminLinkRefused:
      description: An account's last request to be linked, when it was refused and neither a new request nor a link has followed
      type: object
      required: [name, reason]
      properties:
        name:
          description: The TTA username asked for
          type: string
        reason:
          description: The reason the player was shown; may be empty
          type: string
    AdminLinkRequest:
      description: |
        A request waiting for an answer, with the country and zone the player gave, and the member its name names
        now (empty when approving adds one) with what is recorded for them, to compare
      type: object
      required: [id, name, country, zone, member, member_discord, member_email, member_country, member_zone, requested_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        country:
          description: The country the player gave, empty for none
          type: string
        zone:
          description: The time zone the player gave, empty for none
          type: string
        member:
          type: string
        member_discord:
          description: That member's recorded Discord name, to compare with the account's
          type: string
        member_email:
          description: That member's recorded email, to compare with the account's
          type: string
        member_country:
          description: That member's recorded country, empty for none
          type: string
        member_zone:
          description: That member's recorded time zone, empty when approving adds the member
          type: string
        requested_at:
          type: string
          format: date-time
    LinkApproved:
      type: object
      required: [member, created]
      properties:
        member:
          description: The member linked
          type: string
        created:
          description: Whether the member was added for this request
          type: boolean
    LinkRefusal:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          description: Shown to the player; may be empty
          type: string
          maxLength: 500
