          type: array
          minItems: 1
          items:
            type: integer
            minimum: 2
            maximum: 4
        visible:
          type: boolean
        rated:
          type: boolean
        community:
          type: boolean
        blitz:
          description: Run from admin as a blitz tournament, a round a week, with its entrants, pairings, results and standings
          type: boolean
        points_2p:
          $ref: "#/components/schemas/PlacePoints"
        points_3p:
          $ref: "#/components/schemas/PlacePoints"
        points_4p:
          $ref: "#/components/schemas/PlacePoints"
        season_name:
          description: What it calls a season on its pages ("Edition", "Round"…); empty for the default, Season
