          type: integer
        gone:
          description: Ratings in the other run but not this one
          type: integer
        moved_1:
          type: integer
        moved_10:
          type: integer
        moved_50:
          type: integer
        moved_100:
          type: integer
        biggest:
          description: The 20 biggest moves in the overall format
