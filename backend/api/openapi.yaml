openapi: 3.0.3
info:
  title: ttacommunity API
  version: 0.1.0
  description: |
    Public ratings for Through the Ages. Ratings change only when a new run
    is published, so each run's data sits at its own URL. Ask
    `/v1/runs/current` which run to read, then read that run.
    See docs/architecture.md#rating-runs.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: The process is up
      responses:
        "200":
          description: Up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: The process can reach the ratings database
      responses:
        "200":
          description: Ready
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/runs/current:
    get:
      operationId: getCurrentRun
      summary: The run the site shows now
      description: Cached for a minute, so a newly published run shows within one.
      responses:
        "200":
          description: The current run
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "503":
          $ref: "#/components/responses/NoPublishedRun"
  /v1/runs/{run}/leaderboard:
    get:
      operationId: getLeaderboard
      summary: Every rated player in one model and format, in rank order
      description: |
        A published run's ratings never change, but each row also carries the
        player's details as they are now (country), so this is cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The leaderboard
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/leaderboard.csv:
    get:
      operationId: getLeaderboardCsv
      summary: The leaderboard as a CSV file, filtered and sorted as the site's table
      description: |
        The players the site's leaderboard shows for the same choices, in its
        order, with their titles, career peaks and records. With `year`,
        the season archive's board instead: the ratings at the end of that
        year, with that year's record or the career up to it (`stats_view`),
        "active" meaning played that year, and no minimum opponents by
        default. Rows carry player details as they are now, so this is
        cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
        - name: status
          in: query
          required: false
          description: Active players (played in the 12 months before the run's last game), inactive ones, or all
          schema:
            type: string
            enum: [active, all, inactive]
            default: active
        - name: min_opps
          in: query
          required: false
          description: The fewest opponents a player needs (30 by default, 0 in a year's archive)
          schema:
            type: integer
            minimum: 0
            maximum: 1000
        - name: title
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TitleCode"
        - name: search
          in: query
          required: false
          description: Names or country codes, comma-separated; a name matches anywhere, ignoring case
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [rank, name, c_rating, rating, opps, win_rate, last_played]
            default: rank
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: year
          in: query
          required: false
          description: A year's archive instead of the live board
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: stats_view
          in: query
          required: false
          description: In a year's archive, that year's record or the career up to it
          schema:
            type: string
            enum: [season, career]
            default: season
      responses:
        "200":
          description: The CSV file, UTF-8 with a byte-order mark
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/history:
    get:
      operationId: getHistory
      summary: Each player's rating at a past date, for rating changes over time
      description: |
        The snapshot of the latest rating period on or before `at` (the first
        period when `at` is earlier), as the original site compares against:
        the players in that snapshot, each with their rating then. Without
        `at`, the run's previous period, the one before its last. The answer's
        date is the snapshot's. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
        - name: at
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The ratings at that date
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}:
    get:
      operationId: getPlayer
      summary: One player's ratings in every model and format, for the player page
      description: |
        The player's ratings in the ten continuous and season-reset models,
        each format, with their title, career peak, country and game counts.
        A name that matches no player exactly is looked up ignoring case,
        if only one player matches. Country and titles can change without a
        new run, so this is cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "200":
          description: The player
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/history:
    get:
      operationId: getPlayerHistory
      summary: One player's rating at the end of every period, for the chart
      description: |
        The player's rating and conservative rating after each rating period
        in the ten continuous and season-reset models, for one format. Cached
        for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The player's history
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/matches:
    get:
      operationId: getPlayerMatches
      summary: One player's games, newest first, 30 to a page
      description: |
        The games the run rated for the player, in one format (0 is all).
        Each carries an estimate of what it is worth to the player's rating
        today: one rating update from the run's final ratings in `model`
        (WHR is estimated with GlickoD's update). A page past the last gives
        the last. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Model"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: One page of games
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerMatches"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/rivals:
    get:
      operationId: getPlayerRivals
      summary: The player's record against each opponent
      description: |
        Wins, losses and draws against the 200 opponents the player has met
        most, in one format (0 is all). Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The player's rivals
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerRivals"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/career:
    get:
      operationId: getPlayerCareer
      summary: One player's record each year and each model's peak, for the career box
      description: |
        The player's record in each calendar year of one format (every
        format together when that format has none), with the year's highest
        rating in any model and the title the run derived for that year; and
        each continuous model's peak rating, when it was, and the player's
        rank among that month's ratings. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The player's career
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerCareer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/achievements:
    get:
      operationId: getPlayerAchievements
      summary: One player's tournament achievements, for their achievements page
      description: |
        The player's titles and medals across the four major circuits
        (World Championship, International, Intermezzo, Royal League) and
        the accolades their page features, and every tournament record the
        original site lists for them: seasons, campaigns and career totals,
        latest finish first. Records are matched to the name ignoring case,
        as the original site does. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "200":
          description: The player's achievements
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerAchievements"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/versus/{other}:
    get:
      operationId: getPlayerVersus
      summary: The latest games two players played together
      description: |
        The 100 latest games the run rated with both players at the table,
        in every format, newest first, with where each finished. Cached for
        five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - name: other
          in: path
          required: true
          description: The other player's name
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Their shared games
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerVersus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/matrix:
    get:
      operationId: getPlayerMatrix
      summary: One player's rating in each engine and reset mode, now or at a year's end
      description: |
        The player's rating, deviation, conservative rating and rank in the
        ten continuous and season-reset models for one format. Without
        `year`, the run's ratings and ranks. With it, each model's last
        rating period that year, ranked by conservative rating in it; a
        model the player has no row in then is left out. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: The player's ratings by model
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerMatrix"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/years:
    get:
      operationId: getYears
      summary: The years a run's ratings cover, newest first, for the season archive
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The years
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Years"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/years/{year}/leaderboard:
    get:
      operationId: getYearLeaderboard
      summary: The ratings at the end of a year, for the season archive
      description: |
        The ratings on the model's last rating period of the year (another
        model's when this one has none that year), for the players rated
        on it, best conservative rating first, as upstream's archive shows
        them. Each carries the player's record that year and up to it, and
        their rating on the previous year's last period. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: year
          in: path
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The year's board
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearLeaderboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/calibration:
    get:
      operationId: getCalibration
      summary: How well each model predicted games
      description: |
        Each model's calibration over the whole run, standard (in sample)
        and walk-forward (out of sample), in every format: Brier score,
        expected calibration error, log loss, accuracy, and the predicted
        against actual win rate in ten probability bins. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: How well each model predicted games
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calibration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/distribution:
    get:
      operationId: getDistribution
      summary: How ratings spread in each engine
      description: |
        Each continuous engine's ratings counted into 100-point bins from
        1000 to 2100, with their mean for every player and for active ones
        (more than 10 games in the year up to the run's newest game), in one
        format. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: How ratings spread in each engine
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distribution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/agreement:
    get:
      operationId: getAgreement
      summary: How far the models agree
      description: |
        The four closest and four furthest pairs of the ten continuous and
        season-reset models: Pearson on ratings and Spearman on the run's
        ranks, over the players rated in all of them with 15 or more
        opponents, in one format. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: How far the models agree
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agreement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/players:
    get:
      operationId: getComparedPlayers
      summary: Players across every model
      description: |
        Up to 15 players matching a search, strongest first by GlickoD's
        conservative rating, or upstream's six default players in its order
        when there is no search, each with their rating in every continuous
        and season-reset model for one format. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Format"
        - name: search
          in: query
          required: false
          description: Names or country codes, comma-separated; a name matches anywhere, ignoring case
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: The players and their ratings
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparedPlayers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/activity:
    get:
      operationId: getActivity
      summary: Who plays, and where
      description: |
        Active and inactive players (the site's fixed cutoff), games per
        format, players per title, and the 15 countries with most rated
        players with their average Glicko-2 Standard rating by title.
        Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run's activity and demographics
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/tournaments:
    get:
      operationId: getHallOfFame
      summary: The Hall of Fame overview
      description: |
        Every series' game and edition counts, the all-time table of titles
        and medals across the four major circuits (World Championship,
        International, Intermezzo, Royal League), and the first ten rows of
        the Grand Slams and Ladders boards, as the original site's overview
        shows them. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The overview
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallOfFame"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/tournaments/{series}:
    get:
      operationId: getTournamentSeries
      summary: A tournament series' Hall of Fame page
      description: |
        The series' game and season counts, its top division's trophyboard
        (each medallist's podiums, most golds first, then silvers, bronzes
        and career points), and the ten best top-division seasons and games
        as upstream's page ranks them. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: series
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Series"
      responses:
        "200":
          description: The series
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/catalogue:
    get:
      operationId: getCatalogue
      summary: Every tournament with games
      description: |
        Each tournament the site shows (rated, or made visible though not
        rated) that has placed games: its seasons, games, players and first
        and last game; and CGE's tournaments the site shows. Games come from the
        tournament catalogue, which can grow without a new run, so this is
        cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The tournaments, by name
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalogue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/catalogue/{tournament}:
    get:
      operationId: getCatalogueTournament
      summary: One tournament's seasons, stages and podiums
      description: |
        The tournament's seasons in order of their first game, each with its
        stages and its recorded podium. A hidden tournament (not rated, not
        made visible) is not found. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: tournament
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,63}$"
      responses:
        "200":
          description: The tournament
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueTournament"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/catalogue/{tournament}/games:
    get:
      operationId: getCatalogueGames
      summary: One page of a tournament's games
      description: |
        The tournament's games, newest first, 50 to a page, never-played ones
        included and marked. Narrowed by season, stage and group (as the
        catalogue labels them; an empty value does not narrow), and to games
        with a replay code. A page past the last gives the last. A hidden
        tournament is not found. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: tournament
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,63}$"
        - name: season
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: stage
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: group
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: player
          in: query
          required: false
          description: Only games this player sat in, by name in any case
          schema:
            type: string
            maxLength: 64
        - name: coded
          in: query
          required: false
          description: Only games with a replay code
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: One page of games
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueGames"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/community/{edition}:
    get:
      operationId: getCommunityLeaderboard
      summary: An edition of the community leaderboard
      description: |
        The community leaderboard's standings as its maintainer publishes
        them (rank, total points, events played, and each event's points),
        with each player's country and the run's title where the name is a
        player here, matched ignoring case. Best rank first. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: edition
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CommunityEdition"
      responses:
        "200":
          description: The edition
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityLeaderboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Who is signed in to admin, and in which role
      description: |
        Admin routes are reached through the admin site's Worker, behind
        Cloudflare Access. Each request's Access token (Cf-Access-Jwt-Assertion)
        is verified, and the Discord id in it must be an admin or organiser.
        Never cached.
      responses:
        "200":
          description: The signed-in admin
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/tournaments:
    get:
      operationId: getAdminTournaments
      tags: [admin]
      summary: Every tournament with its settings, seasons, stages and notes
      responses:
        "200":
          description: The tournaments, by name
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTournament"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/tournaments/{tournament}:
    patch:
      operationId: patchAdminTournament
      tags: [admin]
      summary: Change whether a tournament is shown, rated, or counted in the community leaderboard
      description: |
        Only the settings given change. Admins and organisers may change them;
        each change is audited. The Origin must be the admin site. Rating
        takes effect on the next engine run.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentSettings"
      responses:
        "204":
          description: Changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/tournaments/{tournament}/notes:
    put:
      operationId: putAdminNote
      tags: [admin]
      summary: Set the note shown beside a season or one of its stages; an empty note removes it
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonNote"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/admins:
    get:
      operationId: getAdminAdmins
      tags: [admin]
      summary: Everyone in admin, with their role (admins only)
      responses:
        "200":
          description: The admins and organisers, by name
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPerson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/admins/{discord_id}:
    put:
      operationId: putAdminAdmin
      tags: [admin]
      summary: Add someone to admin, or change their name or role (admins only; admin always keeps one admin)
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/DiscordID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRole"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteAdminAdmin
      tags: [admin]
      summary: Take someone out of admin (admins only; admin always keeps one admin)
      description: Audited. The Origin must be the admin site. Their Access session still lasts until it ends or is revoked in Cloudflare.
      parameters:
        - $ref: "#/components/parameters/DiscordID"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/tournaments/{tournament}/seasons:
    post:
      operationId: postAdminSeason
      tags: [admin]
      summary: Add a season with no games yet, so a note can be shown for it
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSeason"
      responses:
        "204":
          description: Added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAdminSeason
      tags: [admin]
      summary: Remove a season that has no games, with its notes
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - name: label
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/runs:
    get:
      operationId: getAdminRuns
      tags: [admin]
      summary: Rating runs, newest first, with a running one's progress (admins only)
      description: >
        Where the API can see the engine's Jobs, a run still marked running
        with no engine Job going is shown as failed: its engine ended without
        marking it.
      responses:
        "200":
          description: The runs
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: postAdminRun
      tags: [admin]
      summary: Start a rating run now (admins only)
      description: >
        Starts the engine as a Job. The run is not published: publish it once
        it is complete. Audited. The Origin must be the admin site.
      responses:
        "202":
          description: The engine Job was created
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/admin/runs/stop:
    post:
      operationId: postAdminRunStop
      tags: [admin]
      summary: Stop the rating run that is going (admins only)
      description: >
        Deletes the engine's Job. The engine marks its run failed, with the
        progress line "stopped", as it ends. Audited. The Origin must be the
        admin site.
      responses:
        "204":
          description: Stopping
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/admin/runs/{run}/publish:
    post:
      operationId: postAdminRunPublish
      tags: [admin]
      summary: Make a complete run the one the site shows, or roll back to an older one (admins only)
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/AdminRunId"
      responses:
        "204":
          description: Published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/runs/{run}/changes:
    get:
      operationId: getAdminRunChanges
      tags: [admin]
      summary: How far ratings moved from another run, by default the one the site showed before it (admins only)
      description: >
        For a run never published, that is the published run; for a published
        run, the run first published most recently before it. Compares
        conservative ratings of the default model, in every format.
      parameters:
        - $ref: "#/components/parameters/AdminRunId"
        - name: against
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The changes
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunChanges"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    AdminRunId:
      name: run
      in: path
      required: true
      description: Any run's id, published or not
      schema:
        type: integer
        format: int64
        minimum: 1
    DiscordID:
      name: discord_id
      in: path
      required: true
      description: A Discord user id
      schema:
        type: string
        pattern: "^[0-9]{5,25}$"
    AdminTournamentSlug:
      name: tournament
      in: path
      required: true
      description: The tournament's slug
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
        maxLength: 64
    Model:
      name: model
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Model"
    Format:
      name: format
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Format"
    PlayerName:
      name: name
      in: path
      required: true
      description: The player's name, as the leaderboard gives it
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RunId:
      name: run
      in: path
      required: true
      description: A published run's id, from `/v1/runs/current`
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    CacheControl:
      required: true
      schema:
        type: string
  responses:
    Conflict:
      description: The change cannot be made in the current state, such as a run already going
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotSetUp:
      description: This API is not set up to do that here
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No Access token, or one that does not verify
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The token is valid, but its Discord id is not an admin or organiser
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: A parameter is not one the API knows
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No published run has this id. It may be published later, so this is not cached
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoPublishedRun:
      description: No run has been published yet
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AdminRun:
      type: object
      required: [id, status, started_at, current, games, players, engine_version, progress]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [running, complete, failed]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        published_at:
          description: When it was first published
          type: string
          format: date-time
        current:
          description: The run the site shows
          type: boolean
        games:
          type: integer
        players:
          type: integer
        engine_version:
          type: string
        progress:
          description: The engine's latest progress line, empty before its first
          type: string
        progress_at:
          type: string
          format: date-time
    StartedRun:
      type: object
      required: [job]
      properties:
        job:
          description: The engine Job's name
          type: string
    RunChanges:
      type: object
      required: [run, against, ratings, ratings_before, new, gone, moved_1, moved_10, moved_50, moved_100, biggest]
      properties:
        run:
          type: integer
          format: int64
        against:
          type: integer
          format: int64
        ratings:
          type: integer
        ratings_before:
          type: integer
        new:
          description: Ratings in this run but not the other
          type: integer
        gone:
          description: Ratings in the other run but not this one
          type: integer
        moved_1:
          type: integer
        moved_10:
          type: integer
        moved_50:
          type: integer
        moved_100:
          type: integer
        biggest:
          description: The 20 biggest moves in the overall format
          type: array
          items:
            $ref: "#/components/schemas/RunMove"
    RunMove:
      type: object
      required: [name, before, after, change]
      properties:
        name:
          type: string
        before:
          type: number
          format: double
        after:
          type: number
          format: double
        change:
          type: number
          format: double
    NewSeason:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          description: As the site shows it, e.g. "1" or "2023 Play Off"
          type: string
          minLength: 1
          maxLength: 64
    AdminPerson:
      type: object
      required: [discord_id, name, role]
      properties:
        discord_id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, organiser]
    AdminRole:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        role:
          type: string
          enum: [admin, organiser]
    AdminTournament:
      type: object
      required: [slug, name, visible, rated, community, seasons]
      properties:
        slug:
          type: string
        name:
          type: string
        visible:
          description: Shown on the site though not rated
          type: boolean
        rated:
          description: In the community ratings
          type: boolean
        community:
          description: Counted in the overall community leaderboard
          type: boolean
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/AdminSeason"
    AdminSeason:
      type: object
      required: [label, note, has_games, stages]
      properties:
        label:
          type: string
        has_games:
          description: False for a season admin added, which can be removed
          type: boolean
        note:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/AdminStage"
    AdminStage:
      type: object
      required: [label, note]
      properties:
        label:
          type: string
        note:
          type: string
    TournamentSettings:
      type: object
      additionalProperties: false
      properties:
        visible:
          type: boolean
        rated:
          type: boolean
        community:
          type: boolean
    SeasonNote:
      type: object
      additionalProperties: false
      required: [season, stage, note]
      properties:
        season:
          type: string
          minLength: 1
          maxLength: 64
        stage:
          description: Empty for the season's own note
          type: string
          maxLength: 64
        note:
          type: string
          maxLength: 2000
    AdminMe:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          type: string
          enum: [admin, organiser]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Run:
      type: object
      required: [run_id, published_at, engine_version, finished_at, games, players, first_game, last_game]
      properties:
        run_id:
          type: integer
          format: int64
        published_at:
          type: string
          format: date-time
        engine_version:
          description: The commit the engine that computed the run was built from
          type: string
        finished_at:
          description: When the run was computed
          type: string
          format: date-time
          nullable: true
        games:
          description: The games the run rated; null for a run computed before runs recorded it
          type: integer
          nullable: true
        players:
          description: The players the run rated; null for a run computed before runs recorded it
          type: integer
          nullable: true
        first_game:
          description: The date of the run's first game; null for a run computed before runs recorded it
          type: string
          format: date
          nullable: true
        last_game:
          description: The date of the run's last game; null for a run computed before runs recorded it
          type: string
          format: date
          nullable: true
    Model:
      description: |
        The rating model. `_softer` models reset gently each season, and
        `_retro` models start from a retrospectively calibrated prior.
      type: string
      default: glicko2_daneo
      enum:
        - glicko2_daneo
        - glicko2_daneo_softer
        - glicko2_std
        - glicko2_std_softer
        - glicko2_std_retro
        - glicko2_std_softer_retro
        - glicko2_mp
        - glicko2_mp_softer
        - glicko2_mp_retro
        - glicko2_mp_softer_retro
        - glicko2_adapt
        - glicko2_adapt_softer
        - glicko2_adapt_retro
        - glicko2_adapt_softer_retro
        - whr
        - whr_softer
    Format:
      description: Players per game. 0 is every format together
      type: integer
      default: 0
      enum: [0, 2, 3, 4]
    Leaderboard:
      type: object
      required: [run_id, model, format, players]
      properties:
        run_id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        players:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardRow"
    LeaderboardRow:
      type: object
      required: [rank, rank_delta, name, rating, rd, c_rating, games, opponents, wins, losses, draws, win_rate, last_played, country, title]
      properties:
        rank:
          type: integer
          nullable: true
        rank_delta:
          type: integer
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          description: Rating deviation
          type: number
          format: double
        c_rating:
          description: Conservative rating, which the rank is ordered by
          type: number
          format: double
        games:
          type: integer
        opponents:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100
          type: number
          format: double
        last_played:
          type: string
          format: date
          nullable: true
        country:
          description: The player's country, ISO 3166-1 alpha-2, if known
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
    History:
      type: object
      required: [run_id, model, format, at, players]
      properties:
        run_id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        at:
          description: The date asked for, or the previous period's when none was
          type: string
          format: date
        players:
          type: array
          items:
            $ref: "#/components/schemas/HistoryRow"
    HistoryRow:
      type: object
      required: [name, rating, rd, c_rating]
      properties:
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
    TitleCode:
      type: string
      enum: [WC, SGM, GM, M, P, G, S, B, W]
    Title:
      description: The tournament title the run derived for the player, if any
      type: object
      nullable: true
      required: [code, count, reason]
      properties:
        code:
          $ref: "#/components/schemas/TitleCode"
        count:
          description: How many titles the player has earned
          type: integer
        reason:
          description: Why the player holds it, e.g. the latest division played
          type: string
    Player:
      type: object
      required: [run_id, name, country, title, peak, last_played, newest_game, games, ratings]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          description: The player's name as stored, whatever case was asked for
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
        peak:
          $ref: "#/components/schemas/Peak"
        last_played:
          type: string
          format: date
          nullable: true
        newest_game:
          description: The date of the newest game in the run, by anyone
          type: string
          format: date
          nullable: true
        games:
          description: How many games the player has in the run, by format (0 is all)
          type: array
          items:
            $ref: "#/components/schemas/FormatGames"
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRating"
    Peak:
      description: The player's best title over their career, if any
      type: object
      nullable: true
      required: [code, year]
