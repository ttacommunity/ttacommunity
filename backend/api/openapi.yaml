          format: date
          nullable: true
        last_game:
          description: The date of its last game; null for none
          type: string
          format: date
          nullable: true
        season_name:
          description: What it calls a season, as admin set it; empty for the default, Season
          type: string
        stage_name:
          description: What it calls a stage, as admin set it; empty for the default, Stage
          type: string
        points_2p:
          $ref: "#/components/schemas/PlacePoints"
        points_3p:
          $ref: "#/components/schemas/PlacePoints"
        points_4p:
          $ref: "#/components/schemas/PlacePoints"
        kind:
          $ref: "#/components/schemas/TournamentKind"
        top_divisions:
          description: A league's divisions whose final standings make its podium; empty for none
          type: array
          items:
            type: string
