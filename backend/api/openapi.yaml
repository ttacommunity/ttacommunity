        name:
          type: string
        country:
          description: A two-letter country code, null for none
          type: string
          nullable: true
        points:
          description: A win 1, a draw a half, a bye 1
          type: number
          format: double
        games:
          description: Matches decided, byes aside
          type: integer
        byes:
          type: integer
        opponents_points:
          description: The sum of the points of everyone met in a decided match
          type: number
          format: double
        status:
          description: Dropped players come last
          type: string
          enum: [active, dropped]
    NewBlitzRound:
      description: The criteria to pair by; the time zone fit is on unless turned off
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: boolean
          default: true
        rating:
          type: boolean
          default: false
    AdminBlitzMatch:
      description: A match by entrant ids; b is null for the bye. The gaps are as the entrants are now
      type: object
      required: [id, a, b, zone_gap_minutes, rating_gap, repeat, result, game, ruling, decided_at]
      properties:
        id:
          type: integer
          format: int64
        a:
          type: integer
          format: int64
        b:
          type: integer
          format: int64
          nullable: true
        zone_gap_minutes:
          type: integer
        rating_gap:
          description: Null when either is unrated, or for the bye
          type: number
          format: double
          nullable: true
        repeat:
          description: Whether the two have met in another round
          type: boolean
        result:
          description: Null until the match is decided
          allOf:
            - $ref: "#/components/schemas/BlitzResult"
          nullable: true
        game:
          description: The game played, null for none recorded
          allOf:
            - $ref: "#/components/schemas/BlitzPlayedGame"
          nullable: true
        ruling:
          description: The organisers' reason when the result is their ruling, else empty
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
    AdminBlitzRound:
      type: object
      required: [id, number, kind, timezone, rating, published_at, matches]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
        kind:
          type: string
          enum: [swiss, knockout]
        timezone:
          type: boolean
        rating:
          type: boolean
        published_at:
          description: Null for a draft
          type: string
          format: date-time
          nullable: true
        matches:
          type: array
          items:
            $ref: "#/components/schemas/AdminBlitzMatch"
    BlitzRoundMatches:
      type: object
      additionalProperties: false
      required: [matches]
      properties:
        matches:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [a]
            properties:
              a:
                type: integer
                format: int64
              b:
                description: Left out for the bye
                type: integer
                format: int64
    AdminBlitzEditionRow:
      description: One edition of a blitz tournament as admin's list shows it
      type: object
      required: [tournament, name, edition, format, entrants, pending, dropped]
      properties:
        tournament:
          type: string
        name:
          type: string
        edition:
          type: string
        format:
          $ref: "#/components/schemas/BlitzFormat"
        entrants:
          description: How many entrants are still in
          type: integer
        pending:
          description: How many are named but not yet confirmed
          type: integer
        dropped:
          description: How many have dropped out
          type: integer
    AdminBlitzEntrant:
      type: object
      required: [id, member, name, player, discord_name, email, country, zone, utc_offset, rating, status]
      properties:
        id:
          type: integer
          format: int64
        member:
          description: The member entered
          type: integer
          format: int64
        name:
          description: The member's TTA username
          type: string
        player:
          description: The ratings' spelling of the name, empty for a player the ratings do not know
          type: string
        discord_name:
          type: string
        email:
          type: string
        country:
          type: string
          nullable: true
        zone:
          type: string
        utc_offset:
          type: string
        rating:
          type: number
          format: double
          nullable: true
        status:
          description: Pending is named but not confirmed, neither paired nor shown on the site
          type: string
          enum: [pending, active, dropped]
    AdminBlitzEdition:
      type: object
      required: [tournament, name, edition, format, entrants, rounds, standings]
      properties:
        tournament:
          type: string
        name:
          type: string
        edition:
          type: string
        format:
          $ref: "#/components/schemas/BlitzFormat"
        entrants:
          description: Every entrant, in sign-up order, dropped ones included
          type: array
          items:
            $ref: "#/components/schemas/AdminBlitzEntrant"
        rounds:
          description: Every round, first first, drafts included
          type: array
          items:
            $ref: "#/components/schemas/AdminBlitzRound"
        standings:
          description: By rank, as the site shows them; dropped players last
          type: array
          items:
            $ref: "#/components/schemas/BlitzStanding"
    AdminMember:
      description: A member of the community as admin sees them
      type: object
      required: [id, name, player, cge_user, discord_name, email, country, zone, utc_offset, banned, ban_reason, banned_at, entries, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          description: The TTA username as in the app
          type: string
        player:
          description: The ratings' spelling of the name, empty for a player the ratings do not know
          type: string
        cge_user:
          description: The CGE account's id, null until known
          type: integer
          nullable: true
        discord_name:
          type: string
        email:
          type: string
        country:
          description: A two-letter country code, null for none
          type: string
          nullable: true
        zone:
          description: The IANA time zone
          type: string
        utc_offset:
          description: The zone's offset from UTC now, as +02:00
          type: string
        banned:
          type: boolean
        ban_reason:
          type: string
        banned_at:
          type: string
          format: date-time
          nullable: true
        entries:
          description: How many editions the member is in
          type: integer
        created_at:
          type: string
          format: date-time
    NewMember:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: The TTA username as in the app
          type: string
          minLength: 1
          maxLength: 100
        discord_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        country:
          description: A two-letter country code
          type: string
          maxLength: 2
        zone:
          description: An IANA time zone, such as Europe/Berlin; UTC until known
          type: string
          minLength: 1
          maxLength: 64
    MemberChange:
      description: What to change; a field left out stays as it is
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        discord_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        country:
          description: A two-letter country code, or empty for none
          type: string
          maxLength: 2
        zone:
          type: string
          minLength: 1
          maxLength: 64
        cge_user:
          description: The CGE account's id, which the data must know; 0 unlinks it
          type: integer
          minimum: 0
    MemberAdded:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    MemberBan:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    BlitzGameRecord:
      description: A played game, with the share code, each side as the match names them, and the day played
      type: object
      additionalProperties: false
      required: [share_code, a, b, played_on]
      properties:
        share_code:
          type: string
          minLength: 1
          maxLength: 32
        a:
          $ref: "#/components/schemas/BlitzGameSide"
        b:
          $ref: "#/components/schemas/BlitzGameSide"
        played_on:
          type: string
          format: date
    BlitzGameSide:
      type: object
      additionalProperties: false
      required: [culture, outcome]
      properties:
        culture:
          description: Ignored (0) for a player who resigned or timed out
          type: number
          format: double
          minimum: 0
        outcome:
          $ref: "#/components/schemas/BlitzOutcome"
    BlitzRuling:
      type: object
      additionalProperties: false
      required: [result, reason]
      properties:
        result:
          $ref: "#/components/schemas/BlitzResult"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    NewBlitzEntrant:
      description: A member to enter, by id, or by TTA username with the details a new member needs when the name is not a member yet
      type: object
      additionalProperties: false
      properties:
        member:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        discord_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        country:
          description: A two-letter country code
          type: string
          maxLength: 2
        zone:
          description: An IANA time zone, such as Europe/Berlin; UTC until known
          type: string
          minLength: 1
          maxLength: 64
        status:
          description: Active unless given; pending for someone not yet confirmed
          type: string
          enum: [pending, active]
    NewBlitzEntrants:
      type: object
      additionalProperties: false
      required: [entrants]
      properties:
        entrants:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/NewBlitzEntrant"
    BlitzEntrantIds:
      type: object
      required: [ids]
      properties:
        ids:
          description: The new entrants' ids, in the order given
          type: array
          items:
            type: integer
            format: int64
    BlitzEntrantChange:
      description: What to change, the entrant's status or the member's details; a field left out stays as it is
      type: object
      additionalProperties: false
      properties:
        discord_name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        country:
          description: A two-letter country code, or empty for none
          type: string
          maxLength: 2
        zone:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum: [pending, active, dropped]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        request_id:
          type: string
          description: |
            On a server error (500), the request's id, as in the
            `X-Request-Id` header every response carries. Quote it when
            reporting the problem: it finds the error in the API's log.
    Run:
      type: object
      required: [run_id, published_at, engine_version, finished_at, games, players, first_game, last_game]
      properties:
        run_id:
          type: integer
          format: int64
        published_at:
          type: string
          format: date-time
        engine_version:
          description: The commit the engine that computed the run was built from
          type: string
        finished_at:
          description: When the run was computed
          type: string
          format: date-time
          nullable: true
        games:
          description: The games the run rated; null for a run computed before runs recorded it
          type: integer
          nullable: true
        players:
          description: The players the run rated; null for a run computed before runs recorded it
          type: integer
          nullable: true
        first_game:
          description: The date of the run's first game; null for a run computed before runs recorded it
          type: string
          format: date
          nullable: true
        last_game:
          description: The date of the run's last game; null for a run computed before runs recorded it
          type: string
          format: date
          nullable: true
    Model:
      description: |
        The rating model. `_softer` models reset gently each season, and
        `_retro` models start from a retrospectively calibrated prior.
      type: string
      default: glicko2_daneo
      enum:
        - glicko2_daneo
        - glicko2_daneo_softer
        - glicko2_std
        - glicko2_std_softer
        - glicko2_std_retro
        - glicko2_std_softer_retro
        - glicko2_mp
        - glicko2_mp_softer
        - glicko2_mp_retro
        - glicko2_mp_softer_retro
        - glicko2_adapt
        - glicko2_adapt_softer
        - glicko2_adapt_retro
        - glicko2_adapt_softer_retro
        - whr
        - whr_softer
    Format:
      description: Players per game. 0 is every format together
      type: integer
      default: 0
      enum: [0, 2, 3, 4]
    Leaderboard:
      type: object
      required: [run_id, model, format, players]
      properties:
        run_id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        players:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardRow"
    LeaderboardRow:
      type: object
      required: [rank, rank_delta, name, rating, rd, c_rating, games, opponents, wins, losses, draws, win_rate, last_played, country, title]
      properties:
        rank:
          type: integer
          nullable: true
        rank_delta:
          type: integer
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          description: Rating deviation
          type: number
          format: double
        c_rating:
          description: Conservative rating, which the rank is ordered by
          type: number
          format: double
        games:
          type: integer
        opponents:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100
          type: number
          format: double
        last_played:
          type: string
          format: date
          nullable: true
        country:
          description: The player's country, ISO 3166-1 alpha-2, if known
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
        badges:
          description: Badges admin gave the player, by label, shown beside the title
          type: array
          items:
            $ref: "#/components/schemas/ExtraBadge"
    History:
      type: object
      required: [run_id, model, format, at, players]
      properties:
        run_id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        at:
          description: The date asked for, or the previous period's when none was
          type: string
          format: date
        players:
          type: array
          items:
            $ref: "#/components/schemas/HistoryRow"
    HistoryRow:
      type: object
      required: [name, rating, rd, c_rating]
      properties:
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
    TitleCode:
      type: string
      enum: [WC, SGM, WCS, WCB, GM, M, P, G, S, B, W]
    Title:
      description: The tournament title the run derived for the player, if any
      type: object
      nullable: true
      required: [code, count, reason]
      properties:
        code:
          $ref: "#/components/schemas/TitleCode"
        count:
          description: How many titles the player has earned
          type: integer
        reason:
          description: Why the player holds it, e.g. the latest division played
          type: string
    Player:
      type: object
      required: [run_id, name, country, title, peak, last_played, newest_game, games, ratings]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          description: The player's name as stored, whatever case was asked for
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
        badges:
          description: Badges admin gave the player, by label, shown beside the title
          type: array
          items:
            $ref: "#/components/schemas/ExtraBadge"
        peak:
          $ref: "#/components/schemas/Peak"
        last_played:
          type: string
          format: date
          nullable: true
        newest_game:
          description: The date of the newest game in the run, by anyone
          type: string
          format: date
          nullable: true
        games:
          description: How many games the player has in the run, by format (0 is all)
          type: array
          items:
            $ref: "#/components/schemas/FormatGames"
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRating"
    Peak:
      description: The player's best title over their career, if any
      type: object
      nullable: true
      required: [code, year]
      properties:
        code:
          $ref: "#/components/schemas/TitleCode"
        year:
          type: integer
          nullable: true
    FormatGames:
      type: object
      required: [format, games]
      properties:
        format:
          $ref: "#/components/schemas/Format"
        games:
          type: integer
    FormatGamesAndPairs:
      type: object
      required: [format, games, pairs]
      properties:
        format:
          $ref: "#/components/schemas/Format"
        games:
          type: integer
        pairs:
          description: The one-to-one pairs the engine rated from those games
          type: integer
    PlayerRating:
      type: object
      required: [model, format, rank, rating, rd, c_rating, opponents, win_rate]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        rank:
          type: integer
          nullable: true
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        opponents:
          type: integer
        win_rate:
          description: Percent, 0 to 100
          type: number
          format: double
    PlayerHistory:
      type: object
      required: [run_id, name, format, series]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        series:
          type: array
          items:
            $ref: "#/components/schemas/HistorySeries"
    HistorySeries:
      type: object
      required: [model, points]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        points:
          description: Oldest first
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"
    HistoryPoint:
      type: object
      required: [date, rating, c_rating]
      properties:
        date:
          type: string
          format: date
        rating:
          type: number
          format: double
        c_rating:
          type: number
          format: double
    PlayerMatches:
      type: object
      required: [run_id, name, format, model, page, pages, total, matches]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        model:
          $ref: "#/components/schemas/Model"
        page:
          type: integer
        pages:
          type: integer
        total:
          description: The player's games in this format
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/PlayerMatch"
    PlayerMatch:
      type: object
      required: [match_id, tournament, date, player_count, placement, replay_code, rating_delta, seats]
      properties:
        match_id:
          type: integer
          format: int64
        tournament:
          type: string
        date:
          type: string
          format: date
        player_count:
          type: integer
        placement:
          description: The player's place, 1 for the highest score
          type: integer
        replay_code:
          type: string
          nullable: true
        rating_delta:
          description: What the game is worth to the player's rating today, to 0.1
          type: number
          format: double
          nullable: true
        seats:
          description: Seat order
          type: array
          items:
            $ref: "#/components/schemas/Seat"
    Seat:
      description: |
        One player of a game. A player whose CGE account is deleted or banned
        is masked as "Deleted player".
      type: object
      required: [name, score]
      properties:
        name:
          type: string
        score:
          type: number
          format: double
    PlayerRivals:
      type: object
      required: [run_id, name, format, rivals]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        rivals:
          description: Most games first
          type: array
          items:
            $ref: "#/components/schemas/Rival"
    Rival:
      type: object
      required: [name, games, wins, losses, draws, win_rate]
      properties:
        name:
          type: string
        games:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
    PlayerCareer:
      type: object
      required: [run_id, name, format, years, peaks]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        years:
          description: Oldest first
          type: array
          items:
            $ref: "#/components/schemas/CareerYear"
        peaks:
          description: GlickoD, Standard, MP-Weighted, Adaptive-T, WHR, for those with history
          type: array
          items:
            $ref: "#/components/schemas/ModelPeak"
    CareerYear:
      type: object
      required: [year, opponents, wins, losses, draws, win_rate, peak_rating, title, year_end_rating, career_opponents, career_wins, career_losses, career_draws, career_win_rate]
      properties:
        year:
          type: integer
        opponents:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
        peak_rating:
          description: The year's highest rating in any model's history, to 0.1
          type: number
          format: double
          nullable: true
        year_end_rating:
          description: Glicko-2 Standard's last rating that year, to 0.1, as upstream shows it
          type: number
          format: double
          nullable: true
        career_opponents:
          description: Opponents from the first year to the end of this one
          type: integer
        career_wins:
          type: integer
        career_losses:
          type: integer
        career_draws:
          type: integer
        career_win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
        title:
          description: The best title the run derived for the player that year
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TitleCode"
    ModelPeak:
      type: object
      required: [model, rating, rank, date]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        rating:
          description: The highest rating, to 0.1
          type: number
          format: double
        rank:
          description: 1 + how many ratings that period were higher
          type: integer
        date:
          type: string
          format: date
    PlayerVersus:
      type: object
      required: [run_id, name, other, matches]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        other:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/VersusMatch"
    VersusMatch:
      type: object
      required: [match_id, tournament, date, player_count, name_place, other_place, seats, replay_code]
      properties:
        match_id:
          type: integer
          format: int64
        tournament:
          type: string
        date:
          type: string
          format: date
        player_count:
          type: integer
        name_place:
          type: integer
        other_place:
          type: integer
        replay_code:
          type: string
          nullable: true
        seats:
          description: Highest score first
          type: array
          items:
            $ref: "#/components/schemas/Seat"
    PlayerMatrix:
      type: object
      required: [run_id, name, format, year, cells]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        year:
          description: The year asked for, or null for the run's ratings
          type: integer
          nullable: true
        cells:
          type: array
          items:
            $ref: "#/components/schemas/MatrixCell"
    MatrixCell:
      type: object
      required: [model, rating, rd, c_rating, rank]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        rank:
          type: integer
          nullable: true
    Years:
      type: object
      required: [run_id, years]
      properties:
        run_id:
          type: integer
          format: int64
        years:
          description: Newest first
          type: array
          items:
            $ref: "#/components/schemas/YearEntry"
    YearEntry:
      type: object
      required: [year, champion]
      properties:
        year:
          type: integer
        champion:
          description: True if the run derived a World Champion for the year
          type: boolean
    YearLeaderboard:
      type: object
      required: [run_id, year, model, format, snapshot, previous, games, champions, players]
      properties:
        run_id:
          type: integer
          format: int64
        year:
          type: integer
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        snapshot:
          description: The rating period the board is taken from
          type: string
          format: date
        previous:
          description: The previous year's last period, which the changes compare with
          type: string
          format: date
          nullable: true
        games:
          description: Games the run rated that year, in every format
          type: integer
        champions:
          type: array
          items:
            $ref: "#/components/schemas/Champion"
        players:
          type: array
          items:
            $ref: "#/components/schemas/YearRow"
    Champion:
      type: object
      required: [name, reigning]
      properties:
        name:
          type: string
        reigning:
          description: True for the current champion, in the run's latest year
          type: boolean
    YearRow:
      type: object
      required: [name, rating, rd, c_rating, country, title, season, career, last_played, previous]
      properties:
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
        season:
          $ref: "#/components/schemas/YearRecord"
        career:
          $ref: "#/components/schemas/YearRecord"
        last_played:
          description: The player's last game that year
          type: string
          format: date
          nullable: true
        previous:
          $ref: "#/components/schemas/PreviousRating"
    YearRecord:
      type: object
      required: [opponents, wins, losses, draws, win_rate]
      properties:
        opponents:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
    PreviousRating:
      description: The player's rating on the previous year's last period, if they had one
      type: object
      nullable: true
      required: [rating, rd, c_rating]
      properties:
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
    Calibration:
      type: object
      required: [run_id, rows]
      properties:
        run_id:
          type: integer
          format: int64
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CalibrationRow"
    CalibrationRow:
      type: object
      required: [mode, model, format, matches, brier, ece, log_loss, accuracy, bins]
      properties:
        mode:
          type: string
          enum: [standard, walk_forward]
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        matches:
          description: Games evaluated
          type: integer
        brier:
          type: number
          format: double
        ece:
          description: Expected calibration error, 0 to 1
          type: number
          format: double
        log_loss:
          type: number
          format: double
          nullable: true
        accuracy:
          description: Percent
          type: number
          format: double
          nullable: true
        bins:
          $ref: "#/components/schemas/CalibrationBins"
    CalibrationBins:
      description: Predicted against actual win rate, bin by bin
      type: object
      required: [labels, ideal, preds, actuals, counts]
      properties:
        labels:
          type: array
          items:
            type: string
        ideal:
          type: array
          items:
            type: number
            format: double
        preds:
          type: array
          items:
            type: number
            format: double
        actuals:
          type: array
          items:
            type: number
            format: double
        counts:
          type: array
          items:
            type: integer
    Distribution:
      type: object
      required: [run_id, format, labels, engines]
      properties:
        run_id:
          type: integer
          format: int64
        format:
          $ref: "#/components/schemas/Format"
        labels:
          type: array
          items:
            type: string
        engines:
          type: array
          items:
            $ref: "#/components/schemas/EngineDistribution"
    EngineDistribution:
      type: object
      required: [model, counts, mean, active_mean]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        counts:
          type: array
          items:
            type: integer
        mean:
          type: number
          format: double
        active_mean:
          type: number
          format: double
    Agreement:
      type: object
      required: [run_id, format, sample, top, weakest]
      properties:
        run_id:
          type: integer
          format: int64
        format:
          $ref: "#/components/schemas/Format"
        sample:
          description: Players rated in all ten models with 15 or more opponents
          type: integer
        top:
          type: array
          items:
            $ref: "#/components/schemas/ModelPair"
        weakest:
          type: array
          items:
            $ref: "#/components/schemas/ModelPair"
    ComparedPlayers:
      type: object
      required: [run_id, format, players]
      properties:
        run_id:
          type: integer
          format: int64
        format:
          $ref: "#/components/schemas/Format"
        players:
          type: array
          items:
            $ref: "#/components/schemas/ComparedPlayer"
    ComparedPlayer:
      type: object
      required: [name, country, title, ratings]
      properties:
        name:
          type: string
        country:
          description: The player's country, ISO 3166-1 alpha-2, if known
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          allOf:
            - $ref: "#/components/schemas/TitleCode"
          nullable: true
        ratings:
          description: One per model the player is rated in, in upstream's order
          type: array
          items:
            $ref: "#/components/schemas/ComparedRating"
    ComparedRating:
      type: object
      required: [model, rank, rating, rd, c_rating, opponents, win_rate]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        rank:
          type: integer
          nullable: true
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        opponents:
          type: integer
        win_rate:
          description: Percent
          type: number
          format: double
    Activity:
      type: object
      required: [run_id, active, inactive, formats, titles, countries]
      properties:
        run_id:
          type: integer
          format: int64
        active:
          description: Players whose last game is after the site's inactive cutoff
          type: integer
        inactive:
          type: integer
        formats:
          description: Games per format, 2 to 4 players
          type: array
          items:
            $ref: "#/components/schemas/FormatGamesAndPairs"
        titles:
          description: Players per title, most first
          type: array
          items:
            $ref: "#/components/schemas/TitlePlayers"
        countries:
          type: array
          items:
            $ref: "#/components/schemas/CountryRatings"
    TitlePlayers:
      type: object
      required: [code, players]
      properties:
        code:
          $ref: "#/components/schemas/TitleCode"
        players:
          type: integer
    CountryRatings:
      description: A country's rated players and their average Glicko-2 Standard rating, overall and by title
      type: object
      required: [country, players, gm, m_plus, p_plus, all]
      properties:
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        players:
          type: integer
        gm:
          type: number
          format: double
          nullable: true
        m_plus:
          description: Grandmasters and Masters
          type: number
          format: double
          nullable: true
        p_plus:
          description: Grandmasters, Masters and Platinum
          type: number
          format: double
          nullable: true
        all:
          type: number
          format: double
    SeatAnalysis:
      type: object
      required: [run_id, tier, groups]
      properties:
        run_id:
          type: integer
          format: int64
        tier:
          type: string
          enum: [all, grandmaster, master, advanced, intermediate, beginner]
        groups:
          description: Seat statistics grouped by player count (2P, 3P, 4P)
          type: array
          items:
            $ref: "#/components/schemas/SeatStatsGroup"
    SeatStatsGroup:
      type: object
      required: [player_count, total_games, seats]
      properties:
        player_count:
          type: integer
          minimum: 2
          maximum: 4
        total_games:
          type: integer
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatWinrateRow"
    SeatWinrateRow:
      type: object
      required: [seat, games, wins, draws, win_rate, places]
      properties:
        seat:
          description: 1-indexed turn position (Seat 1 = starting player)
          type: integer
          minimum: 1
          maximum: 4
        games:
          type: integer
        wins:
          description: Outright wins (sole 1st place finishes)
          type: integer
        draws:
          description: Tied games for 1st place
          type: integer
        win_rate:
          description: Win rate as a percentage rounded to two decimals
          type: number
          format: double
        places:
          description: Detailed placement breakdown (1st, 2nd, 3rd, 4th)
          type: array
          items:
            $ref: "#/components/schemas/SeatPlaceRate"
    SeatPlaceRate:
      type: object
      required: [place, count, rate]
      properties:
        place:
          description: 1-indexed placement finish (1 = 1st place)
          type: integer
          minimum: 1
          maximum: 4
        count:
          type: integer
        rate:
          description: Placement rate as a percentage rounded to two decimals
          type: number
          format: double
    PlayerSeatStats:
      type: object
      required: [run_id, name, unrated, groups, overall]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        unrated:
          type: boolean
        groups:
          description: Seat statistics grouped by format (2P, 3P, 4P)
          type: array
          items:
            $ref: "#/components/schemas/PlayerSeatGroup"
        overall:
          $ref: "#/components/schemas/PlayerSeatOverview"
    PlayerSeatOverview:
      type: object
      required: [total_games, total_wins, total_draws, win_rate, avg_culture, strongest_seat, weakest_seat]
      properties:
        total_games:
          type: integer
        total_wins:
          type: integer
        total_draws:
          type: integer
        win_rate:
          type: number
          format: double
        avg_culture:
          type: number
          format: double
        strongest_seat:
          $ref: "#/components/schemas/PlayerSeatDelta"
          nullable: true
        weakest_seat:
          $ref: "#/components/schemas/PlayerSeatDelta"
          nullable: true
    PlayerSeatDelta:
      type: object
      nullable: true
      required: [player_count, seat, win_rate, delta_win_rate]
      properties:
        player_count:
          type: integer
        seat:
          type: integer
        win_rate:
          type: number
          format: double
        delta_win_rate:
          description: Difference in percentage points between this seat winrate and the format overall winrate
          type: number
          format: double
    PlayerSeatGroup:
      type: object
      required: [player_count, total_games, total_wins, total_draws, win_rate, avg_culture, seats]
      properties:
        player_count:
          type: integer
          minimum: 2
          maximum: 4
        total_games:
          type: integer
        total_wins:
          type: integer
        total_draws:
          type: integer
        win_rate:
          type: number
          format: double
        avg_culture:
          type: number
          format: double
        seats:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSeatRow"
    PlayerSeatRow:
      type: object
      required: [seat, games, wins, draws, win_rate, delta_win_rate, avg_culture, places]
      properties:
        seat:
          description: 1-indexed turn position (Seat 1 = starting player)
          type: integer
          minimum: 1
          maximum: 4
        games:
          type: integer
        wins:
          description: Outright wins (sole 1st place finishes)
          type: integer
        draws:
          description: Tied games for 1st place
          type: integer
        win_rate:
          type: number
          format: double
        delta_win_rate:
          description: Win rate minus group overall win rate
          type: number
          format: double
        avg_culture:
          type: number
          format: double
        places:
          type: array
          items:
            $ref: "#/components/schemas/SeatPlaceRate"
    ModelPair:
      type: object
      required: [a, b, pearson, spearman]
      properties:
        a:
          $ref: "#/components/schemas/Model"
        b:
          $ref: "#/components/schemas/Model"
        pearson:
          type: number
          format: double
        spearman:
          type: number
          format: double
    PlayerAchievements:
      type: object
      required: [run_id, name, summary, records]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        summary:
          $ref: "#/components/schemas/AchievementSummary"
        records:
          description: Latest finish first; a career total's finish_date is a label, not a date
          type: array
          items:
            $ref: "#/components/schemas/TournamentRecord"
    AchievementSummary:
      description: Null for a player with no medal in the four major circuits
      type: object
      nullable: true
      required: [world_titles, international_titles, intermezzo_titles, royal_league_titles, gold, silver, bronze, accolades]
      properties:
        world_titles:
          type: integer
        international_titles:
          type: integer
        intermezzo_titles:
          type: integer
        royal_league_titles:
          type: integer
        gold:
          type: integer
        silver:
          type: integer
        bronze:
          type: integer
        accolades:
          description: At most six, in the order the page features them
          type: array
          items:
            type: string
    TournamentRecord:
      type: object
      required: [tournament, season, division, placement, points, medal, details, finish_date, career]
      properties:
        tournament:
          type: string
        season:
          type: string
        division:
          type: string
        placement:
          type: string
        points:
          type: string
        medal:
          type: string
          enum: [gold, silver, bronze]
          nullable: true
        details:
          type: string
        finish_date:
          type: string
        career:
          description: A career total, not one season or tournament
          type: boolean
    CommunityEdition:
      description: An edition of the community leaderboard (slug identifier)
      type: string
    CommunityEditionInfo:
      type: object
      required: [id, name, title, short, badge, year, wc, wc_desc, maintainer, maintainer_note]
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
        short:
          type: string
        badge:
          type: string
        year:
          type: integer
        wc:
          description: |
            The World Champion reigning in the edition's year, "" for none, or
            "Deleted player" when their CGE account is deleted or banned
          type: string
        wc_desc:
          description: What the champion is, such as "Reigning World Champion (2025)"; "" for none
          type: string
        maintainer:
          type: string
        maintainer_note:
          type: string
    CommunityEventColumn:
      type: object
      required: [id, name, short, max_pts]
      properties:
        id:
          type: string
        name:
          type: string
        short:
          type: string
        max_pts:
          description: The most points the event's points table gives in the edition's year; null when no table is held
          type: integer
          nullable: true
        desc:
          type: string
    CommunityCategory:
      type: object
      required: [category, badge_class, columns]
      properties:
        category:
          type: string
        badge_class:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/CommunityEventColumn"
    CommunitySummaryGroup:
      type: object
      required: [id, name, short, cols, max_pts, badge_class, desc]
      properties:
        id:
          type: string
        name:
          type: string
        short:
          type: string
        cols:
          type: array
          items:
            type: string
        max_pts:
          description: The sum of its columns' most points; null when any column's is unknown
          type: integer
          nullable: true
        badge_class:
          type: string
        desc:
          type: string
    CommunityEditionItem:
      type: object
      required: [slug, name, title, short_name, badge, maintainer, maintainer_note, year, counting_events, visible, sort_order]
      properties:
        slug:
          type: string
        name:
          type: string
        title:
          type: string
        short_name:
          type: string
        badge:
          type: string
        maintainer:
          type: string
        maintainer_note:
          type: string
        year:
          type: integer
        counting_events:
          type: integer
        visible:
          type: boolean
        sort_order:
          type: integer
    CommunityEditionPatch:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        short_name:
          type: string
        badge:
          type: string
        maintainer:
          type: string
        maintainer_note:
          type: string
        year:
          type: integer
        counting_events:
          type: integer
        visible:
          type: boolean
        sort_order:
          type: integer
    CommunityLeaderboard:
      type: object
      required: [run_id, edition, info, categories, summary, counting_events, rows]
      properties:
        run_id:
          type: integer
          format: int64
        edition:
          $ref: "#/components/schemas/CommunityEdition"
        info:
          $ref: "#/components/schemas/CommunityEditionInfo"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CommunityCategory"
        summary:
          type: array
          items:
            $ref: "#/components/schemas/CommunitySummaryGroup"
        counting_events:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CommunityRow"
    CommunityRow:
      type: object
      required: [rank, name, country, title, points, events, scores]
      properties:
        rank:
          type: integer
        name:
          description: As the leaderboard writes it
          type: string
        country:
          type: string
          nullable: true
        title:
          description: The run's title for the player, null when none or not a player here
          type: string
          enum: [WC, SGM, WCS, WCB, GM, M, P, G, S, B, W]
          nullable: true
        points:
          type: number
          format: double
        events:
          type: integer
        scores:
          description: Points in each event the player has, by the leaderboard's column name
          type: object
          additionalProperties:
            type: number
            format: double
    GameSpan:
      description: How many games and players a tournament, season or stage has, and when its first and last game were played
      type: object
      required: [games, players, first_game, last_game]
      properties:
        games:
          type: integer
        players:
          type: integer
        first_game:
          type: string
          format: date
        last_game:
          type: string
          format: date
    SeasonSpan:
      description: A season's games and players, and its first and last game; a season admin added before it has games has none
      type: object
      required: [games, players, first_game, last_game]
      properties:
        games:
          type: integer
        players:
          type: integer
        first_game:
          type: string
          format: date
          nullable: true
        last_game:
          type: string
          format: date
          nullable: true
    CatalogueEntry:
      description: A tournament as the catalogue names it, with its seasons and games
      allOf:
        - $ref: "#/components/schemas/GameSpan"
        - type: object
          required: [slug, name, seasons, rankings, card]
          properties:
            slug:
              type: string
            name:
              type: string
            card:
              $ref: "#/components/schemas/TournamentCard"
            seasons:
              type: integer
            rankings:
              description: The rankings it is rated in, by slug; none for a tournament not rated
              type: array
              items:
                type: string
    CGETournament:
      description: A tournament on CGE's site, as its page shows it
      type: object
      required: [cge_tournament, name, status, organiser, started, finished, url, tournament, rated]
      properties:
        cge_tournament:
          type: integer
        name:
          type: string
        status:
          type: string
        organiser:
          type: string
        started:
          description: When it started, or was created when it shows no start
          type: string
          format: date
          nullable: true
        finished:
          type: string
          format: date
          nullable: true
        url:
          type: string
        tournament:
          description: Which of the catalogue's tournaments it is, by slug; "" for none
          type: string
        rated:
          description: Whether that tournament is in a ranking
          type: boolean
    Catalogue:
      type: object
      required: [run_id, tournaments, cge_tournaments]
      properties:
        run_id:
          type: integer
          format: int64
        tournaments:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueEntry"
        cge_tournaments:
          description: The tournaments on CGE's site the site shows (rated, or made visible), newest first
          type: array
          items:
            $ref: "#/components/schemas/CGETournament"
    RecentPodiums:
      type: object
      required: [run_id, podiums]
      properties:
        run_id:
          type: integer
          format: int64
        podiums:
          type: array
          items:
            $ref: "#/components/schemas/RecentPodium"
    RecentPodium:
      description: A tournament season's podium
      type: object
      required: [slug, name, season, season_name, finished, podium]
      properties:
        slug:
          type: string
        name:
          description: The tournament's name
          type: string
        season:
          description: The season's label, as the catalogue gives it
          type: string
        season_name:
          description: What the tournament calls a season ("Season" unless set)
          type: string
        finished:
          description: The season's last game, or its podium's finish when it has no games
          type: string
          format: date
        podium:
          type: array
          items:
            $ref: "#/components/schemas/PodiumPlace"
    CatalogueStage:
      description: A stage of a season; label "" is the season's only or main stage
      allOf:
        - $ref: "#/components/schemas/GameSpan"
        - type: object
          required: [label, note]
          properties:
            label:
              type: string
            note:
              description: A note shown beside the stage, or null
              type: string
              nullable: true
    PodiumPlace:
      description: A place on a cup year's recorded podium
      type: object
      required: [place, name, final, finished, source]
      properties:
        place:
          type: integer
        name:
          type: string
        final:
          description: Which final, when a year has several; "" otherwise
          type: string
        finished:
          type: string
          format: date
        source:
          description: Where the podium was recorded from
          type: string
    CatalogueSeason:
      allOf:
        - $ref: "#/components/schemas/SeasonSpan"
        - type: object
          required: [label, in_champions, stages, podium, cge_pages, note]
          properties:
            label:
              type: string
            in_champions:
              description: Its winner is listed among the tournament's champions; false for one admin leaves out, such as a play-off
              type: boolean
            note:
              description: A note shown beside the season, such as what a special season was, or null
              type: string
              nullable: true
            stages:
              type: array
              items:
                $ref: "#/components/schemas/CatalogueStage"
            podium:
              description: |
                The season's top three: a cup's recorded podium, or a league's
                recorded placements or else its top division's standings in
                this run. Empty when neither is known.
              type: array
              items:
                $ref: "#/components/schemas/PodiumPlace"
            cge_pages:
              description: The CGE pages the season's games come from, if any
              type: array
              items:
                type: string
    CatalogueTournament:
      type: object
      required: [run_id, slug, name, card, rated, seasons, ladder, top_tier_wins, players, rules, game_records, stories, season_name, stage_name]
      properties:
        season_name:
          description: What it calls a season, as headings use it ("Season" unless admin set another word, such as "Edition")
          type: string
        stage_name:
          description: What it calls a stage ("Stage" unless admin set another word, such as "Season")
          type: string
        stories:
          description: Its stories, as admin writes them, in order
          type: array
          items:
            $ref: "#/components/schemas/Story"
        game_records:
          description: The ten highest winning scores in its played games
          type: array
          items:
            $ref: "#/components/schemas/GameRecord"
        rated:
          description: In a ranking, so its games move ratings
          type: boolean
        card:
          $ref: "#/components/schemas/TournamentCard"
        ladder:
          description: A ladder's champions are counted as top-tier wins, not season podiums
          type: boolean
        rules:
          description: Each CGE edition's description, usually its organiser's format and rules, newest first; plain text
          type: array
          items:
            $ref: "#/components/schemas/EditionRules"
        regulations:
          description: The format and regulations written in admin, shown instead of the rules; plain text, absent for none
          type: string
        players:
          description: Everyone who played a shown game of the tournament, by name, for a search box
          type: array
          items:
            type: string
        top_tier_wins:
          description: A ladder's players by their wins in its top tier, most first, as its organisers count them (half a win for a tie)
          type: array
          items:
            $ref: "#/components/schemas/LadderWin"
        run_id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        seasons:
          description: In order of their first game
          type: array
          items:
            $ref: "#/components/schemas/CatalogueSeason"
    EditionRules:
      type: object
      required: [cge_tournament, name, url, description]
      properties:
        cge_tournament:
          type: integer
        name:
          type: string
        url:
          type: string
        description:
          type: string
    LadderWin:
      type: object
      required: [name, wins, source]
      properties:
        name:
          type: string
        wins:
          type: number
          format: double
        source:
          type: string
    CatalogueGames:
      type: object
      required: [run_id, slug, page, pages, total, coded, groups, games]
      properties:
        run_id:
          type: integer
          format: int64
        slug:
          type: string
        page:
          type: integer
        pages:
          type: integer
        total:
          description: The games the filters keep
          type: integer
        coded:
          description: How many of the games the season, stage and group keep have a replay code
          type: integer
        groups:
          description: The chosen season's groups (in its chosen stage), in order; empty when no season is chosen
          type: array
          items:
            type: string
        games:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueGame"
    CatalogueGame:
      type: object
      required: [match_id, date, season, stage, group, game, state, replay_code, seats, rated]
      properties:
        rated:
          description: Counts towards ratings - played, and its tournament, season and player count rated
          type: boolean
        match_id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        season:
          type: string
        stage:
          description: "\"\" for a season's only or main stage"
          type: string
        group:
          description: "\"\" when the game's name gives none"
          type: string
        game:
          description: The game's number in its group, or null when its name gives none
          type: integer
          nullable: true
        state:
          type: string
          description: A never-played game had no player; an unconfirmed one has a result in doubt. Neither is rated
          enum: [played, never_played, unconfirmed]
        replay_code:
          type: string
          nullable: true
        seats:
          description: Highest score first
          type: array
          items:
            $ref: "#/components/schemas/GameSeat"
    GameSeat:
      description: |
        One player of a game. A player whose CGE account is deleted or banned
        is masked as "Deleted player".
      type: object
      required: [name, score, outcome]
      properties:
        name:
          type: string
        score:
          type: number
          format: double
        outcome:
          description: How the seat ended, as CGE records it; null where CGE's seats are not known
          type: string
          enum: [finished, resigned, timed_out]
          nullable: true
    Series:
      description: A tournament series
      type: string
      enum: [international, intermezzo, royal_league, worlds, grand_slams, ladders]
    TournamentSeries:
      type: object
      required: [run_id, series, games, seasons, board, season_records, game_records]
      properties:
        run_id:
          type: integer
          format: int64
        series:
          $ref: "#/components/schemas/Series"
        games:
          description: The games the original site counts for the series, by its name patterns
          type: integer
        seasons:
          description: |
            The editions the original site counts: the latest season a
            league game's name gives, the World Championship's distinct
            editions, the cups' distinct names before "Stage", or the
            ladders' fixed 16
          type: integer
        board:
          description: The series' board in the original site's order (for leagues, most golds first, then silvers, bronzes and career points)
          type: array
          items:
            $ref: "#/components/schemas/TrophyRow"
        season_records:
          description: The ten best top-division seasons by points, then wins
          type: array
          items:
            $ref: "#/components/schemas/SeasonRecord"
        game_records:
          description: The ten highest winning scores in the games a series page lists (top-division or World Championship playoff games)
          type: array
          items:
            $ref: "#/components/schemas/GameRecord"
    TrophyRow:
      description: |
        One player on a series' board: medals and a title for the leagues
        and the World Championship, medals and honours for the cups, or
        ladder games, wins and win rate. What a board does not show is null
      type: object
      required: [name, world_champion, title, gold, silver, bronze, details, games, wins, win_rate]
      properties:
        name:
          type: string
        world_champion:
          type: boolean
        title:
          description: WC for a World Champion, GM for a top-division winner or World Championship medallist, else M
          type: string
          enum: [WC, GM, M]
          nullable: true
        gold:
          type: integer
          nullable: true
        silver:
          type: integer
          nullable: true
        bronze:
          type: integer
          nullable: true
        details:
          description: A cup medallist's first two honours
          type: string
          nullable: true
        games:
          description: Ladder games played
          type: integer
          nullable: true
        wins:
          type: integer
          nullable: true
        win_rate:
          description: Ladder wins as a percentage of games, to one decimal
          type: number
          format: double
          nullable: true
    SeasonRecord:
      type: object
      required: [name, world_champion, points, games, placings, season, division, last_played]
      properties:
        name:
          type: string
        world_champion:
          type: boolean
        points:
          type: number
          format: double
        games:
          type: integer
        placings:
          description: |
            How often the player finished 1st, 2nd, 3rd (and 4th in the
            International Championship); in the Royal League, wins, draws
            and losses
          type: array
          items:
            type: integer
        season:
          type: integer
        division:
          type: string
        last_played:
          type: string
          format: date
    GameRecord:
      type: object
      required: [name, world_champion, score, opponents, tournament, date]
      properties:
        name:
          description: The game's winner
          type: string
        world_champion:
          type: boolean
        score:
          type: number
          format: double
        opponents:
          description: The other players, highest score first
          type: array
          items:
            $ref: "#/components/schemas/Seat"
        tournament:
          type: string
        date:
          type: string
          format: date
    HallOfFame:
      type: object
      required: [run_id, series, legends, grand_slams, ladders]
      properties:
        run_id:
          type: integer
          format: int64
        series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesCount"
        legends:
          description: Up to 25 players, most titles first
          type: array
          items:
            $ref: "#/components/schemas/Legend"
        grand_slams:
          description: The first ten rows of the Grand Slams board
          type: array
          items:
            $ref: "#/components/schemas/TrophyRow"
        ladders:
          description: The first ten rows of the Ladders board
          type: array
          items:
            $ref: "#/components/schemas/TrophyRow"
    SeriesCount:
      type: object
      required: [series, games, seasons]
      properties:
        series:
          $ref: "#/components/schemas/Series"
        games:
          type: integer
        seasons:
          description: The editions the series page states (see TournamentSeries)
          type: integer
    Legend:
      type: object
      required: [name, world_champion, world_titles, international_titles, intermezzo_titles, royal_league_titles, gold, silver, bronze]
      properties:
        name:
          type: string
        world_champion:
          type: boolean
        world_titles:
          type: integer
        international_titles:
          type: integer
        intermezzo_titles:
          type: integer
        royal_league_titles:
          type: integer
        gold:
          description: Podium medals across the four circuits
          type: integer
        silver:
          type: integer
        bronze:
          type: integer
