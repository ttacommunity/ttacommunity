                  $ref: "#/components/schemas/AdminTournamentRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: postAdminGroup
      tags: [admin]
      summary: Make a group of related tournaments, holding the ones named
      description: |
        Its slug comes from its name. Admins and organisers may make one; it is
        audited. The Origin must be the admin site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewGroup"
      responses:
        "201":
          description: Made
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/tournaments/{tournament}:
    get:
      operationId: getAdminTournament
      tags: [admin]
      summary: One tournament with its settings, seasons (latest first), stages, notes, podiums and stories
      description: Each season and stage comes with its games and players.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
      responses:
        "200":
          description: The tournament
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTournament"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchAdminTournament
      tags: [admin]
      summary: Change a tournament's settings, card, regulations, stories, description, group, or a group's members
      description: |
        Only the settings given change. Admins and organisers may change them,
        apart from a league's rules (divisions, super_gm, record_min_games),
        which only admins may; each change is audited. The Origin must be the
        admin site. Rating takes effect on the next engine run.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentSettings"
      responses:
        "204":
          description: Changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/admins:
    get:
      operationId: getAdminAdmins
