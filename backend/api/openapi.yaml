        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/candidates:
    get:
      operationId: getAdminBlitzCandidates
      tags: [admin]
      summary: The five people who best match a name, of those who could be entered in an edition
      description: |
        Members not in the edition, and players the ratings know who are no
        member yet, whose username or ratings spelling holds q in any case.
        The name itself comes first, then names starting with q, then the
        rest; people with an account or entered in an edition before the
