            and losses
          type: array
          items:
            type: integer
        season:
          type: integer
        division:
          type: string
        last_played:
          type: string
          format: date
    GameRecord:
      type: object
      required: [name, world_champion, score, opponents, tournament, date]
      properties:
        name:
          description: The game's winner
          type: string
        world_champion:
          type: boolean
        score:
          type: number
          format: double
        opponents:
          description: The other players, highest score first
          type: array
          items:
            $ref: "#/components/schemas/Seat"
        tournament:
          type: string
        date:
          type: string
          format: date
    HallOfFame:
      type: object
      required: [run_id, series, legends, grand_slams, ladders]
      properties:
        run_id:
          type: integer
          format: int64
        series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesCount"
        legends:
          description: Up to 25 players, most titles first
          type: array
          items:
            $ref: "#/components/schemas/Legend"
        grand_slams:
          description: The first ten rows of the Grand Slams board
          type: array
          items:
            $ref: "#/components/schemas/TrophyRow"
        ladders:
          description: The first ten rows of the Ladders board
          type: array
          items:
            $ref: "#/components/schemas/TrophyRow"
    SeriesCount:
      type: object
      required: [series, games, seasons]
      properties:
