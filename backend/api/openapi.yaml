          type: string
          maxLength: 60
        title:
          type: string
          maxLength: 120
        text:
          type: string
          maxLength: 1000
    TournamentCard:
      description: How a tournament presents itself on its card and its page's header; an empty field is unset
      type: object
      additionalProperties: false
      required: [icon, tagline, summary, subtitle, cadence]
      properties:
        subtitle:
          description: The line under the name on the tournament's page, such as "4-Player Competitive Format"
          type: string
          maxLength: 60
        cadence:
          description: How often it is played, such as "Annual (Every Year)"
          type: string
          maxLength: 60
        icon:
          description: An emoji or a few characters
          type: string
          maxLength: 8
        tagline:
          description: The short description, such as "Annual World Championship"
          type: string
          maxLength: 60
        summary:
          description: The information box; plain text
          type: string
          maxLength: 1000
    DataSummary:
      type: object
      required: [games, never_played, unplaced, players, latest_game, last_load, last_load_refused]
      properties:
        games:
          description: Played games
          type: integer
        never_played:
          description: Games recorded but never played, kept and not rated
          type: integer
        unplaced:
          description: Games in no tournament; a rating run refuses to start while any are
          type: integer
        players:
          type: integer
        latest_game:
          description: The latest played game's date
          type: string
          format: date
          nullable: true
        last_load:
          description: When data was last loaded
          type: string
          format: date-time
          nullable: true
        last_load_refused:
          description: Rows the last load refused
          type: integer
    StandingsCheck:
      type: object
      required: [stages, stages_only_on_cge]
      properties:
        stages:
          description: Every CGE stage both hold, in CGE's order
          type: array
          items:
            $ref: "#/components/schemas/StageCheck"
        stages_only_on_cge:
          description: Stages CGE has a table for and we hold no game of
          type: integer
    StageCheck:
      type: object
      required: [cge_tournament, cge_season, name, players, agree, differences]
      properties:
        cge_tournament:
          type: integer
        cge_season:
          type: integer
        name:
          description: CGE's name for the tournament; empty when it is not in the catalogue
          type: string
        players:
          description: Players either side lists with a game
          type: integer
        agree:
          type: integer
        differences:
          type: array
          items:
            $ref: "#/components/schemas/StandingDifference"
    StandingDifference:
      type: object
      required: [cge_user, player, kind, cge_games, held_games, held_never_played, cge_points, cge_places, held_places]
      properties:
        cge_user:
          type: integer
        player:
          description: The name CGE shows
          type: string
        kind:
          description: >-
            games: a different number of games; places: the same games in
            other places; places_after_a_timeout: as places, where one of
            their games had a timeout, which CGE's AI played on; not_held: CGE
            lists games of theirs and we hold none; not_on_cge: the other way
          type: string
          enum: [games, places, places_after_a_timeout, not_held, not_on_cge]
        cge_games:
          type: integer
        held_games:
          description: Every game held, including those no one played
