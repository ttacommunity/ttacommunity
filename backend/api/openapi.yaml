    delete:
      operationId: deleteAdminSeason
      tags: [admin]
      summary: Remove a season that has no games, with its notes
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/AdminSeasonLabel"
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/tournaments/{tournament}/seasons:
    post:
      operationId: postAdminSeason
      tags: [admin]
      summary: Add a season with no games yet, so a note can be shown for it
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSeason"
      responses:
        "204":
          description: Added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/community/editions:
    get:
      operationId: getAdminCommunityEditions
      tags: [admin]
      summary: Every edition of the community leaderboard
      description: |
        Every edition of the community leaderboard, visible or not, for maintainers to edit.
        Never cached.
      responses:
        "200":
          description: All editions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityEditionItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: postAdminCommunityEdition
      tags: [admin]
      summary: Create a new edition of the community leaderboard
      description: |
        Adds an edition of the community leaderboard with its metadata. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityEditionItem"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/community/editions/{edition}:
    patch:
      operationId: patchAdminCommunityEdition
      tags: [admin]
      summary: Edit an edition of the community leaderboard
      description: |
        Changes an edition's name, title, badge, maintainer note, counting events, or visibility. Audited.
      parameters:
        - name: edition
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityEditionPatch"
      responses:
        "204":
          description: Changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/runs:
    get:
      operationId: getAdminRuns
      tags: [admin]
      summary: Rating runs, newest first, with a running one's progress (admins only)
      description: >
        Where the API can see the engine's Jobs, a run still marked running
        with no engine Job going is shown as failed: its engine ended without
        marking it.
      responses:
        "200":
          description: The runs
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: postAdminRun
      tags: [admin]
      summary: Start a rating run now (admins only)
      description: >
        Starts the engine as a Job. The run is not published: publish it once
        it is complete. Audited. The Origin must be the admin site.
      responses:
        "202":
          description: The engine Job was created
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/admin/runs/stop:
    post:
      operationId: postAdminRunStop
      tags: [admin]
      summary: Stop the rating run that is going (admins only)
      description: >
        Deletes the engine's Job. The engine marks its run failed, with the
        progress line "stopped", as it ends. Audited. The Origin must be the
        admin site.
      responses:
        "204":
          description: Stopping
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/admin/runs/{run}:
    patch:
      operationId: patchAdminRun
      tags: [admin]
      summary: Protect a run from deletion, or stop protecting it (admins only)
      description: Audited. The Origin must be the admin site. Protecting a run being deleted keeps it.
      parameters:
        - $ref: "#/components/parameters/AdminRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunProtection"
      responses:
        "204":
          description: Set
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAdminRun
      tags: [admin]
      summary: Delete a run and every result of it, in the background (admins only)
      description: >-
        Audited. The Origin must be the admin site. Refused for a protected
        run, the current run, and a running one while the engine is going. The
        run shows as deleting until it is gone.
      parameters:
        - $ref: "#/components/parameters/AdminRunId"
      responses:
        "202":
          description: Being deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/runs/{run}/publish:
    post:
      operationId: postAdminRunPublish
      tags: [admin]
      summary: Make a complete run the one the site shows, or roll back to an older one (admins only)
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/AdminRunId"
      responses:
        "204":
          description: Published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/runs/{run}/changes:
    get:
      operationId: getAdminRunChanges
      tags: [admin]
      summary: How far ratings moved from another run, by default the one the site showed before it (admins only)
      description: >
        For a run never published, that is the published run; for a published
        run, the run first published most recently before it. Compares
        conservative ratings of the default model, in every format.
      parameters:
        - $ref: "#/components/parameters/AdminRunId"
        - name: against
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The changes
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunChanges"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/blitz:
    get:
      operationId: getAdminBlitzEditions
      tags: [admin]
      summary: Every edition of every series marked Blitz, with how many entrants are in and dropped
      responses:
        "200":
          description: The editions, by tournament name, newest edition first
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBlitzEditionRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/blitz/{tournament}/{edition}:
    get:
      operationId: getAdminBlitzEdition
      tags: [admin]
      summary: A blitz edition's format and every entrant, Discord names included
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      responses:
        "200":
          description: The edition
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBlitzEdition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchAdminBlitzEdition
      tags: [admin]
      summary: Set a blitz edition's format
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzFormat"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/blitz/{tournament}/{edition}/entrants:
    post:
      operationId: postAdminBlitzEntrants
      tags: [admin]
      summary: Add entrants to a blitz edition, all or none
      description: |
        Audited. The Origin must be the admin site. A time zone is an IANA
        name (Europe/Berlin). A name the ratings know is kept in their
        spelling. A name already entered, in any case, refuses the whole
        list and is named.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBlitzEntrants"
      responses:
        "201":
          description: Added
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlitzEntrantIds"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds:
    post:
      operationId: postAdminBlitzRound
      tags: [admin]
      summary: Pair the edition's next round as a draft
      description: |
        Audited. The Origin must be the admin site. Everyone active is
        paired on equal points where possible, never with an opponent they
        have met; within a score group the pairs are the best time-zone fit
        (and the closest ratings, when asked), chance deciding the rest. With
        an odd count the lowest-ranked player without a bye gets it. Refused
        while a draft exists or a match so far has no result.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBlitzRound"
      responses:
        "201":
          description: The draft round
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBlitzRound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}:
    delete:
      operationId: deleteAdminBlitzRound
      tags: [admin]
      summary: Delete the latest round while nothing in it is played
      description: |
        Audited. The Origin must be the admin site. Only the latest round,
        draft or published, and only while none of its matches has a result.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/matches:
    put:
      operationId: putAdminBlitzRoundMatches
      tags: [admin]
      summary: Replace a round's matches, as paired by hand
      description: |
        Audited. The Origin must be the admin site. A match names two active
        entrants, or one for the bye; nobody twice; never a pair that has met.
        A round may be left incomplete until it is published.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzRoundMatches"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/publish:
    post:
      operationId: postAdminBlitzRoundPublish
      tags: [admin]
      summary: Publish a round, once everyone active is in it exactly once
      description: Audited. The Origin must be the admin site. Publishing again changes nothing.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
      responses:
        "204":
          description: Published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/matches/{match}/game:
    put:
      operationId: putAdminBlitzMatchGame
      tags: [admin]
      summary: Record the game a match was played as, or correct it
      description: |
        Audited. The Origin must be the admin site. The game is written under
        the edition's "Round N" stage with a seat for each player, so the
        tournament's page shows it at once; recording the match again changes
        that one game. The higher culture wins and equal cultures draw; a
        resigned or timed-out player loses with culture 0. A share code already
        on another game is refused, naming it. The match's ruling, if any, is
        cleared.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
        - $ref: "#/components/parameters/BlitzMatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzGameRecord"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/matches/{match}/ruling:
    put:
      operationId: putAdminBlitzMatchRuling
      tags: [admin]
      summary: Decide a match by the organisers' ruling
      description: |
        Audited. The Origin must be the admin site. A ruling awards the match
        to one player, calls it a draw or a double loss, with its reason. A
        game the match already has stays, overruled; recording the game again
        puts its result back.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
        - $ref: "#/components/parameters/BlitzMatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzRuling"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/blitz/{tournament}/{edition}/entrants/{entrant}:
    patch:
      operationId: patchAdminBlitzEntrant
      tags: [admin]
      summary: Change an entrant's Discord name, time zone or status (active or dropped)
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzEntrantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzEntrantChange"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAdminBlitzEntrant
      tags: [admin]
      summary: Remove an entrant added by mistake
      description: Audited. The Origin must be the admin site.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzEntrantId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    BlitzEditionLabel:
      name: edition
      in: path
      required: true
      description: The edition's label, as admin lists it (a season)
      schema:
        type: string
        minLength: 1
        maxLength: 64
    BlitzEntrantId:
      name: entrant
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BlitzRoundId:
      name: round
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BlitzMatchId:
      name: match
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MemberId:
      name: member
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminBadgeId:
      name: badge
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminPlayer:
      name: player
      in: path
      required: true
      description: The player's name, as the leaderboard gives it
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AdminRunId:
      name: run
      in: path
      required: true
      description: Any run's id, published or not
      schema:
        type: integer
        format: int64
        minimum: 1
    DiscordID:
      name: discord_id
      in: path
      required: true
      description: A Discord user id
      schema:
        type: string
        pattern: "^[0-9]{5,25}$"
    AdminTournamentSlug:
      name: tournament
      in: path
      required: true
      description: The tournament's slug
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
        maxLength: 64
    AdminSeasonLabel:
      name: season
      in: path
      required: true
      description: The season's label, as admin lists it
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Model:
      name: model
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Model"
    Format:
      name: format
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Format"
    PlayerName:
      name: name
      in: path
      required: true
      description: The player's name, as the leaderboard gives it
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RunId:
      name: run
      in: path
      required: true
      description: A published run's id, from `/v1/runs/current`
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    CacheControl:
      required: true
      schema:
        type: string
  responses:
    Conflict:
      description: The change cannot be made in the current state, such as a run already going
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotSetUp:
      description: This API is not set up to do that here
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No Access token, or one that does not verify
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The token is valid, but its Discord id is not an admin or organiser
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: A parameter is not one the API knows
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No published run has this id. It may be published later, so this is not cached
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoPublishedRun:
      description: No run has been published yet
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AdminRun:
      type: object
      required: [id, status, started_at, current, games, players, engine_version, progress, protected, deleting, bytes]
      properties:
        bytes:
