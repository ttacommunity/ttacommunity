          required: [slug, name, seasons, rankings]
          properties:
            slug:
              type: string
            name:
              type: string
            seasons:
              type: integer
            rankings:
              description: The rankings it is rated in, by slug; none for a tournament not rated
              type: array
              items:
                type: string
