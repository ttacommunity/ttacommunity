            $ref: "#/components/schemas/BlitzMatchChange"
    BlitzMatchChange:
      description: A match by entrant ids, b left out for the bye
      type: object
      additionalProperties: false
      required: [a]
      properties:
        a:
          type: integer
          format: int64
        b:
          description: Left out for the bye
          type: integer
          format: int64
    AdminBlitzEditionRow:
      description: One edition of a blitz tournament as admin's list shows it
      type: object
      required: [tournament, name, edition, format, entrants, dropped, round, champion, flagged]
      properties:
        flagged:
          description: How many players' reports are flagged and waiting for an organiser
          type: integer
        champion:
          description: The winner of the knockout's final, by username; null until the final has a winner
          type: string
          nullable: true
        round:
          description: The latest published round's number, null before the first is published
          type: integer
          nullable: true
        tournament:
          type: string
        name:
          type: string
        edition:
          type: string
        format:
          $ref: "#/components/schemas/BlitzFormat"
        entrants:
          description: How many entrants are still in
          type: integer
        dropped:
          description: How many have dropped out
          type: integer
    AdminBlitzEntrant:
      type: object
      required: [id, member, name, player, discord_name, email, country, zone, utc_offset, rating, starting_rank, status, skips]
      properties:
        id:
          type: integer
          format: int64
        member:
          description: The member entered
          type: integer
          format: int64
        name:
          description: The member's TTA username
          type: string
        player:
          description: The ratings' spelling of the name, empty for a player the ratings do not know
          type: string
        discord_name:
          type: string
        email:
          type: string
        country:
          type: string
          nullable: true
        zone:
          type: string
        utc_offset:
          type: string
        rating:
          type: number
          format: double
          nullable: true
        starting_rank:
          description: The Dutch system's starting rank, fixed when round 1 was paired (1 the top); null before
          type: integer
          nullable: true
        status:
          description: Active is in; dropped is out of the rounds still to come, their results kept
          allOf:
