        world_champion:
          type: boolean
        world_titles:
          type: integer
        international_titles:
          type: integer
        intermezzo_titles:
          type: integer
        royal_league_titles:
          type: integer
        gold:
          description: Podium medals across the four circuits
          type: integer
        silver:
          type: integer
        bronze:
          type: integer
