openapi: 3.0.3
info:
  title: ttacommunity API
  version: 0.1.0
  description: |
    Public ratings for Through the Ages. Ratings change only when a new run
    is published, so each run's data sits at its own URL. Ask
    `/v1/runs/current` which run to read, then read that run.
    See docs/architecture.md#rating-runs.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: The process is up
      responses:
        "200":
          description: Up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: The process can reach the ratings database
      responses:
        "200":
          description: Ready
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/runs/current:
    get:
      operationId: getCurrentRun
      summary: The run the site shows now
      description: Cached for a minute, so a newly published run shows within one.
      responses:
        "200":
          description: The current run
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "503":
          $ref: "#/components/responses/NoPublishedRun"
  /v1/runs/{run}/leaderboard:
    get:
      operationId: getLeaderboard
      summary: Every rated player in one model and format, in rank order
      description: |
        A published run's ratings never change, but each row also carries the
        player's details as they are now (country), so this is cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The leaderboard
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/leaderboard.csv:
    get:
      operationId: getLeaderboardCsv
      summary: The leaderboard as a CSV file, filtered and sorted as the site's table
      description: |
        The players the site's leaderboard shows for the same choices, in its
        order, with their titles, career peaks and records. Rows carry
        player details as they are now, so this is cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
        - name: status
          in: query
          required: false
          description: Active players (last played after 2025-05-31), inactive ones, or all
          schema:
            type: string
            enum: [active, all, inactive]
            default: active
        - name: min_opps
          in: query
          required: false
          description: The fewest opponents a player needs
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 30
        - name: title
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TitleCode"
        - name: search
          in: query
          required: false
          description: Names or country codes, comma-separated; a name matches anywhere, ignoring case
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [rank, name, c_rating, rating, opps, win_rate, last_played]
            default: rank
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: The CSV file, UTF-8 with a byte-order mark
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/history:
    get:
      operationId: getHistory
      summary: Each player's rating at a past date, for rating changes over time
      description: |
        Each player's rating at the end of the latest rating period on or
        before `at`. Without `at`, the run's previous period, the one before
        its last. A player with no rating by then is left out. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
        - name: at
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The ratings at that date
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}:
    get:
      operationId: getPlayer
      summary: One player's ratings in every model and format, for the player page
      description: |
        The player's ratings in the ten continuous and season-reset models,
        each format, with their title, career peak, country and game counts.
        A name that matches no player exactly is looked up ignoring case,
        if only one player matches. Country and titles can change without a
        new run, so this is cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "200":
          description: The player
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/history:
    get:
      operationId: getPlayerHistory
      summary: One player's rating at the end of every period, for the chart
      description: |
        The player's rating and conservative rating after each rating period
        in the ten continuous and season-reset models, for one format. Cached
        for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The player's history
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/matches:
    get:
      operationId: getPlayerMatches
      summary: One player's games, newest first, 30 to a page
      description: |
        The games the run rated for the player, in one format (0 is all).
        Each carries an estimate of what it is worth to the player's rating
        today: one rating update from the run's final ratings in `model`
        (WHR is estimated with GlickoD's update). A page past the last gives
        the last. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Model"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: One page of games
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerMatches"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/rivals:
    get:
      operationId: getPlayerRivals
      summary: The player's record against each opponent
      description: |
        Wins, losses and draws against the 200 opponents the player has met
        most, in one format (0 is all). Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The player's rivals
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerRivals"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/career:
    get:
      operationId: getPlayerCareer
      summary: One player's record each year and each model's peak, for the career box
      description: |
        The player's record in each calendar year of one format (every
        format together when that format has none), with the year's highest
        rating in any model and the title the run derived for that year; and
        each continuous model's peak rating, when it was, and the player's
        rank among that month's ratings. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The player's career
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerCareer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/versus/{other}:
    get:
      operationId: getPlayerVersus
      summary: The latest games two players played together
      description: |
        The 100 latest games the run rated with both players at the table,
        in every format, newest first, with where each finished. Cached for
        five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - name: other
          in: path
          required: true
          description: The other player's name
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Their shared games
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerVersus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/matrix:
    get:
      operationId: getPlayerMatrix
      summary: One player's rating in each engine and reset mode, now or at a year's end
      description: |
        The player's rating, deviation, conservative rating and rank in the
        ten continuous and season-reset models for one format. Without
        `year`, the run's ratings and ranks. With it, each model's last
        rating period that year, ranked by conservative rating in it; a
        model the player has no row in then is left out. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: The player's ratings by model
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerMatrix"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/years:
    get:
      operationId: getYears
      summary: The years a run's ratings cover, newest first, for the season archive
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The years
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Years"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/years/{year}/leaderboard:
    get:
      operationId: getYearLeaderboard
      summary: The ratings at the end of a year, for the season archive
      description: |
        The ratings on the model's last rating period of the year (another
        model's when this one has none that year), for the players rated
        on it, best conservative rating first, as upstream's archive shows
        them. Each carries the player's record that year and up to it, and
        their rating on the previous year's last period. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: year
          in: path
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The year's board
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearLeaderboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Model:
      name: model
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Model"
    Format:
      name: format
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Format"
    PlayerName:
      name: name
      in: path
      required: true
      description: The player's name, as the leaderboard gives it
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RunId:
      name: run
      in: path
      required: true
      description: A published run's id, from `/v1/runs/current`
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    CacheControl:
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: A parameter is not one the API knows
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No published run has this id. It may be published later, so this is not cached
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoPublishedRun:
      description: No run has been published yet
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Run:
      type: object
      required: [run_id, published_at]
      properties:
        run_id:
          type: integer
          format: int64
        published_at:
          type: string
          format: date-time
    Model:
      description: |
        The rating model. `_softer` models reset gently each season, and
        `_retro` models start from a retrospectively calibrated prior.
      type: string
      default: glicko2_daneo
      enum:
        - glicko2_daneo
        - glicko2_daneo_softer
        - glicko2_std
        - glicko2_std_softer
        - glicko2_std_retro
        - glicko2_std_softer_retro
        - glicko2_mp
        - glicko2_mp_softer
        - glicko2_mp_retro
        - glicko2_mp_softer_retro
        - glicko2_adapt
        - glicko2_adapt_softer
        - glicko2_adapt_retro
        - glicko2_adapt_softer_retro
        - whr
        - whr_softer
    Format:
      description: Players per game. 0 is every format together
      type: integer
      default: 0
      enum: [0, 2, 3, 4]
    Leaderboard:
      type: object
      required: [run_id, model, format, players]
      properties:
        run_id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        players:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardRow"
    LeaderboardRow:
      type: object
      required: [rank, rank_delta, name, rating, rd, c_rating, games, opponents, wins, losses, draws, win_rate, last_played, country, title]
      properties:
        rank:
          type: integer
          nullable: true
        rank_delta:
          type: integer
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          description: Rating deviation
          type: number
          format: double
        c_rating:
          description: Conservative rating, which the rank is ordered by
          type: number
          format: double
        games:
          type: integer
        opponents:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100
          type: number
          format: double
        last_played:
          type: string
          format: date
          nullable: true
        country:
          description: The player's country, ISO 3166-1 alpha-2, if known
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
    History:
      type: object
      required: [run_id, model, format, at, players]
      properties:
        run_id:
          type: integer
          format: int64
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        at:
          description: The date asked for, or the previous period's when none was
          type: string
          format: date
        players:
          type: array
          items:
            $ref: "#/components/schemas/HistoryRow"
    HistoryRow:
      type: object
      required: [name, rating, rd, c_rating]
      properties:
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
    TitleCode:
      type: string
      enum: [WC, GM, M, P, G, S, B, W]
    Title:
      description: The tournament title the run derived for the player, if any
      type: object
      nullable: true
      required: [code, count, reason]
      properties:
        code:
          $ref: "#/components/schemas/TitleCode"
        count:
          description: How many titles the player has earned
          type: integer
        reason:
          description: Why the player holds it, e.g. the latest division played
          type: string
    Player:
      type: object
      required: [run_id, name, country, title, peak, last_played, newest_game, games, ratings]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          description: The player's name as stored, whatever case was asked for
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
        peak:
          $ref: "#/components/schemas/Peak"
        last_played:
          type: string
          format: date
          nullable: true
        newest_game:
          description: The date of the newest game in the run, by anyone
          type: string
          format: date
          nullable: true
        games:
          description: How many games the player has in the run, by format (0 is all)
          type: array
          items:
            $ref: "#/components/schemas/FormatGames"
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRating"
    Peak:
      description: The player's best title over their career, if any
      type: object
      nullable: true
      required: [code, year]
      properties:
        code:
          $ref: "#/components/schemas/TitleCode"
        year:
          type: integer
          nullable: true
    FormatGames:
      type: object
      required: [format, games]
      properties:
        format:
          $ref: "#/components/schemas/Format"
        games:
          type: integer
    PlayerRating:
      type: object
      required: [model, format, rank, rating, rd, c_rating, opponents, win_rate]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        rank:
          type: integer
          nullable: true
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        opponents:
          type: integer
        win_rate:
          description: Percent, 0 to 100
          type: number
          format: double
    PlayerHistory:
      type: object
      required: [run_id, name, format, series]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        series:
          type: array
          items:
            $ref: "#/components/schemas/HistorySeries"
    HistorySeries:
      type: object
      required: [model, points]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        points:
          description: Oldest first
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"
    HistoryPoint:
      type: object
      required: [date, rating, c_rating]
      properties:
        date:
          type: string
          format: date
        rating:
          type: number
          format: double
        c_rating:
          type: number
          format: double
    PlayerMatches:
      type: object
      required: [run_id, name, format, model, page, pages, total, matches]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        model:
          $ref: "#/components/schemas/Model"
        page:
          type: integer
        pages:
          type: integer
        total:
          description: The player's games in this format
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/PlayerMatch"
    PlayerMatch:
      type: object
      required: [match_id, tournament, date, player_count, placement, replay_code, rating_delta, seats]
      properties:
        match_id:
          type: integer
          format: int64
        tournament:
          type: string
        date:
          type: string
          format: date
        player_count:
          type: integer
        placement:
          description: The player's place, 1 for the highest score
          type: integer
        replay_code:
          type: string
          nullable: true
        rating_delta:
          description: What the game is worth to the player's rating today, to 0.1
          type: number
          format: double
          nullable: true
        seats:
          description: Highest score first
          type: array
          items:
            $ref: "#/components/schemas/Seat"
    Seat:
      type: object
      required: [name, score]
      properties:
        name:
          type: string
        score:
          type: number
          format: double
    PlayerRivals:
      type: object
      required: [run_id, name, format, rivals]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        rivals:
          description: Most games first
          type: array
          items:
            $ref: "#/components/schemas/Rival"
    Rival:
      type: object
      required: [name, games, wins, losses, draws, win_rate]
      properties:
        name:
          type: string
        games:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
    PlayerCareer:
      type: object
      required: [run_id, name, format, years, peaks]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        years:
          description: Oldest first
          type: array
          items:
            $ref: "#/components/schemas/CareerYear"
        peaks:
          description: GlickoD, Standard, MP-Weighted, Adaptive-T, WHR, for those with history
          type: array
          items:
            $ref: "#/components/schemas/ModelPeak"
    CareerYear:
      type: object
      required: [year, opponents, wins, losses, draws, win_rate, peak_rating, title, year_end_rating, career_opponents, career_wins, career_losses, career_draws, career_win_rate]
      properties:
        year:
          type: integer
        opponents:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
        peak_rating:
          description: The year's highest rating in any model's history, to 0.1
          type: number
          format: double
          nullable: true
        year_end_rating:
          description: Glicko-2 Standard's last rating that year, to 0.1, as upstream shows it
          type: number
          format: double
          nullable: true
        career_opponents:
          description: Opponents from the first year to the end of this one
          type: integer
        career_wins:
          type: integer
        career_losses:
          type: integer
        career_draws:
          type: integer
        career_win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
        title:
          description: The best title the run derived for the player that year
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TitleCode"
    ModelPeak:
      type: object
      required: [model, rating, rank, date]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        rating:
          description: The highest rating, to 0.1
          type: number
          format: double
        rank:
          description: 1 + how many ratings that period were higher
          type: integer
        date:
          type: string
          format: date
    PlayerVersus:
      type: object
      required: [run_id, name, other, matches]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        other:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/VersusMatch"
    VersusMatch:
      type: object
      required: [match_id, tournament, date, player_count, name_place, other_place, seats]
      properties:
        match_id:
          type: integer
          format: int64
        tournament:
          type: string
        date:
          type: string
          format: date
        player_count:
          type: integer
        name_place:
          type: integer
        other_place:
          type: integer
        seats:
          description: Highest score first
          type: array
          items:
            $ref: "#/components/schemas/Seat"
    PlayerMatrix:
      type: object
      required: [run_id, name, format, year, cells]
      properties:
        run_id:
          type: integer
          format: int64
        name:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        year:
          description: The year asked for, or null for the run's ratings
          type: integer
          nullable: true
        cells:
          type: array
          items:
            $ref: "#/components/schemas/MatrixCell"
    MatrixCell:
      type: object
      required: [model, rating, rd, c_rating, rank]
      properties:
        model:
          $ref: "#/components/schemas/Model"
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        rank:
          type: integer
          nullable: true
    Years:
      type: object
      required: [run_id, years]
      properties:
        run_id:
          type: integer
          format: int64
        years:
          type: array
          items:
            type: integer
    YearLeaderboard:
      type: object
      required: [run_id, year, model, format, snapshot, previous, games, champions, players]
      properties:
        run_id:
          type: integer
          format: int64
        year:
          type: integer
        model:
          $ref: "#/components/schemas/Model"
        format:
          $ref: "#/components/schemas/Format"
        snapshot:
          description: The rating period the board is taken from
          type: string
          format: date
        previous:
          description: The previous year's last period, which the changes compare with
          type: string
          format: date
          nullable: true
        games:
          description: Games the run rated that year, in every format
          type: integer
        champions:
          type: array
          items:
            $ref: "#/components/schemas/Champion"
        players:
          type: array
          items:
            $ref: "#/components/schemas/YearRow"
    Champion:
      type: object
      required: [name, reigning]
      properties:
        name:
          type: string
        reigning:
          description: True for the current champion, in the run's latest year
          type: boolean
    YearRow:
      type: object
      required: [name, rating, rd, c_rating, country, title, season, career, last_played, previous]
      properties:
        name:
          type: string
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          nullable: true
        title:
          $ref: "#/components/schemas/Title"
        season:
          $ref: "#/components/schemas/YearRecord"
        career:
          $ref: "#/components/schemas/YearRecord"
        last_played:
          description: The player's last game that year
          type: string
          format: date
          nullable: true
        previous:
          $ref: "#/components/schemas/PreviousRating"
    YearRecord:
      type: object
      required: [opponents, wins, losses, draws, win_rate]
      properties:
        opponents:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        win_rate:
          description: Percent, 0 to 100, a draw counting half
          type: number
          format: double
    PreviousRating:
      description: The player's rating on the previous year's last period, if they had one
      type: object
      nullable: true
      required: [rating, rd, c_rating]
      properties:
        rating:
          type: number
          format: double
        rd:
          type: number
          format: double
        c_rating:
          type: number
          format: double
