          type: integer
        intermezzo_titles:
          type: integer
        royal_league_titles:
          type: integer
        gold:
          type: integer
        silver:
          type: integer
        bronze:
          type: integer
        accolades:
          description: At most six, in the order the page features them
          type: array
          items:
            type: string
    TournamentRecord:
      type: object
      required: [tournament, season, division, placement, points, medal, details, finish_date, career]
      properties:
        tournament:
