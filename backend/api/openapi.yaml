          type: integer
        cge_points:
          type: number
          format: double
        cge_places:
          $ref: "#/components/schemas/Places"
        held_places:
          $ref: "#/components/schemas/Places"
    Places:
      description: Firsts, seconds and so on in games of 2, 3 and 4 players; null for a size not played
      type: object
      required: [p2, p3, p4]
      properties:
        p2:
          type: array
          nullable: true
          items:
            type: integer
        p3:
          type: array
          nullable: true
          items:
            type: integer
        p4:
          type: array
          nullable: true
          items:
            type: integer
    ExtraBadge:
      type: object
