        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberChange"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAdminMember
      tags: [admin]
      summary: Remove a member added by mistake (admins only)
      description: |
        Audited. The Origin must be the admin site. A member in an edition, or one a player's sign-in is linked to
        (unlink it first), cannot be removed.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/members/{member}/ban:
