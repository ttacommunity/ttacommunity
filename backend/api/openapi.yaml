          type: integer
        players:
          type: integer
        first_game:
          type: string
          format: date
        last_game:
          type: string
          format: date
    SeasonSpan:
      description: A season's games and players, and its first and last game; a season admin added before it has games has none
      type: object
      required: [games, players, first_game, last_game]
      properties:
        games:
          type: integer
        players:
          type: integer
        first_game:
          type: string
          format: date
          nullable: true
        last_game:
          type: string
          format: date
          nullable: true
