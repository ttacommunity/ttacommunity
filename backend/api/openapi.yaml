          enum: [recorded, final_stage, ""]
          x-enum-varnames: [SuggestedRecorded, SuggestedFinalStage, SuggestedNone]
        label:
          type: string
        has_games:
          description: False for a season admin added, which can be removed
          type: boolean
        note:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/AdminStage"
