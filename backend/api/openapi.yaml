    delete:
      operationId: deleteAdminAdmin
      tags: [admin]
      summary: Take someone out of admin (admins only; admin always keeps one admin)
      description: Audited. The Origin must be the admin site. Their Access session still lasts until it ends or is revoked in Cloudflare.
      parameters:
        - $ref: "#/components/parameters/DiscordID"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/audit:
    get:
      operationId: getAdminAudit
      tags: [admin]
      summary: The audit log, newest first, 50 to a page (admins only)
      description: |
        Every change made in admin, and each player's own change the log
        records, with who made it. A page past the last gives the last.
      parameters:
        - name: action
          in: query
          required: false
          description: Only this action
          schema:
            type: string
            maxLength: 100
        - name: q
          in: query
          required: false
          description: Only entries whose action, target, detail or admin's name holds this, in any case
          schema:
            type: string
            maxLength: 100
        - name: from
          in: query
          required: false
          description: Only entries at or after this time
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only entries before this time, which is not before from
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: One page of the log
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/members:
    get:
      operationId: getAdminMembers
      tags: [admin]
      summary: The community's members, by name (admins and organisers)
      description: |
        Everyone who takes part in anything we run, and every player given a
        country from our data, keyed by their TTA username, with the CGE
        account and ratings player attached as they become known, how to
        reach them, their country and zone, and any community ban. A
        player's country lives here alone: every page's flag is the member's.
      responses:
        "200":
          description: The members, by name without case
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: postAdminMember
      tags: [admin]
      summary: Add a member (admins and organisers)
      description: |
        Audited. The Origin must be the admin site. A username a CGE account
        or the ratings know takes their spelling and their ids. A person
        already a member, by username in any case or by that account, is
        refused and named.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMember"
      responses:
        "201":
          description: Added
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAdded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
