        visible:
          type: boolean
        rated:
          type: boolean
        community:
          type: boolean
        blitz:
          type: boolean
        games:
          type: integer
        first_game:
          type: string
          format: date
          nullable: true
        last_game:
          type: string
          format: date
          nullable: true
    SeasonChange:
