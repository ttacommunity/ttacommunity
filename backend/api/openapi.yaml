      responses:
        "200":
          description: Up to five, best first
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/blitz/{tournament}/{edition}/rounds:
    post:
      operationId: postAdminBlitzRound
      tags: [admin]
      summary: Pair the edition's next round as a draft
      description: |
        Audited. The Origin must be the admin site. Everyone active is
        paired by the edition's pairing methods (BlitzPairingMethods):
        round 1's for the first Swiss round, the later rounds' after it,
        never with an opponent they have met. The round records the method.
        After the last Swiss round it pairs the knockout instead: first the
        top of the standings, 1 v 8, 2 v 7… for eight, then each round's
        winners, neighbouring matches meeting, until the final. Refused
        while a draft exists, a match so far has no result or a knockout
        match no winner, the knockout lacks players, or the edition is
        finished.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      responses:
        "201":
          description: The draft round
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBlitzRound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}:
    delete:
      operationId: deleteAdminBlitzRound
      tags: [admin]
      summary: Delete the latest round while nothing in it is played
      description: |
        Audited. The Origin must be the admin site. Only the latest round,
        draft or published, and only while none of its matches has a result.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/pairing:
    post:
      operationId: postAdminBlitzRoundPairing
      tags: [admin]
      summary: Propose a pairing of a round's unpaired players, without saving it
      description: |
        Everyone active and in no kept match is paired as for a new round, by
        the method the round records. The matches named in keep stay as they are, and
        so does a match of the round that already has a result; without
        keep, everyone else is paired again. A kept bye goes back into the
        pairing when an odd number is left over, and one player left over
        gets the bye. Nothing is written: the proposal's new matches have no
        id. Save it with PUT matches. A knockout round follows the bracket
        and is refused.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzPairing"
      responses:
        "200":
          description: The round as it would be
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBlitzRound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/matches:
    put:
      operationId: putAdminBlitzRoundMatches
      tags: [admin]
      summary: Replace a round's matches, as paired by hand
      description: |
        Audited. The Origin must be the admin site. A match names two active
        entrants, or one for the bye; nobody twice; never a pair that has met.
        A round may be left incomplete until it is published. A knockout round
        follows the bracket and is refused.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzRoundMatches"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/publish:
    post:
      operationId: postAdminBlitzRoundPublish
      tags: [admin]
      summary: Publish a round, once everyone active is in it exactly once
      description: Audited. The Origin must be the admin site. Publishing again changes nothing.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
      responses:
        "204":
          description: Published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/matches/{match}/game:
    put:
      operationId: putAdminBlitzMatchGame
      tags: [admin]
      summary: Record the game a match was played as, or correct it
      description: |
        Audited. The Origin must be the admin site. The game is written under
        the edition's "Round N" stage with a seat for each player, so the
        tournament's page shows it at once; recording the match again changes
        that one game, turn order included: each player's turn is required,
        also to add it to a game recorded without one. The higher culture
        wins and equal cultures draw; a
        resigned or timed-out player loses with culture 0; a drawn knockout
        game stays a draw as a game and sends the higher seed through. The
        share code may be empty, for a game without one; one already on
        another game is refused, naming it. The match's ruling, if any, is
        cleared. A player's report it replaces is resolved: players can no
        longer change it.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
        - $ref: "#/components/parameters/BlitzMatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzGameRecord"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/matches/{match}/result:
    delete:
      operationId: deleteAdminBlitzMatchResult
      tags: [admin]
      summary: Reset a match's result, as if never played
      description: |
        Audited. The Origin must be the admin site. Only in the latest
        round: the result, ruling and game go (with the game's seats, and
        the "Round N" stage once it holds no game), with a player's report,
        so the players may report it again. Resetting it again changes
        nothing. A ratings run that included the game loses its
        rows for it; make a run again to bring its pages up to date.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
        - $ref: "#/components/parameters/BlitzMatchId"
      responses:
        "204":
          description: Reset
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/results:
    delete:
      operationId: deleteAdminBlitzRoundResults
      tags: [admin]
      summary: Reset every result of the latest round, its pairing kept
      description: |
        Audited. The Origin must be the admin site. Every result, ruling and
        game of the latest round goes, as a match's reset does; the round and
        its matches stay, so it can then be deleted and the round before
        reset in turn.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
      responses:
        "204":
          description: Reset
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/reset:
    post:
      operationId: postAdminBlitzReset
      tags: [admin]
      summary: Start an edition again from its entrants
      description: |
        Audited. The Origin must be the admin site. Every round, result and
        game goes, every dropped entrant is in again and every skip goes.
        The entrants and their details, the format, points and pairing
        stay. Ratings runs lose their rows for the games, as a
        match's reset does.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      responses:
        "204":
          description: Reset
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/matches/{match}/replacement:
    put:
      operationId: putAdminBlitzMatchReplacement
      tags: [admin]
      summary: Replace a knockout player who dropped
      description: |
        Audited. The Origin must be the admin site. In a knockout match
        without a result, an active entrant not in the round (the round's
        reserve, or a wildcard) takes the place of a player who dropped,
        keeping their slot and seed. A Swiss round is paired again instead.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
        - $ref: "#/components/parameters/BlitzMatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzReplacement"
      responses:
        "204":
          description: Replaced
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/matches/{match}/ruling:
    put:
      operationId: putAdminBlitzMatchRuling
      tags: [admin]
      summary: Decide a match by the organisers' ruling
      description: |
        Audited. The Origin must be the admin site. A ruling awards the match
        to one player, calls it a draw or a double loss, with its reason; a
        knockout match's ruling names who goes through. A game the match already has stays, overruled;
        recording the game again puts its result back. With no game, the ruling
        is a forfeit: an unplayed round in the standings. A player's report
        it overrules is resolved: players can no longer change it.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
        - $ref: "#/components/parameters/BlitzMatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzRuling"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/matches/{match}/keep:
    post:
      operationId: postAdminBlitzMatchKeep
      tags: [admin]
      summary: Resolve a flagged report by keeping its result
      description: |
        Audited. The Origin must be the admin site. The result stays as the
        player reported it, and players still cannot change it; resetting
        the match opens it to them again.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
        - $ref: "#/components/parameters/BlitzMatchId"
      responses:
        "204":
          description: Kept
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/entrants/{entrant}:
    patch:
      operationId: patchAdminBlitzEntrant
      tags: [admin]
      summary: Change an entrant's Discord name, time zone or status (active or dropped)
      description: |
        Audited. The Origin must be the admin site. Only an entrant who has
        played (a match with a result, or a bye in a published round) is
        dropped; one who has not is removed instead. One skipping the next
        round is reinstated first.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzEntrantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzEntrantChange"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAdminBlitzEntrant
      tags: [admin]
      summary: Remove an entrant who has not played
      description: |
        Audited. The Origin must be the admin site. An entrant who has not
        played comes out of the Swiss matches they are paired in, draft or
        published, leaving their opponent unpaired. One who has played is
        refused (drop them instead), and so is one in a knockout match (the
        bracket needs them: delete that round instead).
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzEntrantId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/entrants/{entrant}/skip:
    post:
      operationId: postAdminBlitzSkip
      tags: [admin]
      summary: Have an entrant sit out the next Swiss round
      description: |
        Audited. The Origin must be the admin site. The next round is the
        draft, or else the one after the latest; it must be a Swiss round.
        The entrant is left out of its pairing and scores the edition's skip
        points for it, then is paired again in the rounds after. When it is
        a draft, they come out of their match in it, leaving their opponent
        unpaired; a match with a result there is refused. A dropped entrant
        is refused (they play no round). Skipping again changes nothing.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzEntrantId"
      responses:
        "201":
          description: Skipping
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlitzSkip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAdminBlitzSkip
      tags: [admin]
      summary: Undo an entrant's skip of a round not yet published
      description: |
        Audited. The Origin must be the admin site. The entrant plays the
        round after all: Pair takes them in, or they are paired by hand when
        it is a draft. The skip of a published round stays.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzEntrantId"
      responses:
        "204":
          description: Undone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/points:
    put:
      operationId: putAdminBlitzPoints
      tags: [admin]
      summary: Set what each outcome is worth in a blitz edition
      description: |
        Audited. The Origin must be the admin site. The standings, the
        next pairing's score groups and the bye follow at once; rounds
        already paired stay. Refused once the knockout has a round.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzPoints"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAdminBlitzPoints
      tags: [admin]
      summary: Reset a blitz edition's points to FIDE's
      description: Audited. The Origin must be the admin site. Refused once the knockout has a round.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      responses:
        "204":
          description: Reset
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/pairing:
    put:
      operationId: putAdminBlitzPairing
      tags: [admin]
      summary: Set how a blitz edition's Swiss rounds are paired
      description: |
        Audited. The Origin must be the admin site. Allowed at any time: the
        next round paired follows it, and rounds already paired keep the
        method they record. Once round 1 has fixed the starting ranks, an
        order may only be what fixed them or random (409).
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzPairingMethods"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/deadline:
    put:
      operationId: putAdminBlitzRoundDeadline
      tags: [admin]
      summary: Set the deadline to play a round by, draft or published
      description: |
        Audited. The Origin must be the admin site. Setting it again
        replaces it, until every game of the round has a result: then it
        is refused.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzDeadlineSet"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/blitz/{tournament}/{edition}/rounds/{round}/discord:
    get:
      operationId: getAdminBlitzRoundDiscord
      tags: [admin]
      summary: A round's games as text to paste into Discord
      description: |
        Audited, as it holds Discord names. A line per game with two
        players, in the order the site numbers them, as "@ann vs @bob",
        every line but the last ending in a comma; pasted into Discord, it
        notifies everyone playing. A player whose Discord name cannot be a
        username is named by TTA username. Any round once paired, draft or
        published; refused while the round has no game.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzRoundId"
      responses:
        "200":
          description: The text
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlitzDiscordText"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/accounts:
    get:
      operationId: getAdminAccounts
      tags: [admin]
      summary: Players' accounts, those waiting for a link first (admins and organisers)
      description: |
        Each account with every way it signs in, the member it is linked to
        and how, and a request waiting for an answer with the member its name
        names now and that member's recorded Discord name and email, to
        compare.
      responses:
        "200":
          description: The accounts
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/accounts/{account}:
    delete:
      operationId: deleteAdminAccount
      tags: [admin]
      summary: Remove an account with its ways in, sessions and requests (admins only)
      description: Audited. The Origin must be the admin site. The player is signed out everywhere.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/accounts/{account}/member:
    delete:
      operationId: deleteAdminAccountMember
      tags: [admin]
      summary: Unlink an account from its member (admins and organisers)
      description: |
        Audited. The Origin must be the admin site. The player stays signed
        in, unlinked, and is not linked by a recorded Discord name or email
        again.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Unlinked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/link-requests/{link_request}/approval:
    put:
      operationId: putAdminLinkApproval
      tags: [admin]
      summary: Approve a request to be linked (admins and organisers)
      description: |
        Audited. The Origin must be the admin site. The account is linked to
        the member the name names, by username in any case or by the CGE
        account or ratings player of that name; a name no member has becomes
        a member. Refused for a member linked to another account. A banned
        member may be linked: the ban keeps them out of events.
      parameters:
        - $ref: "#/components/parameters/LinkRequestId"
      responses:
        "200":
          description: Linked
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkApproved"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/link-requests/{link_request}/refusal:
    put:
      operationId: putAdminLinkRefusal
      tags: [admin]
      summary: Refuse a request to be linked, with a reason the player sees (admins and organisers)
      description: Audited. The Origin must be the admin site. The player may ask again.
      parameters:
        - $ref: "#/components/parameters/LinkRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRefusal"
      responses:
        "204":
          description: Refused
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    BlitzEditionLabel:
      name: edition
      in: path
      required: true
      description: The edition's label, as admin lists it (a season)
      schema:
        type: string
        minLength: 1
        maxLength: 64
    BlitzEntrantId:
      name: entrant
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BlitzRoundId:
      name: round
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BlitzMatchId:
      name: match
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AccountId:
      name: account
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LinkRequestId:
      name: link_request
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MemberId:
      name: member
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminBadgeId:
      name: badge
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminPlayer:
      name: player
      in: path
      required: true
      description: The player's name, as the leaderboard gives it
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AdminRunId:
      name: run
      in: path
      required: true
      description: Any run's id, published or not
      schema:
        type: integer
        format: int64
        minimum: 1
    DiscordID:
      name: discord_id
      in: path
      required: true
      description: A Discord user id
      schema:
        type: string
        pattern: "^[0-9]{5,25}$"
    AdminTournamentSlug:
      name: tournament
      in: path
      required: true
      description: The tournament's slug
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
        maxLength: 64
    AdminSeasonLabel:
      name: season
      in: path
      required: true
      description: The season's label, as admin lists it
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Model:
      name: model
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Model"
    Format:
      name: format
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Format"
    PlayerName:
      name: name
      in: path
      required: true
      description: The player's name, as the leaderboard gives it
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RunId:
      name: run
      in: path
      required: true
      description: A published run's id, from `/v1/runs/current`
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    CacheControl:
      required: true
      schema:
        type: string
    Location:
      required: true
      schema:
        type: string
  responses:
    SignedOut:
      description: Not signed in, or the session has ended
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFromSite:
      description: A change that did not come from the site
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotYourMatch:
      description: |
        A change that did not come from the site, or a player who may not
        change this match: not linked to a member, banned, or not one of its
        players
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The change cannot be made in the current state, such as a run already going
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyLinks:
      description: Too many sign-in links sent, to this address or in all, in the last day; try again later
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotSetUp:
      description: This API is not set up to do that here
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No Access token, or one that does not verify
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The token is valid, but its Discord id is not an admin or organiser
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: A parameter is not one the API knows
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No published run has this id. It may be published later, so this is not cached
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoPublishedRun:
      description: No run has been published yet
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AdminRun:
      type: object
      required: [id, status, started_at, current, games, players, engine_version, progress, protected, deleting, bytes, disk_bytes]
      properties:
        bytes:
          description: >-
            The bytes of the rows the run wrote to the run tables, as a dump of
            it would weigh, recorded as it ended and unmoved by later deletes.
            0 while it is going
          type: integer
          format: int64
        disk_bytes:
          description: >-
            What the run takes on disk, as deleting it frees: its rows with its
            share of the run tables' indexes, recorded as it ended. 0 while it
            is going
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [running, complete, failed]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        published_at:
          description: When it was first published
          type: string
          format: date-time
        current:
          description: The run the site shows
          type: boolean
        games:
          type: integer
        players:
          type: integer
        engine_version:
          type: string
        progress:
          description: The engine's latest progress line, empty before its first
          type: string
        progress_at:
          type: string
          format: date-time
        protected:
          description: Kept from deletion
          type: boolean
        deleting:
          description: Being deleted in the background
          type: boolean
    RunProtection:
      type: object
      required: [protected]
      properties:
        protected:
          type: boolean
    StartedRun:
      type: object
      required: [job]
      properties:
        job:
          description: The engine Job's name
          type: string
    RunChanges:
      type: object
      required: [run, against, ratings, ratings_before, new, gone, moved_1, moved_10, moved_50, moved_100, biggest]
      properties:
        run:
          type: integer
          format: int64
        against:
          type: integer
          format: int64
        ratings:
          type: integer
        ratings_before:
          type: integer
        new:
          description: Ratings in this run but not the other
          type: integer
        gone:
          description: Ratings in the other run but not this one
          type: integer
        moved_1:
          type: integer
        moved_10:
          type: integer
        moved_50:
          type: integer
        moved_100:
          type: integer
        biggest:
          description: The 20 biggest moves in the overall format, of players who moved at all
          type: array
          items:
            $ref: "#/components/schemas/RunMove"
    RunMove:
      type: object
      required: [name, before, after, change]
      properties:
        name:
          type: string
        before:
          type: number
          format: double
        after:
          type: number
          format: double
        change:
          type: number
          format: double
    Story:
      description: One of a tournament's stories, as DANeo's series pages tell them
      type: object
      additionalProperties: false
      required: [player, badge, title, text]
      properties:
        player:
          type: string
          maxLength: 200
        badge:
          description: A short line beside the player, such as "Reigning World Champion"; may be empty
          type: string
          maxLength: 60
        title:
          type: string
          maxLength: 120
        text:
          type: string
          maxLength: 1000
    TournamentCard:
      description: How a tournament presents itself on its card and its page's header; an empty field is unset
      type: object
      additionalProperties: false
      required: [icon, tagline, summary, subtitle, cadence]
      properties:
        subtitle:
          description: The line under the name on the tournament's page, such as "4-Player Competitive Format"
          type: string
          maxLength: 60
        cadence:
          description: How often it is played, such as "Annual (Every Year)"
          type: string
          maxLength: 60
        icon:
          description: An emoji or a few characters
          type: string
          maxLength: 8
        tagline:
          description: The short description, such as "Annual World Championship"
          type: string
          maxLength: 60
        summary:
          description: The information box; plain text
          type: string
          maxLength: 1000
    DataSummary:
      type: object
      required: [games, never_played, unplaced, players, latest_game, last_load, last_load_refused, database_bytes, runs_disk_bytes]
      properties:
        database_bytes:
          description: The ratings database's size on disk
          type: integer
          format: int64
        runs_disk_bytes:
          description: >-
            What the runs take on disk added up, as each recorded as it ended.
            The database is larger by its input data and the room deleted runs
            left
          type: integer
          format: int64
        games:
          description: Played games
          type: integer
        never_played:
          description: Games recorded but never played, kept and not rated
          type: integer
        unplaced:
          description: Games in no tournament; a rating run refuses to start while any are
          type: integer
        players:
          type: integer
        latest_game:
          description: The latest played game's date
          type: string
          format: date
          nullable: true
        last_load:
          description: When data was last loaded
          type: string
          format: date-time
          nullable: true
        last_load_refused:
          description: Rows the last load refused
          type: integer
    StandingsCheck:
      type: object
      required: [stages, stages_only_on_cge]
      properties:
        stages:
          description: Every CGE stage both hold, in CGE's order
          type: array
          items:
            $ref: "#/components/schemas/StageCheck"
        stages_only_on_cge:
          description: Stages CGE has a table for and we hold no game of
          type: integer
    StageCheck:
      type: object
      required: [cge_tournament, cge_season, name, players, agree, differences]
      properties:
        cge_tournament:
          type: integer
        cge_season:
          type: integer
        name:
          description: CGE's name for the tournament; empty when it is not in the catalogue
          type: string
        players:
          description: Players either side lists with a game
          type: integer
        agree:
          type: integer
        differences:
          type: array
          items:
            $ref: "#/components/schemas/StandingDifference"
    StandingDifference:
      type: object
      required: [cge_user, player, kind, cge_games, held_games, held_never_played, cge_points, cge_places, held_places]
      properties:
        cge_user:
          type: integer
        player:
          description: The name CGE shows
          type: string
        kind:
          description: >-
            games: a different number of games; places: the same games in
            other places; places_after_a_timeout: as places, where one of
            their games had a timeout, which CGE's AI played on; not_held: CGE
            lists games of theirs and we hold none; not_on_cge: the other way
          type: string
          enum: [games, places, places_after_a_timeout, not_held, not_on_cge]
        cge_games:
          type: integer
        held_games:
          description: Every game held, including those no one played
          type: integer
        held_never_played:
          description: Of held_games, those no one played; some CGE tables count them, some do not
          type: integer
        cge_points:
          type: number
          format: double
        cge_places:
          $ref: "#/components/schemas/Places"
        held_places:
          $ref: "#/components/schemas/Places"
    Places:
      description: Firsts, seconds and so on in games of 2, 3 and 4 players; null for a size not played
      type: object
      required: [p2, p3, p4]
      properties:
        p2:
          type: array
          nullable: true
          items:
            type: integer
        p3:
          type: array
          nullable: true
          items:
            type: integer
        p4:
          type: array
          nullable: true
          items:
            type: integer
    ExtraBadge:
      type: object
      required: [label, description]
      properties:
        label:
          type: string
        description:
          description: Shown on hover; may be empty
          type: string
    AdminBadge:
      type: object
      required: [id, label, description, players]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        description:
          type: string
        players:
          description: Who holds it, by name
          type: array
          items:
            type: string
    BadgeSetting:
      type: object
      additionalProperties: false
      required: [label, description]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 16
        description:
          type: string
          maxLength: 300
        players:
          description: When given, exactly the players who hold it
          type: array
          maxItems: 2000
          items:
            type: string
            minLength: 1
            maxLength: 64
    TitleOverride:
      type: object
      required: [name, title, reason]
      properties:
        name:
          type: string
        title:
          $ref: "#/components/schemas/AdminTitle"
        reason:
          type: string
    TitleSetting:
      type: object
      additionalProperties: false
      required: [title, reason]
      properties:
        title:
          $ref: "#/components/schemas/AdminTitle"
        reason:
          description: Why; shown when hovering the badge
          type: string
          minLength: 1
          maxLength: 300
    AdminTitle:
      description: A title the engine gives, but WC; "" for none
      type: string
      enum: [SGM, WCS, WCB, GM, M, P, G, S, B, W, ""]
    PodiumEntry:
      type: object
      additionalProperties: false
      required: [place, name]
      properties:
        place:
          type: integer
          minimum: 1
          maximum: 3
        name:
          type: string
          minLength: 1
          maxLength: 64
    NewSeason:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          description: As the site shows it, e.g. "1" or "2023 Play Off"
          type: string
          minLength: 1
          maxLength: 64
    AdminPerson:
      type: object
      required: [discord_id, name, role]
      properties:
        discord_id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    AdminAuditPage:
      type: object
      required: [page, pages, total, actions, entries]
      properties:
        page:
          type: integer
        pages:
          type: integer
        total:
          description: The entries the filters allow
          type: integer
        actions:
          description: Every action in the log, to filter by
          type: array
          items:
            type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditEntry"
    AdminAuditEntry:
      type: object
      required: [id, at, admin, by_player, action, target, detail]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        admin:
          description: The name of the admin who made the change; empty for a player, or someone no longer in admin
          type: string
        by_player:
          description: A player made the change, through their own account
          type: boolean
        action:
          type: string
        target:
          description: What was changed, by its id or name
          type: string
        detail:
          description: The change's detail, as JSON text
          type: string
    AdminRole:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        role:
          $ref: "#/components/schemas/Role"
    AdminTournament:
      type: object
      required: [slug, name, original_name, kind, top_divisions, points_2p, points_3p, points_4p, season_name, stage_name, visible, rated, community, blitz, card, stories, regulations, cge_regulations, format_summary, rated_player_counts, seasons, parent, description, is_group, games, first_game, last_game, divisions, super_gm, record_min_games]
      properties:
        original_name:
          description: The name it came in with, kept when it is renamed
          type: string
        parent:
          description: The slug of the group it is in; empty for none
          type: string
        description:
          description: Admin's description of it; empty for none
          type: string
        is_group:
          description: Whether it is a group made in admin, holding tournaments and groups and no games of its own
          type: boolean
        games:
          description: How many games it holds
          type: integer
        first_game:
          description: The date of its first game; null for none
          type: string
          format: date
          nullable: true
        last_game:
          description: The date of its last game; null for none
          type: string
          format: date
          nullable: true
        season_name:
          description: What it calls a season, as admin set it; empty for the default, Season
          type: string
        stage_name:
          description: What it calls a stage, as admin set it; empty for the default, Stage
          type: string
        points_2p:
          $ref: "#/components/schemas/PlacePoints"
        points_3p:
          $ref: "#/components/schemas/PlacePoints"
        points_4p:
          $ref: "#/components/schemas/PlacePoints"
        kind:
          $ref: "#/components/schemas/TournamentKind"
        podium_source:
          description: "How its podium is chosen: top_divisions, final_stage, recorded, or none"
          allOf:
            - $ref: "#/components/schemas/PodiumSource"
          nullable: true
        top_divisions:
          description: A league's divisions whose final standings make its podium; empty for none
          type: array
          items:
            type: string
        divisions:
          description: A league's divisions, highest first, each with its title tier; empty for none
          type: array
          items:
            $ref: "#/components/schemas/LeagueDivision"
        super_gm:
          description: Whether a win in its top divisions makes a Super GM
          type: boolean
        record_min_games:
          description: The fewest games a player's season needs to count for its season records
          type: integer
        rated_player_counts:
          description: The player counts whose games count towards ratings
          type: array
          items:
            type: integer
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
        card:
          $ref: "#/components/schemas/TournamentCard"
        regulations:
          description: The format and regulations written in admin, empty for none
          type: string
        format_summary:
          description: Its format in brief, which its group's Hall of Fame page lists as its format and regulations; empty for none
          type: string
        cge_regulations:
          description: The latest edition's description on CGE, shown when admin has written none; empty for none
          type: string
        slug:
          type: string
        name:
          type: string
        visible:
          description: Shown on the site though not rated
          type: boolean
        rated:
          description: In the community ratings
          type: boolean
        community:
          description: Counted in the overall community leaderboard
          type: boolean
        blitz:
          description: Run from admin as a blitz tournament
          type: boolean
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/AdminSeason"
    AdminSeason:
      type: object
      required: [label, original_name, note, has_games, rated, in_champions, in_community, run_here, timeout_penalty, stages, podium, podium_note, suggested_podium, suggested_from, games, finished, players]
      properties:
        games:
          description: Its games, across its stages (a season without stages keeps them in one, unnamed, that stages leaves out)
          type: integer
        finished:
          description: Its games that were played, counted as games is
          type: integer
        players:
          description: The players in them
          type: integer
        in_champions:
          description: Its winner is listed among the tournament's champions
          type: boolean
        in_community:
          description: It counts in the community leaderboard (when its tournament does)
          type: boolean
        run_here:
          description: It is run on this site, CGE only advertising it; its CGE tournament gives its page, never its stages, games or settings
          type: boolean
        timeout_penalty:
          description: The points a player loses in its standings for each game they time out of, 0 or below
          type: number
          format: double
        original_name:
          description: The label it came in with, kept when it is renamed
          type: string
        rated:
          description: Its games count towards ratings, from the next run
          type: boolean
        podium:
          description: The podium set in admin, empty when the recorded or derived one shows
          type: array
          items:
            $ref: "#/components/schemas/PodiumEntry"
        podium_note:
          type: string
        suggested_podium:
          description: The podium to start from when admin has set none
          type: array
          items:
            $ref: "#/components/schemas/PodiumEntry"
        suggested_from:
          description: Where the suggestion comes from; recorded (the organisers' placements), final_stage (its one-group final's games, by game points then culture), or empty for none
          type: string
          enum: [recorded, final_stage, ""]
          x-enum-varnames: [SuggestedRecorded, SuggestedFinalStage, SuggestedNone]
        label:
          type: string
        has_games:
          description: False for a season admin added, which can be removed
          type: boolean
        note:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/AdminStage"
    AdminStage:
      type: object
      required: [label, original_name, note, number, games, finished, players]
      properties:
        number:
          description: Its number (CGE's, else the last number in its label), 0 for none
          type: integer
        games:
          type: integer
        finished:
          description: How many of its games were played
          type: integer
        players:
          type: integer
        original_name:
          description: The label it came in with, kept when it is renamed
          type: string
        label:
          type: string
        note:
          type: string
    TournamentKind:
      description: A league ranks divisions over a season, a cup plays stages to a final, a ladder has no podium; only a group is also a series (editions of one event) or a group (of groups)
      type: string
      enum: [league, cup, ladder, series, group]
      x-enum-varnames: [KindLeague, KindCup, KindLadder, KindSeries, KindGroup]
    AdminTournamentRow:
      type: object
      required: [slug, name, kind, parent, is_group, description, cge_about, visible, rated, community, blitz, games, first_game, last_game]
      properties:
        slug:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/TournamentKind"
        parent:
          description: The slug of the group it is in; empty for none
          type: string
        is_group:
          type: boolean
        description:
          description: Admin's description of it; empty for none
          type: string
        cge_about:
          description: The first 200 characters of CGE's latest description of it, on one line
          type: string
        visible:
          type: boolean
        rated:
          type: boolean
        community:
          type: boolean
        blitz:
          type: boolean
        games:
          type: integer
        first_game:
          type: string
          format: date
          nullable: true
        last_game:
          type: string
          format: date
          nullable: true
    SeasonChange:
      type: object
      additionalProperties: false
      properties:
        rated:
          description: Its games count towards ratings, from the next run
          type: boolean
        in_champions:
          description: Its winner is listed among the champions
          type: boolean
        in_community:
          description: It counts in the community leaderboard, from the next run
          type: boolean
        run_here:
          description: It is run on this site, so CGE's loads take its CGE tournament's page and never its stages, games or settings
          type: boolean
        timeout_penalty:
          description: The points a player loses in its standings for each game they time out of, from the next run
          type: number
          format: double
          maximum: 0
        note:
          description: Its own note; empty removes it
          type: string
          maxLength: 2000
        stage_notes:
          description: Notes by stage label; an empty note removes one
          type: object
          additionalProperties:
            type: string
            maxLength: 2000
        podium:
          $ref: "#/components/schemas/PodiumSetting"
        clear_podium:
          description: Removes its podium set by hand
          type: boolean
        move_to_tournament:
          description: Move the season into another tournament (its slug)
          type: string
          maxLength: 100
        new_season:
          description: When moving, optionally rename the season's label in the destination tournament
          type: string
          maxLength: 64
    PodiumSetting:
      type: object
      additionalProperties: false
      required: [podium, note]
      properties:
        podium:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/PodiumEntry"
        note:
          description: Why, or where the placing comes from
          type: string
          maxLength: 500
    NewGroup:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        kind:
          $ref: "#/components/schemas/TournamentKind"
        members:
          description: The slugs of the tournaments it holds
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 100
    CreatedGroup:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
    TournamentSettings:
      type: object
      additionalProperties: false
      properties:
        card:
          $ref: "#/components/schemas/TournamentCard"
        regulations:
          description: Plain text; empty shows CGE's description again
          type: string
          maxLength: 10000
        format_summary:
          description: Its format in brief, in plain text; empty for none
          type: string
          maxLength: 300
        stories:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/Story"
        members:
          description: A group's members, exactly
          type: array
          maxItems: 500
          items:
            type: string
            minLength: 1
            maxLength: 100
        parent:
          description: The slug of the group to put it in; empty takes it out of any
          type: string
          maxLength: 100
        name:
          description: A tournament's or group's new name
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        kind:
          $ref: "#/components/schemas/TournamentKind"
        podium_source:
          description: "How its podium is chosen: top_divisions (final standings), final_stage (games in final stage), recorded (organisers' placements), or none"
          allOf:
            - $ref: "#/components/schemas/PodiumSource"
          nullable: true
        top_divisions:
          description: A league's divisions whose final standings make its podium on the site; empty for none
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 64
        rated_player_counts:
          description: The player counts whose games count towards ratings, from the next run
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 2
            maximum: 4
        visible:
          type: boolean
        rated:
          type: boolean
        community:
          type: boolean
        blitz:
          description: Run from admin as a blitz tournament, a round a week, with its entrants, pairings, results and standings
          type: boolean
        points_2p:
          $ref: "#/components/schemas/PlacePoints"
        points_3p:
          $ref: "#/components/schemas/PlacePoints"
        points_4p:
          $ref: "#/components/schemas/PlacePoints"
        season_name:
          description: What it calls a season on its pages ("Edition", "Round"…); empty for the default, Season
          type: string
          maxLength: 32
        stage_name:
          description: What it calls a stage on its pages; empty for the default, Stage
          type: string
          maxLength: 32
        divisions:
          description: A league's divisions, highest first, each with its title tier; empty for none (admins only)
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/LeagueDivision"
        super_gm:
          description: Whether a win in its top divisions makes a Super GM (admins only)
          type: boolean
        record_min_games:
          description: The fewest games a player's season needs to count for its season records (admins only)
          type: integer
          minimum: 0
          maximum: 100
    LeagueDivision:
      description: One of a league's divisions and the title its players earn, tier 1 (GM) to 7 (W)
      type: object
      additionalProperties: false
      required: [name, tier]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        tier:
          type: integer
          minimum: 1
          maximum: 7
    PlacePoints:
      description: >
        Points for each place in a game of that many players, best place first, from the next run;
        empty for a player count the tournament does not score. Never negative, never higher for a worse place
      type: array
      maxItems: 4
      items:
        type: number
        format: double
        minimum: 0
    AdminMe:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    BlitzFormat:
      description: How a blitz edition runs, Swiss rounds and then a knockout of that many players (0 for none)
      type: object
      additionalProperties: false
      required: [swiss_rounds, knockout_size]
      properties:
        swiss_rounds:
          type: integer
          minimum: 1
          maximum: 30
        knockout_size:
          description: 0, 2, 4, 8, 16 or 32
          type: integer
          minimum: 0
          maximum: 32
    BlitzEditionRow:
      description: One edition of a blitz tournament as the site's list shows it
      type: object
      required: [tournament, name, edition, format, entrants, round, champion]
      properties:
        champion:
          description: The winner of the knockout's final, by username; null until the final has a winner
          type: string
          nullable: true
        round:
          description: The latest published round's number, null before the first is published
          type: integer
          nullable: true
        tournament:
          description: The tournament's slug
          type: string
        name:
          description: The tournament's name
          type: string
        edition:
          description: The edition's label
          type: string
        format:
          $ref: "#/components/schemas/BlitzFormat"
        entrants:
          description: How many entrants are still in
          type: integer
    BlitzEditions:
      type: object
      required: [editions]
      properties:
        editions:
          type: array
          items:
            $ref: "#/components/schemas/BlitzEditionRow"
    BlitzEntrant:
      description: An entrant as the site shows them
      type: object
      required: [name, country, zone, utc_offset, rating, starting_rank]
      properties:
        name:
          description: The member's TTA username
          type: string
        country:
          description: A two-letter country code, null for none
          type: string
          nullable: true
        zone:
          description: The IANA time zone (Europe/Berlin), a region (US East) until it is known, or Unknown
          type: string
        utc_offset:
          description: The zone's offset from UTC now, as +02:00 (a region's is its city's); empty for Unknown
          type: string
        rating:
          description: The 2-player rating in the current run, null when unrated
          type: number
          format: double
          nullable: true
        starting_rank:
          description: The starting rank fixed when round 1 was paired (1 the top), by rating or by lot; null before
          type: integer
          nullable: true
    BlitzEdition:
      description: A blitz edition for the site, with the entrants still in, the published rounds and the standings
      type: object
      required: [tournament, name, edition, format, points, fide_points, pairing, ranks_fixed_by, entrants, rounds, standings, champion, results_updated_at]
      properties:
        pairing:
          $ref: "#/components/schemas/BlitzPairingMethods"
        ranks_fixed_by:
          description: What fixed the starting ranks when round 1 was paired, rating or lot; null before
          allOf:
            - $ref: "#/components/schemas/RanksFixedBy"
          nullable: true
        results_updated_at:
          description: When the latest result in a published round was recorded; null before the first
          type: string
          format: date-time
          nullable: true
        points:
          $ref: "#/components/schemas/BlitzPoints"
        fide_points:
          description: True when the points are FIDE's
          type: boolean
        champion:
          description: The winner of the knockout's final, by username; null until the final has a winner
          type: string
          nullable: true
        tournament:
          type: string
        name:
          type: string
        edition:
          type: string
        format:
          $ref: "#/components/schemas/BlitzFormat"
        entrants:
          type: array
          items:
            $ref: "#/components/schemas/BlitzEntrant"
        rounds:
          description: The published rounds, first first
          type: array
          items:
            $ref: "#/components/schemas/BlitzRound"
        standings:
          description: |
            By rank: points, then the tie-breaks in order (Direct Encounter,
            Buchholz Cut 1, Buchholz, Sonneborn-Berger, the opponents'
            Buchholz, the opponents' Sonneborn-Berger), then the starting
            ranks (the lot, or the seed by rating), and before round 1 fixed
            them sign-up order; dropped players last. Only the published Swiss
            rounds count
          type: array
          items:
            $ref: "#/components/schemas/BlitzStanding"
    BlitzRound:
      description: A published round as the site shows it
      type: object
      required: [number, kind, method, pairing_order, published_at, matches, skipped]
      properties:
        method:
          description: The method a Swiss round was paired with; null for a knockout round
          allOf:
            - $ref: "#/components/schemas/BlitzPairingMethod"
          nullable: true
        pairing_order:
          description: The order a Swiss round was paired by; null for a knockout round
          allOf:
            - $ref: "#/components/schemas/BlitzPairingOrder"
          nullable: true
        skipped:
          description: Who sat the round out, by username, in sign-up order
          type: array
          items:
            type: string
        number:
          type: integer
        kind:
          description: A Swiss round, or a knockout round (its matches in bracket order)
          allOf:
            - $ref: "#/components/schemas/RoundKind"
        published_at:
          type: string
          format: date-time
        matches:
          type: array
          items:
            $ref: "#/components/schemas/BlitzPublicMatch"
    BlitzPublicMatch:
      description: Who plays whom and how it ended; b is null for the bye
      type: object
      required: [a, a_rating, a_seed, b, b_rating, b_seed, result, game, ruled, reported_by, confirmed]
      properties:
        reported_by:
          description: The player who reported the game, by username; null when an organiser entered it or no one has
          type: string
          nullable: true
        confirmed:
          description: Whether the opponent confirmed the reported game
          type: boolean
        a_seed:
          description: In a knockout match, a's seed, their place in the Swiss standings when the knockout began; null in a Swiss round
          type: integer
          nullable: true
        b_seed:
          description: In a knockout match, b's seed, their place in the Swiss standings when the knockout began; null in a Swiss round
          type: integer
          nullable: true
        a:
          type: string
        a_rating:
          type: number
          format: double
          nullable: true
        b:
          type: string
          nullable: true
        b_rating:
          type: number
          format: double
          nullable: true
        result:
          description: Null until the match is decided (a bye never is)
          allOf:
            - $ref: "#/components/schemas/BlitzResult"
          nullable: true
        game:
          description: The game played, null for none recorded
          allOf:
            - $ref: "#/components/schemas/BlitzPlayedGame"
          nullable: true
        ruled:
          description: Whether the result is the organisers' ruling rather than the game's outcome
          type: boolean
    BlitzResult:
      description: Who won, a draw, or a double loss
      type: string
      enum: [a, b, draw, double_loss]
    BlitzPlayedGame:
      description: A played game as recorded, each side as the match names them
      type: object
      required: [share_code, a_culture, a_outcome, a_turn, b_culture, b_outcome, b_turn, finished_at]
      properties:
        share_code:
          type: string
        a_culture:
          type: number
          format: double
        a_outcome:
          $ref: "#/components/schemas/SeatOutcome"
        a_turn:
          description: a's place in the turn order, 1 for the player who went first; null when it was not recorded
          type: integer
          nullable: true
        b_culture:
          type: number
          format: double
        b_outcome:
          $ref: "#/components/schemas/SeatOutcome"
        b_turn:
          description: b's place in the turn order, 1 for the player who went first; null when it was not recorded
          type: integer
          nullable: true
        finished_at:
          description: When the game finished, in UTC
          type: string
          format: date-time
    SeatOutcome:
      description: How a player's game ended
      type: string
      enum: [finished, resigned, timed_out]
    BlitzStanding:
      description: One row of the standings
      type: object
      required: [rank, place_from, place_to, name, country, starting_rank, points, games, byes, buchholz_cut1, buchholz, sonneborn_berger, opponents_buchholz, opponents_sonneborn_berger, status]
      properties:
        rank:
          type: integer
        place_from:
          description: |
            The first rank of the place this row shares with the rows only the
            starting ranks (or, before round 1, sign-up order) separate it
            from (equal points, direct encounter and every tie-break);
            place_to is the last. Equal for a place held alone
          type: integer
        place_to:
          type: integer
        name:
          type: string
        country:
          description: A two-letter country code, null for none
          type: string
          nullable: true
        starting_rank:
          description: The starting rank fixed when round 1 was paired (1 the top), by rating or by lot; null before
          type: integer
          nullable: true
        points:
          description: As the edition's points score each result and bye (FIDE's by default)
          type: number
          format: double
        games:
          description: Games played (finished, resigned or timed out); forfeits and byes aside
          type: integer
        byes:
          type: integer
        buchholz_cut1:
          description: Buchholz with the lowest opponent's score left out (FIDE's Buchholz Cut 1)
          type: number
          format: double
        buchholz:
          description: |
            Buchholz, as FIDE's tie-break regulations for Swiss tournaments
            define it: the sum of the opponents' scores. An unplayed round (a
            bye, a forfeit, a round not paired) counts as a game against a
            dummy with the player's own score, and an opponent's rounds after
            dropping out count as draws
          type: number
          format: double
        sonneborn_berger:
          description: |
            Sonneborn-Berger: each opponent's score times the points scored
            against them, so a win counts the opponent's score, a draw half of
            it and a loss nothing. An unplayed round counts its dummy as
            Buchholz does
          type: number
          format: double
        opponents_buchholz:
          description: The sum of the opponents' Buchholz; an unplayed round counts the player's own
          type: number
          format: double
        opponents_sonneborn_berger:
          description: The sum of the opponents' Sonneborn-Berger; an unplayed round counts the player's own
          type: number
          format: double
        status:
          description: Dropped players come last
          allOf:
            - $ref: "#/components/schemas/EntrantStatus"
    BlitzPairingMethod:
      description: |
        How a Swiss round is paired: dutch is FIDE's Dutch system (C.04.3,
        without colours), its starting ranks by the order; dutch-timezone
        the same, with the closest time zones choosing among the opponents
        it ranks equally; timezone the closest time zones within a score
        group, equally close ones by the order; rating the closest ratings
        within a score group; random chance within a score group
      type: string
      enum: [dutch, dutch-timezone, timezone, rating, random]
    BlitzPairingOrder:
      description: |
        What decides where a method leaves a choice: rating is the ratings
        (the Dutch system's starting ranks by rating, the unrated last, then
        by name; the closest rating among equal time zones); lot is a draw
        made once, when round 1 is paired, and kept (the starting ranks; the
        closest in the draw among equal time zones); random is a fresh draw
        each round. Nothing but rating ever reads a rating
      type: string
      enum: [rating, lot, random]
    BlitzPairingMethods:
      description: |
        How an edition's Swiss rounds are paired: round 1's method and order,
        and the later rounds'. The starting ranks are fixed for everyone when
        round 1 is paired, by the first of the two orders that is rating or
        lot (a lot when both are random), and a late entrant is slotted in by
        rating or given the next rank; after that an order may only be what
        fixed them, or random
      type: object
      additionalProperties: false
      required: [first, later, first_order, later_order]
      properties:
        first:
          description: Round 1's method, one of dutch, dutch-timezone, timezone or random
          allOf:
            - $ref: "#/components/schemas/BlitzPairingMethod"
        later:
          description: The later rounds' method, one of dutch, dutch-timezone, timezone, rating or random
          allOf:
            - $ref: "#/components/schemas/BlitzPairingMethod"
        first_order:
          description: Round 1's order
          allOf:
            - $ref: "#/components/schemas/BlitzPairingOrder"
        later_order:
          description: The later rounds' order
          allOf:
            - $ref: "#/components/schemas/BlitzPairingOrder"
    BlitzPairing:
      description: The matches to keep as they are
      type: object
      additionalProperties: false
      properties:
        keep:
          description: Matches that stay as they are; everyone active and in none of them is paired
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/BlitzMatchChange"
    AdminBlitzMatch:
      description: A match by entrant ids; b is null for the bye. The gaps are as the entrants are now
      type: object
      required: [id, a, b, slot, a_seed, b_seed, zone_gap_minutes, rating_gap, repeat, result, game, ruling, decided_at, reported_by, report, flag_reason]
      properties:
        reported_by:
          description: The entrant who reported the game; null when no player did
          type: integer
          format: int64
          nullable: true
        report:
          description: Null when no player reported the game
          allOf:
            - $ref: "#/components/schemas/BlitzReport"
          nullable: true
        flag_reason:
          description: The opponent's reason when they flagged the report, kept once resolved; else empty
          type: string
        slot:
          description: A knockout match's place in the bracket, from 0; the winners of slots 2k and 2k+1 meet in slot k next. Null in a Swiss round
          type: integer
          nullable: true
        a_seed:
          description: In a knockout match, a's seed, their place in the Swiss standings when the knockout began; null in a Swiss round
          type: integer
          nullable: true
        b_seed:
          description: In a knockout match, b's seed, their place in the Swiss standings when the knockout began; null in a Swiss round
          type: integer
          nullable: true
        id:
          type: integer
          format: int64
        a:
          type: integer
          format: int64
        b:
          type: integer
          format: int64
          nullable: true
        zone_gap_minutes:
          type: integer
        rating_gap:
          description: Null when either is unrated, or for the bye
          type: number
          format: double
          nullable: true
        repeat:
          description: Whether the two have met in another round
          type: boolean
        result:
          description: Null until the match is decided
          allOf:
            - $ref: "#/components/schemas/BlitzResult"
          nullable: true
        game:
          description: The game played, null for none recorded
          allOf:
            - $ref: "#/components/schemas/BlitzPlayedGame"
          nullable: true
        ruling:
          description: The organisers' reason when the result is their ruling, else empty
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
    AdminBlitzRound:
      type: object
      required: [id, number, kind, method, pairing_order, published_at, deadline, matches, reserve]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
        kind:
          $ref: "#/components/schemas/RoundKind"
        method:
          description: The method a Swiss round was paired with; null for a knockout round
          allOf:
            - $ref: "#/components/schemas/BlitzPairingMethod"
          nullable: true
        pairing_order:
          description: The order a Swiss round was paired by; null for a knockout round
          allOf:
            - $ref: "#/components/schemas/BlitzPairingOrder"
          nullable: true
        published_at:
          description: Null for a draft
          type: string
          format: date-time
          nullable: true
        deadline:
          description: The deadline to play by, null until set
          allOf:
            - $ref: "#/components/schemas/BlitzDeadline"
          nullable: true
        matches:
          type: array
          items:
            $ref: "#/components/schemas/AdminBlitzMatch"
        reserve:
          description: |
            For a knockout round, the entrant who replaces a player who
            dropped: the best Swiss place among active entrants not in the
            round. Null for a Swiss round, or with nobody left.
          type: integer
          format: int64
          nullable: true
    BlitzReplacement:
      description: Who drops out of a knockout match, and who takes their place, by entrant id
      type: object
      additionalProperties: false
      required: [out, in]
      properties:
        out:
          type: integer
          format: int64
