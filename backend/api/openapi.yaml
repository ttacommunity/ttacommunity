openapi: 3.0.3
info:
  title: ttacommunity API
  version: 0.1.0
  description: |
    Public ratings for Through the Ages. Ratings change only when a new run
    is published, so each run's data sits at its own URL. Ask
    `/v1/runs/current` which run to read, then read that run.
    See docs/architecture.md#rating-runs.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [site]
      summary: The process is up
      responses:
        "200":
          description: Up
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /robots.txt:
    get:
      operationId: getRobotsTxt
      tags: [site]
      summary: Rules for search crawlers, which keep them off the player routes
      responses:
        "200":
          description: The robots.txt file
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    get:
      operationId: getReadyz
      tags: [site]
      summary: The process can reach the ratings database
      responses:
        "200":
          description: Ready
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/runs/current:
    get:
      operationId: getCurrentRun
      tags: [ratings]
      summary: The run the site shows now
      description: Cached for a minute, so a newly published run shows within one.
      responses:
        "200":
          description: The current run
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "503":
          $ref: "#/components/responses/NoPublishedRun"
  /v1/runs/{run}/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [ratings]
      summary: Every rated player in one model and format, in rank order
      description: |
        A published run's ratings never change, but each row also carries the
        player's details as they are now (country), so this is cached for five
        minutes. Players whose CGE accounts are deleted or banned are left out.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The leaderboard
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/leaderboard.csv:
    get:
      operationId: getLeaderboardCsv
      tags: [ratings]
      summary: The leaderboard as a CSV file, filtered and sorted as the site's table
      description: |
        The players the site's leaderboard shows for the same choices, in its
        order, with their titles, career peaks and records. With `year`,
        the season archive's board instead: the ratings at the end of that
        year, with that year's record or the career up to it (`stats_view`),
        "active" meaning played that year, and no minimum opponents by
        default. Rows carry player details as they are now, so this is
        cached for five minutes. Players whose CGE accounts are deleted or
        banned are left out.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
        - name: status
          in: query
          required: false
          description: Active players (played in the 12 months before the run's last game), inactive ones, or all
          schema:
            type: string
            enum: [active, all, inactive]
            default: active
        - name: min_opps
          in: query
          required: false
          description: The fewest opponents a player needs (30 by default, 0 in a year's archive)
          schema:
            type: integer
            minimum: 0
            maximum: 1000
        - name: title
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TitleCode"
        - name: search
          in: query
          required: false
          description: Names or country codes, comma-separated; a name matches anywhere, ignoring case
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [rank, name, c_rating, rating, opps, win_rate, last_played]
            default: rank
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: year
          in: query
          required: false
          description: A year's archive instead of the live board
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: stats_view
          in: query
          required: false
          description: In a year's archive, that year's record or the career up to it
          schema:
            type: string
            enum: [season, career]
            default: season
      responses:
        "200":
          description: The CSV file, UTF-8 with a byte-order mark
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/history:
    get:
      operationId: getHistory
      tags: [ratings]
      summary: Each player's rating at a past date, for rating changes over time
      description: |
        The snapshot of the latest rating period on or before `at` (the first
        period when `at` is earlier), as the original site compares against:
        the players in that snapshot, each with their rating then. Without
        `at`, the run's previous period, the one before its last. The answer's
        date is the snapshot's. Players whose CGE accounts are deleted or
        banned are left out. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
        - name: at
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The ratings at that date
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}:
    get:
      operationId: getPlayer
      tags: [ratings]
      summary: One player's ratings in every model and format, for the player page
      description: |
        The player's ratings in the ten continuous and season-reset models,
        each format, with their title, career peak, country and game counts.
        A name that matches no player exactly is looked up ignoring case,
        if only one player matches. Players whose CGE accounts are deleted
        or banned return 404, as does "Unknown player", the name games give
        a seat CGE has no account for. Country and titles can change
        without a new run, so this is cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "200":
          description: The player
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/history:
    get:
      operationId: getPlayerHistory
      tags: [ratings]
      summary: One player's rating at the end of every period, for the chart
      description: |
        The player's rating and conservative rating after each rating period
        in the ten continuous and season-reset models, for one format. Cached
        for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The player's history
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/matches:
    get:
      operationId: getPlayerMatches
      tags: [ratings]
      summary: One player's games, newest first, 30 to a page
      description: |
        The games the run rated for the player, in one format (0 is all).
        Each carries an estimate of what it is worth to the player's rating
        today: one rating update from the run's final ratings in `model`. A
        page past the last gives the last. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Model"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: One page of games
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerMatches"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/rivals:
    get:
      operationId: getPlayerRivals
      tags: [ratings]
      summary: The player's record against each opponent
      description: |
        Wins, losses and draws against the 200 opponents the player has met
        most, in one format (0 is all). Opponents whose CGE accounts are
        deleted or banned are left out. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The player's rivals
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerRivals"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/career:
    get:
      operationId: getPlayerCareer
      tags: [ratings]
      summary: One player's record each year and their peak in one model, for the career box
      description: |
        The player's record in each calendar year of one format (every
        format together when that format has none), with the year's highest
        and last rating in `model` and the title the run derived for that
        year; and the player's peak rating in `model`, when it was, and
        their rank that month by conservative rating, as the leaderboard
        ranks. Only the player page's models are accepted. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Model"
      responses:
        "200":
          description: The player's career
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerCareer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/achievements:
    get:
      operationId: getPlayerAchievements
      tags: [ratings]
      summary: One player's tournament achievements, for their achievements page
      description: |
        The player's titles and medals across the four major circuits
        (World Championship, International, Intermezzo, Royal League) and
        the accolades their page features, and every tournament record the
        original site lists for them: seasons, campaigns and career totals,
        latest finish first. Records are matched to the name ignoring case,
        as the original site does. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "200":
          description: The player's achievements
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerAchievements"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/versus/{other}:
    get:
      operationId: getPlayerVersus
      tags: [ratings]
      summary: The latest games two players played together
      description: |
        The 100 latest games the run rated with both players at the table,
        in every format, newest first, with where each finished. Cached for
        five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - name: other
          in: path
          required: true
          description: The other player's name
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Their shared games
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerVersus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/matrix:
    get:
      operationId: getPlayerMatrix
      tags: [ratings]
      summary: One player's rating in each engine and reset mode, now or at a year's end
      description: |
        The player's rating, deviation, conservative rating and rank in the
        ten continuous and season-reset models for one format. Without
        `year`, the run's ratings and ranks. With it, each model's last
        rating period that year, ranked by conservative rating in it; a
        model the player has no row in then is left out. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - $ref: "#/components/parameters/Format"
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: The player's ratings by model
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerMatrix"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/players/{name}/seats:
    get:
      operationId: getPlayerSeats
      tags: [ratings]
      summary: One player's performance broken down by starting position and player count
      description: |
        The player's win rate, average culture score, and placement distribution
        per seat (turn order 1 to 4) grouped across 2-player, 3-player, and
        4-player games, plus comparative deltas against their overall performance.
        By default returns rated games only; setting unrated=true includes all
        played tournament and exhibition matches. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/PlayerName"
        - name: unrated
          in: query
          required: false
          description: Whether to include unrated/exhibition matches alongside rated tournament games
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The player's seat statistics
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSeatStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/years:
    get:
      operationId: getYears
      tags: [ratings]
      summary: The years a run's ratings cover, newest first, for the season archive
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The years
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Years"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/years/{year}/leaderboard:
    get:
      operationId: getYearLeaderboard
      tags: [ratings]
      summary: The ratings at the end of a year, for the season archive
      description: |
        The ratings on the model's last rating period of the year (another
        model's when this one has none that year), for the players rated
        on it, best conservative rating first, as upstream's archive shows
        them. Each carries the player's record that year and up to it, and
        their rating on the previous year's last period. Players whose CGE
        accounts are deleted or banned are left out of the board and named
        "Deleted player" among the champions. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: year
          in: path
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: The year's board
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearLeaderboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/calibration:
    get:
      operationId: getCalibration
      tags: [ratings]
      summary: How well each model predicted games
      description: |
        Each model's calibration over the whole run, standard (in sample)
        and walk-forward (out of sample), in every format: Brier score,
        expected calibration error, log loss, accuracy, and the predicted
        against actual win rate in ten probability bins. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: How well each model predicted games
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calibration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/distribution:
    get:
      operationId: getDistribution
      tags: [ratings]
      summary: How ratings spread in each engine
      description: |
        Each continuous engine's ratings counted into 100-point bins from
        1000 to 2100, with their mean for every player and for active ones
        (more than 10 games in the year up to the run's newest game), in one
        format. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: How ratings spread in each engine
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distribution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/agreement:
    get:
      operationId: getAgreement
      tags: [ratings]
      summary: How far the models agree
      description: |
        The four closest and four furthest pairs of the ten continuous and
        season-reset models: Pearson on ratings and Spearman on the run's
        ranks, over the players rated in all of them with 15 or more
        opponents, in one format. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: How far the models agree
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agreement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/players:
    get:
      operationId: getComparedPlayers
      tags: [ratings]
      summary: Players across every model
      description: |
        Up to 15 players matching a search, strongest first by GlickoD's
        conservative rating, or upstream's six default players in its order
        when there is no search, each with their rating in every continuous
        and season-reset model for one format. Players whose CGE accounts are
        deleted or banned are left out. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Format"
        - name: search
          in: query
          required: false
          description: Names or country codes, comma-separated; a name matches anywhere, ignoring case
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: The players and their ratings
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparedPlayers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/activity:
    get:
      operationId: getActivity
      tags: [ratings]
      summary: Who plays, and where
      description: |
        Active and inactive players (the site's fixed cutoff), games per
        format, players per title, and the 15 countries with most rated
        players with their average Glicko-2 Standard rating by title.
        Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run's activity and demographics
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/analysis/seats:
    get:
      operationId: getSeatAnalysis
      tags: [ratings]
      summary: Win rates and placement per seat by player count and skill tier
      description: |
        Empirical win rates and placement distributions per starting seat
        (turn order) across 2-player, 3-player, and 4-player games, filterable
        by Glicko-D skill tier (grandmaster, master, advanced, intermediate,
        beginner, or all). Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: tier
          in: query
          required: false
          description: Skill tier of the table based on average Glicko-D rating when played
          schema:
            allOf:
              - $ref: "#/components/schemas/SeatTier"
            default: all
        - name: format
          in: query
          required: false
          description: Player count format (0 for all formats, or 2, 3, 4)
          schema:
            $ref: "#/components/schemas/Format"
            default: 0
      responses:
        "200":
          description: Seat statistics by player count
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatAnalysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/tournaments:
    get:
      operationId: getHallOfFame
      tags: [tournaments]
      summary: The Hall of Fame overview
      description: |
        Every series' game and edition counts, the all-time table of titles
        and medals across the four major circuits (World Championship,
        International, Intermezzo, Royal League), and the first ten rows of
        the Grand Slams and Ladders boards, as the original site's overview
        shows them. Players whose CGE accounts are deleted or banned are left
        out. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The overview
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HallOfFame"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/tournaments/{series}:
    get:
      operationId: getTournamentSeries
      tags: [tournaments]
      summary: A tournament series' Hall of Fame page
      description: |
        The series' game and season counts, its top division's trophyboard
        (each medallist's podiums, most golds first, then silvers, bronzes
        and career points), and the ten best top-division seasons and games
        as upstream's page ranks them. A player whose CGE account is deleted
        or banned is left off the trophyboard and named "Deleted player" in
        the seasons and games. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: series
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Series"
      responses:
        "200":
          description: The series
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/catalogue:
    get:
      operationId: getCatalogue
      tags: [tournaments]
      summary: Every tournament with games
      description: |
        Each tournament the site shows (rated, or made visible though not
        rated) that has placed games: its seasons, games, players and first
        and last game; and CGE's tournaments the site shows. An organiser whose
        CGE account is deleted or banned is named "Deleted player". Games come
        from the tournament catalogue, which can grow without a new run, so
        this is cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The tournaments, by name
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalogue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/catalogue/{tournament}:
    get:
      operationId: getCatalogueTournament
      tags: [tournaments]
      summary: One tournament's seasons, stages and podiums
      description: |
        The tournament's seasons in order of their first game, each with its
        stages and its recorded podium. A hidden tournament (not rated, not
        made visible) is not found. A player whose CGE account is deleted or
        banned is named "Deleted player" on podiums and in games, and left out
        of the top-tier wins, the stories and the player list. Cached for five
        minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: tournament
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,63}$"
      responses:
        "200":
          description: The tournament
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueTournament"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/catalogue/{tournament}/games:
    get:
      operationId: getCatalogueGames
      tags: [tournaments]
      summary: One page of a tournament's games
      description: |
        The tournament's games, newest first, 50 to a page, never-played ones
        included and marked. Narrowed by season, stage and group (as the
        catalogue labels them; an empty value does not narrow), and to games
        with a replay code. A page past the last gives the last. A hidden
        tournament is not found. Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: tournament
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,63}$"
        - name: season
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: stage
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: group
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: player
          in: query
          required: false
          description: Only games this player sat in, by name in any case
          schema:
            type: string
            maxLength: 64
        - name: coded
          in: query
          required: false
          description: Only games with a replay code
          schema:
            type: boolean
            default: false
        - name: state
          in: query
          required: false
          description: Only games in this state
          schema:
            $ref: "#/components/schemas/GameState"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: One page of games
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueGames"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run}/podiums:
    get:
      operationId: getRecentPodiums
      tags: [tournaments]
      summary: The latest podiums, for the home page
      description: |
        Of the twelve tournaments the site shows that were played most
        recently, each one's latest season with a podium, the eight finished
        last first. Each podium is as the tournament's catalogue page gives
        it, a player whose CGE account is deleted or banned named "Deleted
        player". Cached for five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The podiums, finished last first
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentPodiums"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/community/editions:
    get:
      operationId: getCommunityEditions
      tags: [tournaments]
      summary: Visible editions of the community leaderboard
      description: |
        Every edition of the community leaderboard the site shows, in sort order.
        Cached for five minutes.
      responses:
        "200":
          description: The visible editions
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityEditionItem"
  /v1/runs/{run}/community/{edition}:
    get:
      operationId: getCommunityLeaderboard
      tags: [tournaments]
      summary: An edition of the community leaderboard
      description: |
        The community leaderboard's standings as its maintainer publishes
        them (rank, total points, events played, and each event's points),
        its dynamic categories, summary groups and champion,
        with each player's country and the run's title where the name is a
        player here, matched ignoring case. Best rank first. The columns are
        the events its rows have points in, each with the most its points
        table gives. An edition admin has not shown is not found. Cached for
        five minutes.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: edition
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CommunityEdition"
      responses:
        "200":
          description: The edition
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityLeaderboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/blitz:
    get:
      operationId: getBlitzEditions
      tags: [blitz]
      summary: Every edition of the blitz tournaments shown on the site
      description: |
        Blitz tournaments are run from admin, a round a week, so this answer
        changes as organisers work: it is cached for a minute.
      responses:
        "200":
          description: The editions, by tournament name, newest edition first
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlitzEditions"
  /v1/blitz/{tournament}/{edition}:
    get:
      operationId: getBlitzEdition
      tags: [blitz]
      summary: A blitz edition's format and the entrants still in
      description: |
        Never cached: its results change as players report them and
        organisers record them, and each change shows on the next request.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      responses:
        "200":
          description: The edition
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlitzEdition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/countries:
    get:
      operationId: getCountries
      tags: [players]
      summary: The countries a player may give as theirs
      description: ISO 3166-1's two-letter codes and XK for Kosovo, in order. Cached for a day.
      responses:
        "200":
          description: The codes
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /v1/site/visits:
    get:
      operationId: getSiteVisits
      tags: [site]
      summary: How many visits the site had in the last 28 days
      description: |
        Visits as Cloudflare Web Analytics counts them, bots left out: no
        cookies, so a person who comes back is counted again, and a browser
        that blocks the beacon is not counted. The API counts them again every
        hour, so this is cached for an hour.
      responses:
        "200":
          description: The count
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteVisits"
        "404":
          description: This API does not count visits
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The visits have not been counted in the last day
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/discord:
    get:
      operationId: startDiscordSignIn
      tags: [players]
      summary: Start signing in with Discord
      description: |
        Opened as a page, not fetched: sends the browser to Discord, asking
        only for the identify scope, with a state and a PKCE challenge whose
        verifier waits in a short-lived cookie for the callback. A player who
        has authorized the app before is not asked again. With add, a
        signed-in player adds Discord to their account as another way in.
        Never cached.
      parameters:
        - name: add
          in: query
          required: false
          description: Add Discord to the signed-in player's account, rather than sign in
          schema:
            type: boolean
        - name: return
          in: query
          required: false
          description: The site path, with any query, to come back to, such as /ratings/player/?name=ann; anything else comes back to /account/
          schema:
            type: string
            maxLength: 300
      responses:
        "302":
          description: To Discord
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/auth/discord/callback:
    get:
      operationId: finishDiscordSignIn
      tags: [players]
      summary: Where Discord sends the player back
      description: |
        Checks the state against the cookie, exchanges the code with its
        verifier, and reads who signed in. Their login is recorded, linked to
        the one member whose recorded Discord name is their username when
        there is one, and a session starts: an opaque cookie on this host,
        HttpOnly, Secure and SameSite=Lax. Anything wrong, a declined consent
        included, leaves them signed out. Either way the browser goes back to
        the site: a returning player to the path asked for with signin=ok; a
        first sign-in to /account/ with signin=first, and anything that did
        not finish to /account/ with signin=failed, with that path as back.
        A banned member signs in like anyone, and /v1/me says they are
        banned. Adding Discord comes back to /account/ with signin=added, or
        signin=taken when that Discord account has an account of its own
        here, signin=has-kind when the account has another Discord already,
        or signin=failed (signed out meanwhile included), each with
        way=discord.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: error
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "302":
          description: Back to the site, signed in or not
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/auth/microsoft:
    get:
      operationId: startMicrosoftSignIn
      tags: [players]
      summary: Start signing in with Microsoft
      description: |
        Opened as a page, not fetched: sends the browser to Microsoft, for
        any personal, work or school account, asking for openid, profile and
        email, with a state, a PKCE challenge and a nonce whose secrets wait
        in a short-lived cookie for the callback. With add, a signed-in
        player adds Microsoft to their account as another way in. 503 when
        Microsoft sign-in is not set up here. Never cached.
      parameters:
        - name: add
          in: query
          required: false
          description: Add Microsoft to the signed-in player's account, rather than sign in
          schema:
            type: boolean
        - name: return
          in: query
          required: false
          description: The site path, with any query, to come back to, such as /ratings/player/?name=ann; anything else comes back to /account/
          schema:
            type: string
            maxLength: 300
      responses:
        "302":
          description: To Microsoft
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/auth/microsoft/callback:
    get:
      operationId: finishMicrosoftSignIn
      tags: [players]
      summary: Where Microsoft sends the player back
      description: |
        Checks the state against the cookie, exchanges the code with its
        verifier, and checks the ID token: Microsoft's signature, this app's
        audience, expiry, the nonce, and an issuer naming the token's own
        tenant. Their login is recorded by Microsoft's id for this app, with
        their name, and their email when Microsoft vouches for it (a
        personal account's, or a work or school account's whose domain is
        verified); the email never links them to a member, but fills a
        linked member's empty email. A session starts as with Discord, and
        the browser goes back to the site with the same signin outcomes:
        ok, first, failed, and when adding, added, taken, has-kind (another
        Microsoft account already) or failed, with way=microsoft.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            maxLength: 4000
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: error
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "302":
          description: Back to the site, signed in or not
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/auth/google:
    get:
      operationId: startGoogleSignIn
      tags: [players]
      summary: Start signing in with Google
      description: |
        Opened as a page, not fetched: sends the browser to Google, asking
        for openid, email and profile, with a state, a PKCE challenge and a
        nonce whose secrets wait in a short-lived cookie for the callback.
        With add, a signed-in player adds Google to their account as
        another way in. 503 when Google sign-in is not set up here. Never
        cached.
      parameters:
        - name: add
          in: query
          required: false
          description: Add Google to the signed-in player's account, rather than sign in
          schema:
            type: boolean
        - name: return
          in: query
          required: false
          description: The site path, with any query, to come back to, such as /ratings/player/?name=ann; anything else comes back to /account/
          schema:
            type: string
            maxLength: 300
      responses:
        "302":
          description: To Google
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/auth/google/callback:
    get:
      operationId: finishGoogleSignIn
      tags: [players]
      summary: Where Google sends the player back
      description: |
        Checks the state against the cookie, exchanges the code with its
        verifier, and checks the ID token: Google's signature, this app's
        audience, expiry, the nonce, and Google as its issuer. Their login
        is recorded by their Google id, with their name, and their email
        when Google has verified it; the email never links them to a
        member, but fills a linked member's empty email. A session starts
        as with Discord, and the browser goes back to the site with the
        same signin outcomes: ok, first, failed, and when adding, added,
        taken, has-kind (another Google account already) or failed, with
        way=google.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            maxLength: 4000
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: error
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "302":
          description: Back to the site, signed in or not
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/auth/email:
    post:
      operationId: sendEmailSignIn
      tags: [players]
      summary: Email a sign-in link
      description: |
        Fetched by the site, after a Turnstile check. Emails the address a
        link to the site's /account/email/ page, which may be opened once,
        within the hour; a newer link replaces it. The answer is the same
        whether or not the address has signed in before. At most 5 links a
        day to one address, and 90 a day in all. The Origin must be the site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSignInAsk"
      responses:
        "204":
          description: Sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/NotFromSite"
        "429":
          $ref: "#/components/responses/TooManyLinks"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/auth/email/finish:
    post:
      operationId: finishEmailSignIn
      tags: [players]
      summary: Open an emailed link
      description: |
        Posted by the site's /account/email/ page with the link's token, when
        the player asks: a mail scanner opening the link spends nothing. The
        link signs in by its address, or adds it to (or changes it on) the
        account it was sent for, and a session starts as for Discord. A first sign-in, an
        address linked to the one member whose recorded email it is, and a
        banned member are as for Discord. The Origin must be the site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSignInToken"
      responses:
        "200":
          description: Signed in
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSignedIn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/NotFromSite"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: The link is unknown, has been used or replaced, or is over an hour old
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [players]
      summary: Sign out on this browser
      description: |
        The session is deleted, not just its cookie. Signing out when not
        signed in is no error. The Origin must be the site.
      responses:
        "204":
          description: Signed out
        "403":
          $ref: "#/components/responses/NotFromSite"
  /v1/discord/interactions:
    post:
      operationId: answerDiscordInteraction
      tags: [discord]
      summary: Discord's Interactions Endpoint, for our slash commands
      description: |
        Discord sends each use of our slash commands here (`/rating` and
        `/myrating`), and its own PING. Every request must carry Discord's Ed25519
        signature over `X-Signature-Timestamp` and the body, by the
        application's public key (`DISCORD_APP_PUBLIC_KEY`); any other is
        refused with 401. Without a key set here, it is a 404. Answers the
        asker alone, unless they share a rating with everyone. Never cached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordInteraction"
      responses:
        "200":
          description: The answer, in Discord's interaction response format
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: No signature, or not Discord's
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Discord application is set up here
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/me:
    get:
      operationId: getMe
      tags: [players]
      summary: The signed-in player
      description: |
        Fetched with credentials from the site, whose origin alone may read
        it. Where they signed in and their names there, the member they are
        linked to, their latest request to be linked, and whether they are an
        admin or organiser. Never cached.
      responses:
        "200":
          description: The signed-in player
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/SignedOut"
    delete:
      operationId: deleteMe
      tags: [players]
      summary: Delete the signed-in player's account
      description: |
        Deletes their account, every way they sign in, every session and
        every request to be linked, clears the Discord name, country and time
        zone of the member they are linked to (so a new sign-in is not linked
        by that name), and signs this browser out. The member, their games
        and ratings stay. Audited by ids alone. The Origin must be the site.
      responses:
        "204":
          description: Deleted and signed out
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotFromSite"
  /v1/me/data:
    get:
      operationId: getMyData
      tags: [players]
      summary: Everything we keep about the signed-in player
      description: |
        Fetched with credentials from the site, whose origin alone may read
        it. Their account, every way in with its id there, the member they
        are linked to with every field it holds, their requests to be linked,
        their sessions and their emailed sign-in links. Sessions that have
        ended and links past the time they are kept are removed first, so
        the answer is exactly what is kept. Never cached.
      responses:
        "200":
          description: Everything we keep about them
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyData"
        "401":
          $ref: "#/components/responses/SignedOut"
  /v1/me/link-request:
    put:
      operationId: putMyLinkRequest
      tags: [players]
      summary: Ask to be linked to a TTA username
      description: |
        For a player not linked to a member yet. An admin or organiser
        answers; asking again while waiting replaces the name. Refused at
        once (409, saying what to do) when the member the name names is
        linked to another account. The Origin must be the site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequestAsk"
      responses:
        "204":
          description: Waiting for an answer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotFromSite"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/details:
    patch:
      operationId: patchMyDetails
      tags: [players]
      summary: Change your own country and time zone
      description: |
        A linked player's are their member's. Before that they are kept with
        the sign-in, shown to whoever answers the request to be linked, and
        moved to the member by the link. A field left out stays as it is; an
        empty country clears it. The Origin must be the site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyDetailsChange"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotFromSite"
  /v1/me/logins/email:
    post:
      operationId: postMyEmailLogin
      tags: [players]
      summary: Email a link that adds the address as a way in, or changes the account's address
      description: |
        For a signed-in player, linked or not. Opening the link adds the
        address to their account, with no new approval, or puts it in place
        of the address the account had; its sessions stay signed in. Refused
        for an address that has an account of its own here. The limits are
        the sign-in links'. The Origin must be the site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginAsk"
      responses:
        "204":
          description: Sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotFromSite"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyLinks"
        "503":
          $ref: "#/components/responses/NotSetUp"
  /v1/me/logins/{provider}:
    delete:
      operationId: deleteMyLogin
      tags: [players]
      summary: Remove one of your ways in
      description: |
        Refused for the only one: Delete account removes it with the
        account. Signed in by the way removed, this browser stays signed in
        by one that remains; other sessions it started end. The Origin must
        be the site.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LoginProvider"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotFromSite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/blitz/{tournament}/{edition}:
    get:
      operationId: getMyBlitzMatch
      tags: [players]
      summary: Your match in a blitz edition's latest round, and what you may do with it
      description: |
        For a signed-in player linked to a member entered in a shown edition:
        their match in the latest round once it is published, as it stands
        now, with the opponent's flag if any. Null for anyone else, and
        before the round is published. Never cached.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
      responses:
        "200":
          description: The match, or null
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyBlitz"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignedOut"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/me/blitz/{tournament}/{edition}/matches/{match}/game:
    put:
      operationId: putMyBlitzGame
      tags: [players]
      summary: Report your match's game, or correct your report
      description: |
        Audited. The Origin must be the site. For a player of the match in
        the latest round: it counts at once. The share code and each
        player's turn are required.
        Reporting again corrects it, until the opponent confirms or flags
        it. Refused once an organiser has entered or ruled the match, when
        the opponent reported it, and once the next round is paired.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzMatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzGameRecord"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotYourMatch"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/blitz/{tournament}/{edition}/matches/{match}/confirm:
    post:
      operationId: postMyBlitzConfirm
      tags: [players]
      summary: Confirm your opponent's report
      description: |
        Audited. The Origin must be the site. Players can no longer change
        the result; a mistake found later goes to the organisers.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzMatchId"
      responses:
        "204":
          description: Confirmed
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotYourMatch"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/blitz/{tournament}/{edition}/matches/{match}/flag:
    post:
      operationId: postMyBlitzFlag
      tags: [players]
      summary: Flag your opponent's report as wrong
      description: |
        Audited. The Origin must be the site. Players can no longer change
        the result; admin shows the flag and its reason until an organiser
        resolves it.
      parameters:
        - $ref: "#/components/parameters/AdminTournamentSlug"
        - $ref: "#/components/parameters/BlitzEditionLabel"
        - $ref: "#/components/parameters/BlitzMatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlitzFlag"
      responses:
        "204":
          description: Flagged
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotYourMatch"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Who is signed in to admin, and in which role
      description: |
        Admin routes are reached through the admin site's Worker, behind
        Cloudflare Access. Each request's Access token (Cf-Access-Jwt-Assertion)
        is verified, and the Discord id in it must be an admin or organiser.
        Never cached.
      responses:
        "200":
          description: The signed-in admin
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/tournaments:
    get:
      operationId: getAdminTournaments
      tags: [admin]
      summary: Every tournament and group in brief, by name
      responses:
        "200":
          description: The tournaments and groups, without their seasons
          headers:
