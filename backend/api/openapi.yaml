      description: A stage of a season; label "" is the season's only or main stage
      allOf:
        - $ref: "#/components/schemas/GameSpan"
        - type: object
          required: [label, note]
          properties:
            label:
              type: string
            note:
              description: A note shown beside the stage, or null
              type: string
              nullable: true
