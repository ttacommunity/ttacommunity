# The nightly configuration backup: the namespace's Secrets and the Cloudflare settings that are not in git, each
# as JSON encrypted with age to the maintainers' public key by load, then put in the R2 bucket
# ttacommunity-config-backup by rclone (docs/architecture.md#backups). A run by hand:
#   kubectl -n ttacommunity create job --from=cronjob/backup-config backup-config-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-config
  namespace: ttacommunity
spec:
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: backup-config
        spec:
          # A new pod's first connection can be refused before the NetworkPolicy admits it; a restart keeps the pod.
          restartPolicy: OnFailure
          serviceAccountName: backup-config
          automountServiceAccountToken: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: workload-size
                        operator: In
                        values: [large, medium, small]
          tolerations:
            - key: workload-class
              operator: Equal
              value: amd64-opt-in
              effect: NoSchedule
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # load writes the encrypted files to /backup; only then does rclone put them in the bucket. Each holds
          # its own credentials: load the service account token and the Cloudflare token, rclone the R2 token.
          initContainers:
            - name: export
              image: ghcr.io/ttacommunity/ttacommunity/load:sha-e3b19a6d@sha256:0c013205b41cc56393303e30bfe2857aeda95ab66d491a28df8f70b67a9d0a98
              args: [-backup-config-to, /backup]
              env:
                - name: BACKUP_AGE_RECIPIENT
                  value: age1chparhxyn3kvlr245t8u9zvm9agar9v995dyptuygepuvmeujazqkre4r9
                - name: BACKUP_CONFIG_ZONE
                  value: ttacommunity.org
                - name: CLOUDFLARE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-readonly
                      key: token
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: docker.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
              # --immutable never replaces an object; --error-on-no-transfer fails (exit 9) a night with nothing to upload.
              args: [copy, /backup, "r2:ttacommunity-config-backup", --include, "*.json.age", --immutable, --error-on-no-transfer, --no-traverse, --s3-no-check-bucket, -v]
              env:
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: backup-config-r2
                      key: endpoint
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-config-r2
                      key: access-key-id
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-config-r2
                      key: secret-access-key
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 64Mi
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
