# The dev site's API: the same api, built from branch dev, reading the
# ratings_dev database as its read-only ratings_dev_api login.
---
apiVersion: v1
kind: Service
metadata:
  name: api-dev
  namespace: ttacommunity
  # The picluster repo's ServiceMonitor finds both apis' metrics by this label.
  labels:
    app.kubernetes.io/name: ttac-api
spec:
  type: ClusterIP
  selector:
    app: api-dev
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Prometheus only (networkpolicy.yaml); the tunnel maps 8080 alone.
    - name: metrics
      port: 8081
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-dev
  namespace: ttacommunity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-dev
  template:
    metadata:
      labels:
        app: api-dev
    spec:
      serviceAccountName: api-dev
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Any worker with a workload-size, unstableserver included; never the control plane or wsl-laptop.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-size
                    operator: In
                    values: [large, medium, small]
      tolerations:
        - key: workload-class
          operator: Equal
          value: amd64-opt-in
          effect: NoSchedule
      # Applies the ratings migrations to ratings_dev before the api starts, as its owner (goose's lock serialises pods).
      initContainers:
        - name: migrate
          image: ghcr.io/ttacommunity/ttacommunity/api:sha-5ff6c97e@sha256:2e1854b113901154d4c1c016c292c75ec48e20aa38b5c9e443114b68aa3c68f7
          args: [-migrate]
          env:
            - name: RATINGS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-dev-engine
                  key: database-url
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: ghcr.io/ttacommunity/ttacommunity/api:sha-5ff6c97e@sha256:2e1854b113901154d4c1c016c292c75ec48e20aa38b5c9e443114b68aa3c68f7
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: API_ADDR
              value: ":8080"
            - name: METRICS_ADDR
              value: ":8081"
            - name: RATINGS_READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-dev-api
                  key: database-url
            # Admin: its login, and the Access app and site its requests must come from.
            - name: RATINGS_ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-dev-admin
                  key: database-url
            - name: ACCESS_TEAM
              value: https://ttacommunitydev.cloudflareaccess.com
            - name: ENGINE_CRONJOB
              value: engine-dev
            - name: ACCESS_AUD
              value: 385c7c2eee5489fc256c2aadfc1299c1a79ce78b9b712523026ffb92bf757f82
            - name: ADMIN_ORIGIN
              value: https://dev.admin.ttacommunity.org
            # Player sign-in: its login, the site it returns to, this api's public origin for Discord's
            # callback, and the players' Discord app (not the one Access signs admins in with).
            - name: RATINGS_PLAYER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-dev-player
                  key: database-url
            - name: SITE_ORIGIN
              value: https://dev.ttacommunity.org
            - name: API_ORIGIN
              value: https://api-dev.ttacommunity.org
            - name: DISCORD_CLIENT_ID
              value: "1561606415443955752"
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: discord-signin
                  key: client-secret
            # Microsoft sign-in, for any personal, work or school account: the app "TTA Community" in its own
            # Entra tenant. The api refuses to start with only one of these.
            - name: MICROSOFT_CLIENT_ID
              value: c709d82a-eb5a-420d-b5e0-99ef97f491c3
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microsoft-signin
                  key: client-secret
            # Google sign-in: the Web client of the Google Cloud project "TTA Community". The api refuses to start
            # with only one of these.
            - name: GOOGLE_CLIENT_ID
              value: 666346564260-p8dq22hf4tik20i8oh6jsb3vodk308jc.apps.googleusercontent.com
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-signin
                  key: client-secret
            # Email sign-in: Resend sends the links from noreply@, the email names where to write, and
            # Turnstile guards the form. The api refuses to start with only some of these.
            - name: EMAIL_FROM
              value: "TTA Community <noreply@ttacommunity.org>"
            - name: EMAIL_SUPPORT
              value: support@ttacommunity.org
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: email-signin
                  key: resend-api-key
            - name: TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: turnstile-signin
                  key: secret
            # The dev site's visit count, with production's token: SITE_ORIGIN makes it count dev's host alone.
            - name: CLOUDFLARE_ANALYTICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-analytics
                  key: token
                  optional: true
            - name: CLOUDFLARE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-analytics
                  key: account-id
                  optional: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
