# The dev site's API: the same api, built from branch dev, reading the
# ratings_dev database as its read-only ratings_dev_api login.
---
apiVersion: v1
kind: Service
metadata:
  name: api-dev
  namespace: ttacommunity
spec:
  type: ClusterIP
  selector:
    app: api-dev
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-dev
  namespace: ttacommunity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-dev
  template:
    metadata:
      labels:
        app: api-dev
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.gitlab.com/unstablehomelab/ttacommunity/api:sha-7bbf97e9@sha256:20d0d2244cd402091b2d558a56d00831d34edd7c296eb8cc22f82062b5c47c8f
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_ADDR
              value: ":8080"
            - name: RATINGS_READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-dev-api
                  key: database-url
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
