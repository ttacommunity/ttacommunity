# The dev site's API: the same api, built from branch dev, reading the
# ratings_dev database as its read-only ratings_dev_api login.
---
apiVersion: v1
kind: Service
metadata:
  name: api-dev
  namespace: ttacommunity
  # The picluster repo's ServiceMonitor finds both apis' metrics by this label.
  labels:
    app.kubernetes.io/name: ttac-api
spec:
  type: ClusterIP
  selector:
    app: api-dev
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Prometheus only (networkpolicy.yaml); the tunnel maps 8080 alone.
    - name: metrics
      port: 8081
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-dev
  namespace: ttacommunity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-dev
  template:
    metadata:
      labels:
        app: api-dev
    spec:
      serviceAccountName: api-dev
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Applies the ratings migrations to ratings_dev before the api starts, as its owner (goose's lock serialises pods).
      initContainers:
        - name: migrate
          image: ghcr.io/ttacommunity/ttacommunity/api:sha-3984801f@sha256:228044cdb0613a06898cfce115b04bd988a1bd16a878cb951f121dd0431c48d4
          args: [-migrate]
          env:
            - name: RATINGS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-dev-engine
                  key: database-url
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: ghcr.io/ttacommunity/ttacommunity/api:sha-3984801f@sha256:228044cdb0613a06898cfce115b04bd988a1bd16a878cb951f121dd0431c48d4
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: API_ADDR
              value: ":8080"
            - name: METRICS_ADDR
              value: ":8081"
            - name: RATINGS_READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-dev-api
                  key: database-url
            # Admin: its login, and the Access app and site its requests must come from.
            - name: RATINGS_ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-dev-admin
                  key: database-url
            - name: ACCESS_TEAM
              value: https://unstableunicorn.cloudflareaccess.com
            - name: ENGINE_CRONJOB
              value: engine-dev
            - name: ACCESS_AUD
              value: f0bc8c99210a231edb4adc754229a5798e98f41ca67515da419535a251031136
            - name: ADMIN_ORIGIN
              value: https://dev.ttac-admin.unstableunicorn.dev
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
