# The dev API's own account, so admin can start a rating run now: it may read
# the engine-dev CronJob, and list and create Jobs in this namespace. Nothing else.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-dev
  namespace: ttacommunity
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-dev-starts-engine
  namespace: ttacommunity
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [engine-dev]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-dev-starts-engine
  namespace: ttacommunity
subjects:
  - kind: ServiceAccount
    name: api-dev
    namespace: ttacommunity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-dev-starts-engine
