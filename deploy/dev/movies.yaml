# The dev site's daily Movies job, deploy/movies.yaml for api-dev and ratings_dev: it subscribes the dev api's
# /v1/movies/hub to YouTube's push notifications, through the dev api's admin login. A run by hand:
#   kubectl -n ttacommunity create job --from=cronjob/movies-dev movies-dev-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: movies-dev
  namespace: ttacommunity
spec:
  schedule: "47 4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Two: a new pod's first database connection is refused, and its restart must not end the Job.
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: movies-dev
        spec:
          # A new pod's first connection can be refused before the NetworkPolicy admits it; a restart keeps the pod.
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: workload-size
                        operator: In
                        values: [large, medium, small]
          tolerations:
            - key: workload-class
              operator: Equal
              value: amd64-opt-in
              effect: NoSchedule
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: movies
              image: ghcr.io/ttacommunity/ttacommunity/load:sha-eca2ac68@sha256:9537f54a73cf18fd2a8ea5c57fc56c3097b51f2f4148b267be7855059a9d1a19
              args: [movies]
              env:
                - name: RATINGS_ADMIN_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ratings-dev-admin
                      key: database-url
                - name: MOVIES_HUB_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: movies-dev
                      key: hub-secret
                - name: YOUTUBE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: movies-dev
                      key: youtube-api-key
                - name: API_ORIGIN
                  value: https://api-dev.ttacommunity.org
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
