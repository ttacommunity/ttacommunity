# The dev site's feeds job, deploy/feeds.yaml for api-dev and ratings_dev: it posts only once dev's admin has
# a feed and a webhook taking it. A run by hand:
#   kubectl -n ttacommunity create job --from=cronjob/feeds-dev feeds-dev-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: feeds-dev
  namespace: ttacommunity
spec:
  schedule: "5-55/10 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Two: a new pod's first database connection is refused, and its restart must not end the Job.
      backoffLimit: 2
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app: feeds-dev
        spec:
          # A new pod's first connection can be refused before the NetworkPolicy admits it; a restart keeps the pod.
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: workload-size
                        operator: In
                        values: [large, medium, small]
          tolerations:
            - key: workload-class
              operator: Equal
              value: amd64-opt-in
              effect: NoSchedule
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: feeds
              image: ghcr.io/ttacommunity/ttacommunity/load:sha-7e09e320@sha256:7edcea90587cf191f0f1846e4a7d9e530f44665146c6555f0cafc3ff604133c5
              args: [feeds]
              env:
                - name: RATINGS_ADMIN_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ratings-dev-admin
                      key: database-url
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
