# The dev site's engine, built from branch dev, writing runs to ratings_dev as
# its owner, ratings_dev, which cannot write the parity database. Suspended:
#   kubectl -n ttacommunity create job --from=cronjob/engine-dev engine-dev-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: engine-dev
  namespace: ttacommunity
spec:
  suspend: true
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: engine-dev
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: unstableserver
          tolerations:
            - key: workload-class
              operator: Equal
              value: amd64-opt-in
              effect: NoSchedule
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: engine
              image: ghcr.io/ttacommunity/ttacommunity/engine:sha-ee4304bd@sha256:2071d694d71e1f3f327134ca0a9a47b1736f6652c31c384138dbad3000025046
              args: [-m, tta_ratings_engine.run, --workers, "4"]
              env:
                - name: RATINGS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ratings-dev-engine
                      key: database-url
              resources:
                # Four workers: ~2.3 GiB together in a local run.
                requests:
                  cpu: "4"
                  memory: 3Gi
                limits:
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
