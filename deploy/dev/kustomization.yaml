# What Flux applies from branch dev: the dev site's api, engine and tunnel,
# beside the parity site in the ttacommunity namespace. deploy/kustomization.yaml
# never lists this directory, so main's Flux source never applies it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - networkpolicy.yaml
  - api-rbac.yaml
  - api.yaml
  - engine.yaml
  - cloudflare-tunnel.yaml
