# What Flux applies from this repo. A file in deploy/ that is not listed here
# is never applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - ratings-db.yaml
  # Temporary: the database on the LAN for development. Remove when done.
  - ratings-db-lan.yaml
  - api.yaml
  - engine.yaml
  - cloudflare-tunnel.yaml
