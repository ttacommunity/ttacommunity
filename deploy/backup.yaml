# The nightly backup: every input table, personal data included, encrypted with
# age to the maintainers' public key by load, then put in the R2 bucket
# ttacommunity-backup by rclone (docs/architecture.md#backups). A run by hand:
#   kubectl -n ttacommunity create job --from=cronjob/backup backup-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: ttacommunity
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: backup
        spec:
          # A new pod's first connection can be refused before the NetworkPolicy admits it; a restart keeps the pod.
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: workload-size
                        operator: In
                        values: [large, medium, small]
          tolerations:
            - key: workload-class
              operator: Equal
              value: amd64-opt-in
              effect: NoSchedule
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # load writes the encrypted file to /backup; only then does rclone put it in the bucket. Each holds one credential.
          initContainers:
            - name: backup
              image: ghcr.io/ttacommunity/ttacommunity/load:sha-2ea9f222@sha256:d558e3897606a1399140c9474caa0b62ff4b394b75d65a3b5ad67dd67fcc071a
              args: [-backup-to, /backup]
              env:
                - name: RATINGS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ratings-backup
                      key: database-url
                - name: BACKUP_AGE_RECIPIENT
                  value: age1chparhxyn3kvlr245t8u9zvm9agar9v995dyptuygepuvmeujazqkre4r9
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: docker.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
              # --immutable never replaces an object; --error-on-no-transfer fails (exit 9) a night with nothing to upload.
              args: [copy, /backup, "r2:ttacommunity-backup/ratings", --include, "*.zip.age", --immutable, --error-on-no-transfer, --no-traverse, --s3-no-check-bucket, -v]
              env:
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: backup-r2
                      key: endpoint
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-r2
                      key: access-key-id
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-r2
                      key: secret-access-key
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
