# The Cloudflare tunnel that publishes ttac-api.unstableunicorn.dev. A hostname
# is only reachable once a DNS route points at the tunnel; see README.md.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ttacommunity-tunnel
  namespace: ttacommunity
data:
  config.yaml: |
    tunnel: 792ac193-b9ff-40b1-98df-197141287b0e
    credentials-file: /etc/cloudflared/creds/credentials.json
    ingress:
      - hostname: ttac-api.unstableunicorn.dev
        service: http://api.ttacommunity.svc.cluster.local:8080
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: ttacommunity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cloudflared
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
          # A fixed metrics port, or the liveness probe finds nothing.
          args: [tunnel, --metrics, "0.0.0.0:2000", --config, /etc/cloudflared/config.yaml, run]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # /ready answers 200 only while an edge connection is up.
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ttacommunity-tunnel
        - name: creds
          secret:
            secretName: ttacommunity-tunnel
