# The public JSON API. It reads the ratings database as the read-only
# ratings_api login and refuses to start if that login can write.
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ttacommunity
  # The picluster repo's ServiceMonitor finds both apis' metrics by this label.
  labels:
    app.kubernetes.io/name: ttac-api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Prometheus only (networkpolicy.yaml); the tunnel maps 8080 alone.
    - name: metrics
      port: 8081
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ttacommunity
spec:
  # Two, so an unattended node reboot does not take the API down.
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Its own account, which may start and stop the engine's runs (api-rbac.yaml).
      serviceAccountName: api
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Any worker with a workload-size, unstableserver included; never the control plane or wsl-laptop.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-size
                    operator: In
                    values: [large, medium, small]
      tolerations:
        - key: workload-class
          operator: Equal
          value: amd64-opt-in
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
      # Applies the ratings migrations before the api starts, as the database's owner (goose's lock serialises pods).
      initContainers:
        - name: migrate
          image: ghcr.io/ttacommunity/ttacommunity/api:sha-274acf8b@sha256:7fdea83bb053ef26c801968d2601700840a72938d0ddf3aafac4fb383b10e6b1
          args: [-migrate]
          env:
            - name: RATINGS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-engine
                  key: database-url
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: ghcr.io/ttacommunity/ttacommunity/api:sha-274acf8b@sha256:7fdea83bb053ef26c801968d2601700840a72938d0ddf3aafac4fb383b10e6b1
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: API_ADDR
              value: ":8080"
            - name: METRICS_ADDR
              value: ":8081"
            - name: RATINGS_READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-api
                  key: database-url
            # Admin: its login, and the Access app and site its requests must come from.
            - name: RATINGS_ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-admin
                  key: database-url
            - name: ACCESS_TEAM
              value: https://ttacommunitydev.cloudflareaccess.com
            - name: ENGINE_CRONJOB
              value: engine
            - name: ACCESS_AUD
              value: 385c7c2eee5489fc256c2aadfc1299c1a79ce78b9b712523026ffb92bf757f82
            - name: ADMIN_ORIGIN
              value: https://admin.ttacommunity.org
            # Player sign-in: its login, the site it returns to, this api's public origin for Discord's
            # callback, and the players' Discord app (not the one Access signs admins in with).
            - name: RATINGS_PLAYER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ratings-player
                  key: database-url
            - name: SITE_ORIGIN
              value: https://ttacommunity.org
            - name: API_ORIGIN
              value: https://api.ttacommunity.org
            - name: DISCORD_CLIENT_ID
              value: "1561606415443955752"
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: discord-signin
                  key: client-secret
            # The Discord bot's endpoint (/v1/discord/interactions): the public key of the app "TTA Community Hub",
            # which every request must be signed with. Not a secret.
            - name: DISCORD_APP_PUBLIC_KEY
              value: 2db20ec76c297c9a91bc5d54f2561e3d4fae559178d34c05bda04ed17d068840
            # Microsoft sign-in, for any personal, work or school account: the app "TTA Community" in its own
            # Entra tenant. The api refuses to start with only one of these.
            - name: MICROSOFT_CLIENT_ID
              value: c709d82a-eb5a-420d-b5e0-99ef97f491c3
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microsoft-signin
                  key: client-secret
            # Google sign-in: the Web client of the Google Cloud project "TTA Community". The api refuses to start
            # with only one of these.
            - name: GOOGLE_CLIENT_ID
              value: 666346564260-p8dq22hf4tik20i8oh6jsb3vodk308jc.apps.googleusercontent.com
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-signin
                  key: client-secret
            # Email sign-in: Resend sends the links from noreply@, the email names where to write, and
            # Turnstile guards the form. The api refuses to start with only some of these.
            - name: EMAIL_FROM
              value: "TTA Community <noreply@ttacommunity.org>"
            - name: EMAIL_SUPPORT
              value: support@ttacommunity.org
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: email-signin
                  key: resend-api-key
            - name: TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: turnstile-signin
                  key: secret
            # The site's visit count (/v1/site/visits), from Cloudflare Web Analytics. Without the Secret
            # counting is off; with one key alone the api refuses to start.
            - name: CLOUDFLARE_ANALYTICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-analytics
                  key: token
                  optional: true
            - name: CLOUDFLARE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-analytics
                  key: account-id
                  optional: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
---
# A node drain leaves at least one api running.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: ttacommunity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
