# The rating engine: one run of every model, writing a new rating run. It never
# publishes the run. Suspended, so it runs only when started by hand:
#   kubectl -n ttacommunity create job --from=cronjob/engine engine-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: engine
  namespace: ttacommunity
spec:
  suspend: true
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      # A full run takes ~20 minutes on a desktop.
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: engine
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: unstableserver
          tolerations:
            - key: workload-class
              operator: Equal
              value: amd64-opt-in
              effect: NoSchedule
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: gitlab-registry
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: engine
              image: registry.gitlab.com/unstablehomelab/ttacommunity/engine:sha-b0615abe@sha256:8f8cdd566843c063b917444c423c0dfb58fffc01a47aba0abb6a0a3b5db56f4c
              args: [-m, tta_ratings_engine.run]
              env:
                # The commit the image was built from.
                - name: ENGINE_VERSION
                  value: b0615abe
                - name: RATINGS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ratings-engine
                      key: database-url
              resources:
                requests:
                  cpu: "1"
                  memory: 1536Mi
                limits:
                  memory: 3Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
