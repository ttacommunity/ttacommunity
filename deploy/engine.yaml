# The rating engine: one run of every model, writing a new rating run. It never
# publishes the run. Suspended, so it runs only when started by hand:
#   kubectl -n ttacommunity create job --from=cronjob/engine engine-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: engine
  namespace: ttacommunity
spec:
  suspend: true
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      # A full run takes ~20 minutes on a desktop.
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: engine
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: unstableserver
          tolerations:
            - key: workload-class
              operator: Equal
              value: amd64-opt-in
              effect: NoSchedule
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: engine
              image: ghcr.io/ttacommunity/ttacommunity/engine:sha-dfe18ff9@sha256:da04e6092e3a8dc840358ca77628f61e93fb3b36d2d9f6279a14b7c7bf11a267
              args: [-m, tta_ratings_engine.run, --workers, "4"]
              env:
                # The commit the image was built from.
                - name: ENGINE_VERSION
                  value: "dfe18ff9"
                - name: RATINGS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ratings-engine
                      key: database-url
              resources:
                # Four workers: ~2.3 GiB together in a local run.
                requests:
                  cpu: "4"
                  memory: 3Gi
                limits:
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
