# The rating engine: one run of every model, writing a new rating run. It never
# publishes the run. Suspended, so it runs only when started by hand:
#   kubectl -n ttacommunity create job --from=cronjob/engine engine-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: engine
  namespace: ttacommunity
spec:
  suspend: true
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      # A full run takes ~20 minutes on a desktop.
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: engine
        spec:
          restartPolicy: Never
          # An amd64 large node (the image is amd64 only), unstableserver when it is up.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: workload-size
                        operator: In
                        values: [large]
                      - key: kubernetes.io/arch
                        operator: In
                        values: [amd64]
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [unstableserver]
          tolerations:
            - key: workload-class
              operator: Equal
              value: amd64-opt-in
              effect: NoSchedule
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: engine
              image: ghcr.io/ttacommunity/ttacommunity/engine:sha-a075792f@sha256:0a63598d22133a52105dfea80f561cd91c8006826117118ab966fc71dcd65878
              args: [-m, tta_ratings_engine.run, --workers, "4"]
              env:
                - name: RATINGS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ratings-engine
                      key: database-url
              resources:
                # Four workers: ~2.3 GiB together in a local run.
                requests:
                  cpu: "4"
                  memory: 3Gi
                limits:
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
