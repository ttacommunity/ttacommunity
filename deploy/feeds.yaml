# The feeds job, every 10 minutes: reads each RSS and Atom feed admin lists and queues its new items, which the api
# posts to the Discord webhooks taking that feed. It writes through the api's admin login. A run by hand:
#   kubectl -n ttacommunity create job --from=cronjob/feeds feeds-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: feeds
  namespace: ttacommunity
spec:
  schedule: "*/10 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Two: a new pod's first database connection is refused (below), and its restart must not end the Job.
      backoffLimit: 2
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app: feeds
        spec:
          # A new pod's first connection can be refused before the NetworkPolicy admits it; a restart keeps the pod.
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: workload-size
                        operator: In
                        values: [large, medium, small]
          tolerations:
            - key: workload-class
              operator: Equal
              value: amd64-opt-in
              effect: NoSchedule
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: feeds
              image: ghcr.io/ttacommunity/ttacommunity/load:sha-52aec2d8@sha256:b49e3e8993398dcb59f8951a4e78932cccba6b63969ed7953d1420cd06c13960
              args: [feeds]
              env:
                - name: RATINGS_ADMIN_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ratings-admin
                      key: database-url
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
