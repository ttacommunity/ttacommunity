# The daily Movies job: reads every creator's videos again from the Data API, renews every channel's
# subscription to YouTube's push notifications (to the api's /v1/movies/hub), then drops the videos YouTube
# no longer shows and reads the details still missing. It writes through the api's admin login. A run by hand:
#   kubectl -n ttacommunity create job --from=cronjob/movies movies-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: movies
  namespace: ttacommunity
spec:
  schedule: "17 4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Two: a new pod's first database connection is refused (below), and its restart must not end the Job.
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: movies
        spec:
          # A new pod's first connection can be refused before the NetworkPolicy admits it; a restart keeps the pod.
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: workload-size
                        operator: In
                        values: [large, medium, small]
          tolerations:
            - key: workload-class
              operator: Equal
              value: amd64-opt-in
              effect: NoSchedule
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: movies
              image: ghcr.io/ttacommunity/ttacommunity/load:sha-7e09e320@sha256:7edcea90587cf191f0f1846e4a7d9e530f44665146c6555f0cafc3ff604133c5
              args: [movies]
              env:
                - name: RATINGS_ADMIN_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ratings-admin
                      key: database-url
                - name: MOVIES_HUB_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: movies
                      key: hub-secret
                - name: YOUTUBE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: movies
                      key: youtube-api-key
                - name: API_ORIGIN
                  value: https://api.ttacommunity.org
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
