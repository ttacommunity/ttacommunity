packages:
  - site
  - admin
  - shared

# Security fixes in packages we only get through others, until those others
# ask for them; drop a line when `pnpm audit --prod` stays clean without it.
# katex: one version for the build's rehype-katex (which asks for ^0.16) and
# the browser's <Tex>, so a formula renders the same in both.
overrides:
  http-cache-semantics: ^4.3.0
  katex: 0.18.11
  sharp: ^0.35.5
  source-map-js: ^1.2.2

# Only these packages may run install scripts (esbuild fetches its binary).
allowBuilds:
  esbuild: true


# eslint-plugin-jsx-a11y is aliased to its fork, eslint-plugin-jsx-a11y-x, which
# supports ESLint 10. The fork's own version numbers restart at 0.x.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-astro>eslint-plugin-jsx-a11y: '0.2'
    # openapi-typescript only prints generated types, and its output is
    # checked by `astro check` on TypeScript 6. Its peer range predates 6.
    openapi-typescript>typescript: '6'
