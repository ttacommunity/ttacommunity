# Manual: run the Windows scripts on GitHub's Windows runner, in Windows
# PowerShell 5.1 as a contributor's machine has it: install, then every test.

name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      # A throwaway runner's local superuser; not a secret.
      PG_SUPERPASSWORD: ci-only-not-a-real-secret
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts\install.ps1
      - run: scripts\test.ps1
