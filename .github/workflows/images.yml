# Build the api, load and engine images and push them to GHCR as sha-<commit>: on main,
# and on a pull request labelled "images" (its head commit, to pin in that PR).
# Pinning a digest in deploy/ is a reviewed commit; CI never commits one.

name: images

on:
  push:
    branches: [main]
    paths: [backend/**, engine/**, scripts/engine-image.sh, mise.toml, .github/workflows/images.yml]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # bash runs with -eo pipefail; the container's default sh hides a failure before a pipe.
    shell: bash

env:
  MISE_YES: '1'
  # The checkout belongs to another user than the job container's root.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
  REGISTRY: ghcr.io/${{ github.repository }}
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  api:
    runs-on: ${{ vars.RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 15 # a build takes 4; a step killed at the runner's memory limit otherwise waits for hours
    container: docker.io/library/buildpack-deps:trixie@sha256:880a5e3d451b50a7b1acd06093a980771a40c2fac2bce29a2145e0f4825266f4
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'images')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.COMMIT }}
      - name: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/install-mise.sh /usr/local/bin
          mise trust && mise install go ko crane jq
      # ko builds in userspace, with mise's Go; platforms come from backend/.ko.yaml.
      - env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          echo "$TOKEN" | ko login ghcr.io -u "$ACTOR" --password-stdin
          cd backend
          # One platform at a time: both at once outgrow the job's 1 GiB.
          ref=$(KO_DOCKER_REPO="$REGISTRY/api" ko build ./cmd/api --bare --jobs 1 --tags "sha-${COMMIT::8}")
          crane manifest "$ref" | jq -e '[.manifests[].platform.architecture] | contains(["amd64", "arm64"])'
          echo "api image $ref" | tee -a "$GITHUB_STEP_SUMMARY"
          ref=$(KO_DOCKER_REPO="$REGISTRY/load" ko build ./cmd/load --bare --jobs 1 --tags "sha-${COMMIT::8}")
          crane manifest "$ref" | jq -e '[.manifests[].platform.architecture] | contains(["amd64", "arm64"])'
          echo "load image $ref" | tee -a "$GITHUB_STEP_SUMMARY"

  engine:
    runs-on: ${{ vars.RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 15
    container: docker.io/library/buildpack-deps:trixie@sha256:880a5e3d451b50a7b1acd06093a980771a40c2fac2bce29a2145e0f4825266f4
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'images')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.COMMIT }}
      - name: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/install-mise.sh /usr/local/bin
          mise trust && mise install uv crane jq
      - env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          echo "$TOKEN" | crane auth login ghcr.io -u "$ACTOR" --password-stdin
          ref="$REGISTRY/engine:sha-${COMMIT::8}"
          digest=$(scripts/engine-image.sh "$ref")
          crane config "$ref" | jq -e '.architecture == "amd64" and .config.User == "65532:65532"'
          echo "engine image $ref@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
