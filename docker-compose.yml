# Everything in containers: the ratings database, api, the engine and the
# site's dev server. Start it with scripts/dev.sh. Ports bind to localhost only.
name: ttacommunity

services:
  ratings-db:
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ratings
      POSTGRES_DB: ratings
      POSTGRES_PASSWORD: ${RATINGS_DB_PASSWORD:?set RATINGS_DB_PASSWORD in .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [ratings-db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ratings", "-d", "ratings"]
      interval: 2s
      retries: 30

  api:
    build: { context: backend, target: api }
    environment:
      API_ADDR: :8080
      METRICS_ADDR: :8081
      RATINGS_READ_DATABASE_URL: postgres://ratings_api:${RATINGS_READ_DB_PASSWORD:?set RATINGS_READ_DB_PASSWORD in .env}@ratings-db:5432/ratings?sslmode=disable
      RATINGS_ADMIN_DATABASE_URL: postgres://ratings_admin_api:${RATINGS_ADMIN_DB_PASSWORD:?set RATINGS_ADMIN_DB_PASSWORD in .env}@ratings-db:5432/ratings?sslmode=disable
      ACCESS_TEAM: ${ACCESS_TEAM:?set ACCESS_TEAM in .env}
      ACCESS_AUD: ${ACCESS_AUD:?set ACCESS_AUD in .env}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?set ADMIN_ORIGIN in .env}
      RATINGS_PLAYER_DATABASE_URL: postgres://ratings_player_api:${RATINGS_PLAYER_DB_PASSWORD:?set RATINGS_PLAYER_DB_PASSWORD in .env}@ratings-db:5432/ratings?sslmode=disable
      SITE_ORIGIN: ${SITE_ORIGIN:?set SITE_ORIGIN in .env}
      API_ORIGIN: ${API_ORIGIN:?set API_ORIGIN in .env}
      # The Discord stand-in is for native runs only: here, a Discord app from .env, or a placeholder that starts the
      # api with sign-in failing at Discord.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-100000000000000099}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-local-only-no-discord-app}
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    depends_on:
      ratings-db: { condition: service_healthy }

  # Seeds the ratings DB: restores a baseline export, or loads match CSVs. scripts/ratings-db.sh mounts the directory.
  load:
    build: { context: backend, target: load }
    profiles: [load]
    environment:
      RATINGS_DATABASE_URL: postgres://ratings:${RATINGS_DB_PASSWORD}@ratings-db:5432/ratings?sslmode=disable
    depends_on:
      ratings-db: { condition: service_healthy }

  # A one-shot job, like the CronJob it stands in for. scripts/dev.sh runs it once.
  engine:
    build: { context: engine }
    profiles: [engine]
    environment:
      RATINGS_DATABASE_URL: postgres://ratings:${RATINGS_DB_PASSWORD}@ratings-db:5432/ratings?sslmode=disable
    depends_on:
      ratings-db: { condition: service_healthy }

  site:
    image: docker.io/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    working_dir: /web
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      npm_config_store_dir: /pnpm-store
    command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm --filter @ttac/site dev --host 0.0.0.0"
    ports: ["127.0.0.1:4321:4321"]
    volumes:
      - ./web:/web:z
      # The container's own node_modules, so host and container never share native binaries.
      - /web/node_modules
      - /web/site/node_modules
      - /web/admin/node_modules
      - /web/shared/node_modules
      - pnpm-store:/pnpm-store

volumes:
  ratings-db:
  pnpm-store:
