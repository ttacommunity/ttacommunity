# Toolchain versions for native development and CI. `mise install` fetches them.
# pnpm is pinned by web/package.json (packageManager) and run through corepack.
[tools]
node = "24.21.0"
go = "1.27.1"
uv = "0.12.19"
crane = "0.22.1"
ko = "0.19.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
gitleaks = "8.30.1"
"pipx:semgrep" = "1.179.0"
